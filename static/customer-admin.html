<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>D2D Customer Admin</title>
<script src='https://cdn.tailwindcss.com'></script>
<style>
html,body { height:100%; margin:0; background:#0f172a; color:#e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
.card { background:#1e293b; border:1px solid #334155; border-radius:0.5rem; padding:1rem; }
.btn { padding:0.35rem 0.75rem; border-radius:0.375rem; font-size:0.875rem; }
.btn-primary { background:#2563eb; }
.btn-primary:hover { background:#1d4ed8; }
.btn-danger { background:#dc2626; }
.btn-danger:hover { background:#b91c1c; }
input, select, textarea { background:#0f172a; border:1px solid #334155; color:#e2e8f0; padding:0.35rem 0.5rem; border-radius:0.25rem; font-size:0.875rem; }
table { width:100%; border-collapse:collapse; font-size:0.8rem; }
th, td { padding:0.5rem; border-bottom:1px solid #334155; text-align:left; }
th { color:#94a3b8; text-transform:uppercase; font-size:0.7rem; }
.tag { background:#334155; padding:0.15rem 0.4rem; border-radius:0.25rem; font-size:0.75rem; }
</style>
</head>
<body class='p-4'>
  <div class='max-w-6xl mx-auto space-y-4'>
    <div class='flex justify-between items-center'>
      <h1 class='text-2xl font-bold'>D2D <span class='text-slate-400 font-normal'>Customer Admin</span></h1>
      <div class='space-x-2'>
        <a href='/' class='btn bg-slate-700 hover:bg-slate-600 text-white'>Dashboard</a>
        <a href='/admin' class='btn bg-slate-700 hover:bg-slate-600 text-white'>System Admin</a>
        <button class='btn btn-danger' onclick='logout()'>Logout</button>
      </div>
    </div>

    <div class='card'>
      <label class='block text-sm text-slate-400 mb-1'>Agency</label>
      <select id='agencySelect' class='w-full'><option value=''>Select agency</option></select>
    </div>

    <div id='setup' class='hidden space-y-4'>
      <div class='card'>
        <h2 class='font-semibold mb-2 border-b border-slate-700 pb-2'>Enabled Modules</h2>
        <div class='flex gap-4 text-sm'>
          <label class='flex items-center gap-1'><input type='checkbox' value='ems' class='module-check'> EMS</label>
          <label class='flex items-center gap-1'><input type='checkbox' value='fire' class='module-check'> Fire</label>
          <label class='flex items-center gap-1'><input type='checkbox' value='law' class='module-check'> Law</label>
        </div>
        <button id='saveModules' class='btn btn-primary text-white mt-2'>Save Modules</button>
      </div>

      <div class='card'>
        <h2 class='font-semibold mb-2 border-b border-slate-700 pb-2'>Call Types</h2>
        <div id='callTypeList' class='mb-2'></div>
        <form id='callTypeForm' class='grid grid-cols-1 sm:grid-cols-4 gap-2'>
          <input type='hidden' id='ctEditIndex'>
          <input id='ctLabel' placeholder='Label' required>
          <input id='ctPriority' placeholder='Priority' type='number' value='2' required>
          <input id='ctFields' placeholder='Fields (comma sep)'>
          <div class='flex gap-2'>
            <button id='ctSubmit' class='btn btn-primary text-white flex-1'>Add Call Type</button>
            <button type='button' id='ctCancel' class='btn bg-slate-700 hover:bg-slate-600 text-white hidden' onclick='resetCallTypeForm()'>Cancel</button>
          </div>
        </form>
      </div>

      <div class='card'>
        <h2 class='font-semibold mb-2 border-b border-slate-700 pb-2'>Unit Types</h2>
        <div id='unitTypeList' class='mb-2 flex flex-wrap gap-1'></div>
        <form id='unitTypeForm' class='flex gap-2'>
          <input type='hidden' id='utEditIndex'>
          <input id='utName' placeholder='Unit Type' class='flex-1' required>
          <div class='flex gap-2'>
            <button id='utSubmit' class='btn btn-primary text-white'>Add Unit Type</button>
            <button type='button' id='utCancel' class='btn bg-slate-700 hover:bg-slate-600 text-white hidden' onclick='resetUnitTypeForm()'>Cancel</button>
          </div>
        </form>
      </div>

      <div class='card'>
        <h2 class='font-semibold mb-2 border-b border-slate-700 pb-2' id='destFormTitle'>Saved Locations</h2>
        <div id='destList' class='mb-2 overflow-x-auto'></div>
        <form id='destForm' class='grid grid-cols-1 sm:grid-cols-6 gap-2'>
          <input type='hidden' id='dId'>
          <input id='dName' placeholder='Name' required>
          <input id='dAddress' placeholder='Address'>
          <input id='dLat' placeholder='Lat' type='number' step='any'>
          <input id='dLng' placeholder='Lng' type='number' step='any'>
          <input id='dCategory' placeholder='Category'>
          <div class='flex gap-2'>
            <button id='dSubmit' class='btn btn-primary text-white flex-1'>Add Location</button>
            <button type='button' id='dCancel' class='btn bg-slate-700 hover:bg-slate-600 text-white hidden' onclick='resetDestForm()'>Cancel</button>
          </div>
        </form>
      </div>

      <div class='card'>
        <h2 class='font-semibold mb-2 border-b border-slate-700 pb-2' id='personnelFormTitle'>Crew Members</h2>
        <div id='personnelList' class='mb-2 overflow-x-auto'></div>
        <form id='personnelForm' class='grid grid-cols-1 sm:grid-cols-4 gap-2'>
          <input type='hidden' id='pId'>
          <input id='pFirst' placeholder='First' required>
          <input id='pLast' placeholder='Last' required>
          <input id='pRadio' placeholder='Radio ID'>
          <input id='pPhone' placeholder='Phone'>
          <input id='pEmail' placeholder='Email'>
          <select id='pDuty' class='w-full'><option value='off_duty'>Off Duty</option><option value='on_duty'>On Duty</option></select>
          <select id='pUnit' class='w-full'><option value=''>No unit</option></select>
          <div class='flex gap-2'>
            <button id='pSubmit' class='btn btn-primary text-white flex-1'>Add Crew</button>
            <button type='button' id='pCancel' class='btn bg-slate-700 hover:bg-slate-600 text-white hidden' onclick='resetPersonnelForm()'>Cancel</button>
          </div>
        </form>
      </div>

      <div class='card'>
        <h2 class='font-semibold mb-2 border-b border-slate-700 pb-2' id='unitFormTitle'>Units</h2>
        <div id='unitList' class='mb-2 overflow-x-auto'></div>
        <form id='unitForm' class='grid grid-cols-1 sm:grid-cols-4 gap-2'>
          <input type='hidden' id='uId'>
          <input id='uName' placeholder='Name' required>
          <input id='uCallSign' placeholder='Call Sign' required>
          <select id='uUnitType' class='w-full' required><option value=''>Select unit type</option></select>
          <input id='uRadio' placeholder='Radio ID'>
          <input id='uTaip' placeholder='TAIP ID'>
          <input id='uTaipUrl' placeholder='TAIP Destination URL'>
          <input id='uTaipPort' placeholder='Port #' type='number'>
          <input id='uLat' placeholder='Lat' type='number' step='any'>
          <input id='uLng' placeholder='Lng' type='number' step='any'>
          <div class='flex gap-2'>
            <button id='uSubmit' class='btn btn-primary text-white flex-1'>Add Unit</button>
            <button type='button' id='uCancel' class='btn bg-slate-700 hover:bg-slate-600 text-white hidden' onclick='resetUnitForm()'>Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

<script>
function api(path, opts={}){ return fetch(path, {...opts, credentials:'include'}).then(r=>{ if(r.status===401){ window.location.href='/login'; throw new Error('Unauthorized'); } if(!r.ok) throw new Error(`${path} ${r.status}`); return r.json(); }); }

let state = {agencies:[], agency_id:null, call_types:[], unit_types:[], units:[], personnel:[]};

async function loadAgencies(){
  state.agencies = await api('/agencies');
  document.getElementById('agencySelect').innerHTML = '<option value="">Select agency</option>' + state.agencies.map(a=>`<option value='${a.id}'>${a.name} (${a.agency_type})</option>`).join('');
}

document.getElementById('agencySelect').addEventListener('change', async e=>{
  state.agency_id = parseInt(e.target.value) || null;
  if(!state.agency_id){ document.getElementById('setup').classList.add('hidden'); return; }
  document.getElementById('setup').classList.remove('hidden');
  await loadModules();
  await loadCallTypes();
  await loadUnitTypes();
  await loadDestinations();
  await loadUnits();
  await loadPersonnel();
});

async function getConfigValue(category){
  const cfg = await api(`/config?agency_id=${state.agency_id}&category=${category}`);
  return (cfg && cfg.length) ? cfg[0].value : null;
}

async function setConfigValue(category, value){
  await api('/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agency_id:state.agency_id,category,value,key:'defaults'})});
}

async function loadModules(){
  const v = await getConfigValue('modules') || [];
  document.querySelectorAll('.module-check').forEach(cb=>cb.checked = v.includes(cb.value));
}

document.getElementById('saveModules').addEventListener('click', async ()=>{
  const modules = [...document.querySelectorAll('.module-check:checked')].map(cb=>cb.value);
  await setConfigValue('modules', modules);
  alert('Modules saved');
});

async function loadCallTypes(){
  state.call_types = await getConfigValue('call_types') || [];
  const el = document.getElementById('callTypeList');
  el.innerHTML = state.call_types.length ? `<table><thead><tr><th>Label</th><th>Priority</th><th>Fields</th><th></th></tr></thead><tbody>${state.call_types.map((c,i)=>`<tr><td>${c.label}</td><td>${c.priority}</td><td>${(c.fields||[]).join(', ')}</td><td class='space-x-1'><button class='btn bg-slate-700 hover:bg-slate-600 text-white' onclick='editCallType(${i})'>Edit</button><button class='btn btn-danger' onclick='deleteCallType(${i})'>Delete</button></td></tr>`).join('')}</tbody></table>` : '<div class="text-slate-500">No call types.</div>';
}

function resetCallTypeForm(){
  document.getElementById('callTypeForm').reset(); document.getElementById('ctEditIndex').value='';
  document.getElementById('ctSubmit').textContent='Add Call Type';
  document.getElementById('ctCancel').classList.add('hidden');
}

function editCallType(i){
  const c = state.call_types[i];
  document.getElementById('ctEditIndex').value=i;
  document.getElementById('ctLabel').value=c.label;
  document.getElementById('ctPriority').value=c.priority;
  document.getElementById('ctFields').value=(c.fields||[]).join(', ');
  document.getElementById('ctSubmit').textContent='Update Call Type';
  document.getElementById('ctCancel').classList.remove('hidden');
}

async function deleteCallType(i){
  if(!confirm('Delete this call type?')) return;
  state.call_types.splice(i,1);
  await setConfigValue('call_types', state.call_types);
  resetCallTypeForm(); await loadCallTypes();
}

document.getElementById('callTypeForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const fields = document.getElementById('ctFields').value.split(',').map(s=>s.trim()).filter(Boolean);
  const item = {label: document.getElementById('ctLabel').value, priority: parseInt(document.getElementById('ctPriority').value), fields};
  const idx = document.getElementById('ctEditIndex').value;
  if(idx!=='') state.call_types[parseInt(idx)] = item; else state.call_types.push(item);
  await setConfigValue('call_types', state.call_types);
  resetCallTypeForm();
  await loadCallTypes();
});

async function loadUnitTypes(){
  state.unit_types = await getConfigValue('unit_types') || [];
  document.getElementById('unitTypeList').innerHTML = state.unit_types.map((u,i)=>`<span class='tag flex items-center gap-1'>${u}<button class='ml-1 text-slate-400 hover:text-white' onclick='editUnitType(${i})'>&#9998;</button><button class='ml-1 text-red-400 hover:text-red-200' onclick='deleteUnitType(${i})'>&times;</button></span>`).join('');
  const opts = state.unit_types.map(u=>`<option value='${u}'>${u}</option>`).join('');
  document.getElementById('uUnitType').innerHTML = '<option value="">Select unit type</option>' + opts;
}

function resetUnitTypeForm(){
  document.getElementById('unitTypeForm').reset(); document.getElementById('utEditIndex').value='';
  document.getElementById('utSubmit').textContent='Add Unit Type';
  document.getElementById('utCancel').classList.add('hidden');
}

function editUnitType(i){
  document.getElementById('utEditIndex').value=i;
  document.getElementById('utName').value=state.unit_types[i];
  document.getElementById('utSubmit').textContent='Update Unit Type';
  document.getElementById('utCancel').classList.remove('hidden');
}

async function deleteUnitType(i){
  if(!confirm('Delete this unit type?')) return;
  state.unit_types.splice(i,1);
  await setConfigValue('unit_types', state.unit_types);
  resetUnitTypeForm(); await loadUnitTypes();
}

document.getElementById('unitTypeForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const name = document.getElementById('utName').value;
  const idx = document.getElementById('utEditIndex').value;
  if(idx!=='') state.unit_types[parseInt(idx)] = name; else state.unit_types.push(name);
  await setConfigValue('unit_types', state.unit_types);
  resetUnitTypeForm();
  await loadUnitTypes();
});

async function loadDestinations(){
  const list = await api(`/destinations?agency_id=${state.agency_id}`);
  document.getElementById('destList').innerHTML = list.length ? `<table><thead><tr><th>Name</th><th>Address</th><th>Category</th><th></th></tr></thead><tbody>${list.map(d=>`<tr><td>${d.name}</td><td>${d.address||'-'}</td><td>${d.category||'-'}</td><td class='space-x-1'><button class='btn bg-slate-700 hover:bg-slate-600 text-white' onclick='editDestination(${JSON.stringify(d).replace(/'/g,"&#39;")})'>Edit</button><button class='btn btn-danger' onclick='deleteDestination(${d.id})'>Delete</button></td></tr>`).join('')}</tbody></table>` : '<div class="text-slate-500">No saved locations.</div>';
}

function resetDestForm(){
  document.getElementById('destForm').reset(); document.getElementById('dId').value='';
  document.getElementById('destFormTitle').textContent='Saved Locations';
  document.getElementById('dSubmit').textContent='Add Location';
  document.getElementById('dCancel').classList.add('hidden');
}

function editDestination(d){
  document.getElementById('dId').value=d.id;
  document.getElementById('dName').value=d.name;
  document.getElementById('dAddress').value=d.address||'';
  document.getElementById('dLat').value=d.lat||'';
  document.getElementById('dLng').value=d.lng||'';
  document.getElementById('dCategory').value=d.category||'';
  document.getElementById('destFormTitle').textContent='Edit Location';
  document.getElementById('dSubmit').textContent='Update Location';
  document.getElementById('dCancel').classList.remove('hidden');
}

async function deleteDestination(id){
  if(!confirm('Delete this saved location?')) return;
  try { await api(`/destinations/${id}`,{method:'DELETE'}); resetDestForm(); await loadDestinations(); } catch(err){ alert(err.message); }
}

document.getElementById('destForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const body = {
    agency_id: state.agency_id,
    name: document.getElementById('dName').value,
    address: document.getElementById('dAddress').value,
    lat: parseFloat(document.getElementById('dLat').value) || null,
    lng: parseFloat(document.getElementById('dLng').value) || null,
    category: document.getElementById('dCategory').value
  };
  const id = document.getElementById('dId').value;
  try {
    if(id){ await api(`/destinations/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
    else { await api('/destinations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
    resetDestForm(); await loadDestinations();
  } catch(err){ alert(err.message); }
});

async function loadUnits(){
  state.units = await api(`/units?agency_id=${state.agency_id}`);
  document.getElementById('unitList').innerHTML = state.units.length ? `<table><thead><tr><th>Call Sign</th><th>Name</th><th>Type</th><th>Status</th><th></th></tr></thead><tbody>${state.units.map(u=>`<tr><td>${u.call_sign}</td><td>${u.name}</td><td>${u.unit_type}</td><td>${u.current_status}</td><td class='space-x-1'><button class='btn bg-slate-700 hover:bg-slate-600 text-white' onclick='editUnit(${JSON.stringify(u).replace(/'/g,"&#39;")})'>Edit</button><button class='btn btn-danger' onclick='deleteUnit(${u.id})'>Delete</button></td></tr>`).join('')}</tbody></table>` : '<div class="text-slate-500">No units.</div>';
  const opts = state.units.map(u=>`<option value='${u.id}'>${u.call_sign}</option>`).join('');
  document.getElementById('pUnit').innerHTML = '<option value="">No unit</option>' + opts;
}

function resetUnitForm(){
  document.getElementById('unitForm').reset(); document.getElementById('uId').value='';
  document.getElementById('unitFormTitle').textContent='Units';
  document.getElementById('uSubmit').textContent='Add Unit';
  document.getElementById('uCancel').classList.add('hidden');
}

function editUnit(u){
  document.getElementById('uId').value=u.id;
  document.getElementById('uName').value=u.name;
  document.getElementById('uCallSign').value=u.call_sign;
  document.getElementById('uUnitType').value=u.unit_type;
  document.getElementById('uRadio').value=u.radio_id||'';
  document.getElementById('uTaip').value=u.taip_id||'';
  document.getElementById('uTaipUrl').value=u.taip_destination_url||'';
  document.getElementById('uTaipPort').value=u.taip_port||'';
  document.getElementById('uLat').value=u.lat||'';
  document.getElementById('uLng').value=u.lng||'';
  document.getElementById('unitFormTitle').textContent='Edit Unit';
  document.getElementById('uSubmit').textContent='Update Unit';
  document.getElementById('uCancel').classList.remove('hidden');
}

async function deleteUnit(id){
  if(!confirm('Delete this unit?')) return;
  try { await api(`/units/${id}`,{method:'DELETE'}); resetUnitForm(); await loadUnits(); } catch(err){ alert(err.message); }
}

document.getElementById('unitForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const body = {
    agency_id: state.agency_id,
    name: document.getElementById('uName').value,
    call_sign: document.getElementById('uCallSign').value,
    unit_type: document.getElementById('uUnitType').value,
    radio_id: document.getElementById('uRadio').value,
    taip_id: document.getElementById('uTaip').value,
    taip_destination_url: document.getElementById('uTaipUrl').value || null,
    taip_port: document.getElementById('uTaipPort').value ? parseInt(document.getElementById('uTaipPort').value) : null,
    lat: parseFloat(document.getElementById('uLat').value) || null,
    lng: parseFloat(document.getElementById('uLng').value) || null
  };
  const id = document.getElementById('uId').value;
  try {
    if(id){ await api(`/units/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
    else { await api('/units',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
    resetUnitForm(); await loadUnits();
  } catch(err){ alert(err.message); }
});

async function loadPersonnel(){
  state.personnel = await api(`/personnel?agency_id=${state.agency_id}`);
  document.getElementById('personnelList').innerHTML = state.personnel.length ? `<table><thead><tr><th>Name</th><th>Radio</th><th>Phone</th><th>Duty</th><th>Unit</th><th></th></tr></thead><tbody>${state.personnel.map(p=>`<tr><td>${p.first_name} ${p.last_name}</td><td>${p.radio_id||'-'}</td><td>${p.phone||'-'}</td><td>${p.duty_status}</td><td>${(state.units.find(u=>u.id==p.current_unit_id)||{}).call_sign||'-'}</td><td class='space-x-1'><button class='btn bg-slate-700 hover:bg-slate-600 text-white' onclick='editPersonnel(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Edit</button><button class='btn btn-danger' onclick='deletePersonnel(${p.id})'>Delete</button></td></tr>`).join('')}</tbody></table>` : '<div class="text-slate-500">No crew members.</div>';
}

function resetPersonnelForm(){
  document.getElementById('personnelForm').reset(); document.getElementById('pId').value='';
  document.getElementById('personnelFormTitle').textContent='Crew Members';
  document.getElementById('pSubmit').textContent='Add Crew';
  document.getElementById('pCancel').classList.add('hidden');
}

function editPersonnel(p){
  document.getElementById('pId').value=p.id;
  document.getElementById('pFirst').value=p.first_name;
  document.getElementById('pLast').value=p.last_name;
  document.getElementById('pRadio').value=p.radio_id||'';
  document.getElementById('pPhone').value=p.phone||'';
  document.getElementById('pEmail').value=p.email||'';
  document.getElementById('pDuty').value=p.duty_status;
  document.getElementById('pUnit').value=p.current_unit_id || '';
  document.getElementById('personnelFormTitle').textContent='Edit Crew Member';
  document.getElementById('pSubmit').textContent='Update Crew';
  document.getElementById('pCancel').classList.remove('hidden');
}

async function deletePersonnel(id){
  if(!confirm('Delete this crew member?')) return;
  try { await api(`/personnel/${id}`,{method:'DELETE'}); resetPersonnelForm(); await loadPersonnel(); } catch(err){ alert(err.message); }
}

document.getElementById('personnelForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const body = {
    agency_id: state.agency_id,
    first_name: document.getElementById('pFirst').value,
    last_name: document.getElementById('pLast').value,
    radio_id: document.getElementById('pRadio').value,
    phone: document.getElementById('pPhone').value,
    email: document.getElementById('pEmail').value,
    duty_status: document.getElementById('pDuty').value,
    current_unit_id: parseInt(document.getElementById('pUnit').value) || null
  };
  const id = document.getElementById('pId').value;
  try {
    if(id){ await api(`/personnel/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
    else { await api('/personnel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
    resetPersonnelForm(); await loadPersonnel(); await loadUnits();
  } catch(err){ alert(err.message); }
});

async function logout(){
  try{ await api('/logout',{method:'POST'}); }catch(e){}
  window.location.href='/login';
}

loadAgencies();
</script>
</body>
</html>
