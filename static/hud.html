<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Unified Response HUD</title>
<script src='https://cdn.tailwindcss.com'></script>
<style>
html,body { height:100%; margin:0; background:#0f172a; color:#e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; overflow:hidden; }
#screens { display: grid; height: calc(100vh - 3.5rem); gap: 0.5rem; padding: 0.5rem; }
.screen { background:#1e293b; border:1px solid #334155; border-radius:0.5rem; display:flex; flex-direction:column; min-height:0; }
.screen-head { padding:0.35rem 0.5rem; background:#0f172a; border-bottom:1px solid #334155; font-weight:700; font-size:0.8rem; display:flex; justify-content:space-between; align-items:center; }
.screen-body { flex:1; overflow-y:auto; padding:0.5rem; display:flex; flex-direction:column; gap:0.5rem; min-height:0; }
.tile { background:#0f172a; border:1px solid #334155; border-radius:0.375rem; display:flex; flex-direction:column; min-height:0; flex:1; }
.tile-head { padding:0.25rem 0.5rem; background:#1e293b; border-bottom:1px solid #334155; display:flex; justify-content:space-between; align-items:center; font-size:0.75rem; }
.tile-head select { background:#0f172a; border:1px solid #475569; color:#e2e8f0; font-size:0.7rem; padding:0.1rem 0.25rem; border-radius:0.25rem; }
.tile iframe { flex:1; width:100%; border:0; min-height:140px; background:#0f172a; }
.locked .tile-head select, .locked .tile-head button, .locked .add-bar, .locked .remove-btn, .locked .screen-actions { display:none; }
.locked .tile-head { cursor:default; }
.add-bar { display:flex; gap:0.5rem; align-items:center; }
select, input, button { font-size:0.85rem; padding:0.35rem 0.5rem; border-radius:0.25rem; }
select, input { background:#0f172a; border:1px solid #334155; color:#e2e8f0; }
button { background:#2563eb; color:white; border:none; cursor:pointer; }
button:hover { background:#1d4ed8; }
button.btn-red { background:#dc2626; }
button.btn-red:hover { background:#b91c1c; }
button.btn-slate { background:#475569; }
button.btn-slate:hover { background:#334155; }
</style>
</head>
<body>
  <header class='h-14 bg-slate-950 border-b border-slate-700 flex items-center justify-between px-4'>
    <div class='flex items-center gap-2'>
      <span class='font-bold text-lg text-white' id='brandTitle'>Unified Response HUD</span>
    </div>
    <div class='flex items-center gap-2 add-bar'>
      <label class='text-sm text-slate-400'>Screens</label>
      <select id='screenCount'>
        <option value='1'>1</option><option value='2' selected>2</option><option value='3'>3</option>
        <option value='4'>4</option><option value='5'>5</option><option value='6'>6</option>
      </select>
      <select id='tileSelect'>
        <option value=''>Add tile...</option>
        <option value='{"title":"Dashboard v6","url":"/dashboard_v6"}'>Dashboard v6</option>
        <option value='{"title":"Call Entry","url":"/call-entry"}'>Call Entry</option>
        <option value='{"title":"Scheduled Transports","url":"/scheduled-transports-page"}'>Scheduled Transports</option>
        <option value='{"title":"Coverage","url":"/coverage-page"}'>Coverage</option>
        <option value='{"title":"Reports","url":"/reports-page"}'>Reports</option>
        <option value='{"title":"Units Screen","url":"/units-screen"}'>Units Screen</option>
        <option value='{"title":"Calls Screen","url":"/calls-screen"}'>Calls Screen</option>
        <option value='{"title":"AVL","url":"/avl"}'>AVL</option>
        <option value='{"title":"History","url":"/history"}'>History</option>
        <option value='{"title":"Audit","url":"/events-page"}'>Audit</option>
        <option value='{"title":"Roster","url":"/roster"}'>Roster</option>
        <option value='{"title":"Customer Admin","url":"/customer-admin"}'>Customer Admin</option>
      </select>
      <button id='addTile' class='btn-slate'>Add</button>
      <label class='text-sm text-slate-400 ml-2 flex items-center gap-1'><input type='checkbox' id='lockLayout'> Lock layout</label>
      <button id='resetLayout' class='btn-red ml-2'>Reset</button>
      <a href='/' class='btn-slate ml-2' style='text-decoration:none;'>Dashboard</a>
    </div>
  </header>
  <main id='screens'></main>

<script>
const PRESETS = [
  {title:'Dashboard v6', url:'/dashboard_v6'},
  {title:'Call Entry', url:'/call-entry'},
  {title:'Scheduled Transports', url:'/scheduled-transports-page'},
  {title:'Coverage', url:'/coverage-page'},
  {title:'Reports', url:'/reports-page'},
  {title:'Units Screen', url:'/units-screen'},
  {title:'Calls Screen', url:'/calls-screen'},
  {title:'AVL', url:'/avl'},
  {title:'History', url:'/history'},
  {title:'Audit', url:'/events-page'},
  {title:'Roster', url:'/roster'},
  {title:'Customer Admin', url:'/customer-admin'}
];
const STORAGE_KEY='ur_hud_layout';

let state = loadLayout();

function defaultLayout(){
  return {screens:2, locked:false, tiles:[
    {id:1, title:'Dashboard v6', url:'/dashboard_v6', screen:0},
    {id:2, title:'Call Entry', url:'/call-entry', screen:1}
  ]};
}
function loadLayout(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return defaultLayout();
}
function saveLayout(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function generateId(){ return Date.now() + Math.floor(Math.random()*1000); }

function render(){
  const sc = parseInt(document.getElementById('screenCount').value);
  const root = document.getElementById('screens');
  root.style.gridTemplateColumns = `repeat(${sc}, minmax(0, 1fr))`;
  root.innerHTML = '';
  document.body.classList.toggle('locked', state.locked);
  document.getElementById('lockLayout').checked = state.locked;
  document.getElementById('screenCount').value = state.screens;

  for(let i=0; i<state.screens; i++){
    const screen = document.createElement('div');
    screen.className = 'screen';
    screen.innerHTML = `<div class='screen-head'>Screen ${i+1}<span class='screen-actions text-xs text-slate-500'>use header dropdown to move</span></div><div class='screen-body' id='screen-body-${i}'></div>`;
    root.appendChild(screen);
  }

  state.tiles.forEach(tile=>{
    if(tile.screen >= state.screens) tile.screen = state.screens-1;
    const body = document.getElementById('screen-body-'+tile.screen);
    if(!body) return;
    const div = document.createElement('div');
    div.className = 'tile';
    div.innerHTML = `
      <div class='tile-head'>
        <span class='font-semibold'>${tile.title}</span>
        <div class='flex items-center gap-1'>
          <select data-id='${tile.id}' class='screen-chooser'>${[...Array(state.screens)].map((_,i)=>`<option value='${i}' ${i===tile.screen?'selected':''}>Screen ${i+1}</option>`).join('')}</select>
          <button class='remove-btn btn-red' data-id='${tile.id}'>&times;</button>
        </div>
      </div>
      <iframe src='${tile.url}' loading='lazy'></iframe>
    `;
    body.appendChild(div);
  });

  document.querySelectorAll('.screen-chooser').forEach(sel=>{
    sel.addEventListener('change', e=>{
      const id = parseInt(e.target.dataset.id);
      const t = state.tiles.find(x=>x.id===id);
      if(t){ t.screen = parseInt(e.target.value); saveLayout(); render(); }
    });
  });
  document.querySelectorAll('.remove-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const id = parseInt(e.target.dataset.id);
      state.tiles = state.tiles.filter(x=>x.id!==id);
      saveLayout(); render();
    });
  });
}

document.getElementById('screenCount').addEventListener('change', e=>{
  state.screens = parseInt(e.target.value);
  saveLayout(); render();
});

document.getElementById('lockLayout').addEventListener('change', e=>{
  state.locked = e.target.checked;
  saveLayout(); render();
});

document.getElementById('addTile').addEventListener('click', ()=>{
  const val = document.getElementById('tileSelect').value;
  if(!val) return;
  const preset = JSON.parse(val);
  const screen = state.tiles.length % state.screens;
  state.tiles.push({id:generateId(), title:preset.title, url:preset.url, screen});
  saveLayout(); render();
});

document.getElementById('resetLayout').addEventListener('click', ()=>{
  if(confirm('Reset HUD layout to default?')){
    state = defaultLayout();
    saveLayout(); render();
  }
});

render();
</script>
</body>
</html>
