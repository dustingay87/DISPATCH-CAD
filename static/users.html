<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Unified Response - Users</title>
<link rel='icon' href='/static/favicon.png' type='image/png'>
<script src='https://cdn.tailwindcss.com'></script>
<link rel='stylesheet' href='/static/branding.css'>
<style>
  html,body { height:100%; margin:0; background:#0f172a; color:#e2e8f0; font-family: 'Inter', system-ui, sans-serif; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:0.5rem; padding:1rem; }
  .btn { padding:0.5rem 1rem; border-radius:0.375rem; font-size:0.875rem; }
  .btn-primary { background:#2563eb; color:#fff; }
  .btn-primary:hover { background:#1d4ed8; }
  input, select { background:#0f172a; border:1px solid #334155; color:#e2e8f0; padding:0.35rem 0.5rem; border-radius:0.25rem; width:100%; }
  table { width:100%; border-collapse:collapse; font-size:0.8rem; }
  th, td { padding:0.5rem; border-bottom:1px solid #334155; text-align:left; }
  th { color:#94a3b8; text-transform:uppercase; font-size:0.7rem; }
  .hidden { display:none; }
</style>

<link rel='stylesheet' href='/static/theme.css'>
<script>if(localStorage.getItem('ur_theme')==='light')document.documentElement.classList.add('light');</script>
</head>
<body class='p-4 d2d-font-body'>
  <div class='max-w-5xl mx-auto space-y-4'>
    <div class='flex justify-between items-center'>
      <div class='flex items-center gap-2'>
        <img src='/static/d2d-logo.png' class='h-8 w-8' alt=''>
        <h1 class='text-2xl d2d-logo-text text-white'>Unified Response</h1>
        <span class='text-slate-400 font-normal'>Users</span>
      </div>
      <div class='space-x-2'>
        <a href='/admin' class='btn bg-slate-700 hover:bg-slate-600 text-white'>Admin</a>
        <a href='/console' class='btn bg-slate-700 hover:bg-slate-600 text-white'>Console</a>
      </div>
    </div>

    <div id='msg' class='hidden px-4 py-2 rounded text-sm'></div>

    <div class='grid grid-cols-1 md:grid-cols-3 gap-4'>
      <div class='card md:col-span-1'>
        <h2 class='font-semibold mb-2 border-b border-slate-700 pb-2' id='userFormTitle'>Create User</h2>
        <form id='userForm' class='space-y-2'>
          <input type='hidden' id='editUserId'>
          <div class='grid grid-cols-2 gap-2'>
            <input id='uFirstName' type='text' placeholder='First name'>
            <input id='uLastName' type='text' placeholder='Last name'>
          </div>
          <input id='uEmail' type='email' placeholder='Email' required>
          <input id='uPassword' type='password' placeholder='Password (leave blank to keep current)'>
          <select id='uRole'>
            <option value='admin'>Admin</option>
            <option value='supervisor'>Supervisor</option>
            <option value='dispatcher'>Dispatcher</option>
            <option value='responder' selected>Responder</option>
            <option value='unit'>Unit</option>
          </select>
          <select id='uAgency' class='w-full'><option value=''>No agency</option></select>
          <label class='flex items-center gap-2 text-sm'><input type='checkbox' id='uActive' checked> Active</label>
          <div class='flex gap-2'>
            <button id='uSubmit' class='btn btn-primary flex-1'>Create</button>
            <button type='button' id='uCancel' class='btn bg-slate-700 hover:bg-slate-600 text-white hidden' onclick='resetUserForm()'>Cancel</button>
          </div>
        </form>
      </div>

      <div class='card md:col-span-2'>
        <h2 class='font-semibold mb-2 border-b border-slate-700 pb-2'>User List</h2>
        <div id='userList' class='overflow-x-auto'><div class='text-slate-500'>Loading...</div></div>
      </div>
    </div>
  </div>

<script>
function api(path, opts={}){ return fetch(path, {...opts, credentials:'include'}).then(r=>{ if(r.status===401){ window.location.href='/login'; throw new Error('Unauthorized'); } if(!r.ok) throw new Error(`${path} ${r.status}`); return r.json(); }); }

let state = { agencies:[] };

function showMsg(text, ok=true){
  const el = document.getElementById('msg'); el.classList.remove('hidden');
  el.className = ok ? 'px-4 py-2 rounded text-sm bg-green-900 text-green-100' : 'px-4 py-2 rounded text-sm bg-red-900 text-red-100';
  el.textContent = text; setTimeout(()=>el.classList.add('hidden'), 4000);
}

async function loadAgencies(){
  state.agencies = await api('/agencies');
  const opts = state.agencies.map(a=>`<option value='${a.id}'>${a.name} (${a.agency_type})</option>`).join('');
  document.getElementById('uAgency').innerHTML = '<option value="">No agency</option>' + opts;
}

async function loadUsers(){
  try {
    const users = await api('/users');
    const aMap = {}; state.agencies.forEach(a=>aMap[a.id]=a);
    const rows = users.map(u=>`<tr><td>${u.id}</td><td>${u.first_name || ''} ${u.last_name || ''}</td><td>${u.email}</td><td>${u.role}</td><td>${u.is_active ? 'Active' : 'Inactive'}</td><td>${aMap[u.agency_id]?.name || '-'}</td><td class='space-x-1'><button class='btn bg-slate-700 hover:bg-slate-600 text-white' onclick='editUser(${JSON.stringify(u).replace(/'/g,"&#39;")})'>Edit</button><button class='btn btn-danger' onclick='deleteUser(${u.id})'>Delete</button></td></tr>`).join('');
    document.getElementById('userList').innerHTML = rows ? `<table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Active</th><th>Agency</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="text-slate-500">No users</div>';
  } catch(err){ showMsg(err.message, false); }
}

document.getElementById('userForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const body = {
    first_name: document.getElementById('uFirstName').value,
    last_name: document.getElementById('uLastName').value,
    email: document.getElementById('uEmail').value,
    role: document.getElementById('uRole').value,
    agency_id: document.getElementById('uAgency').value ? parseInt(document.getElementById('uAgency').value) : null,
    is_active: document.getElementById('uActive').checked
  };
  const pwd = document.getElementById('uPassword').value;
  if(pwd) body.password = pwd;
  const id = document.getElementById('editUserId').value;
  try {
    if(id){ await api(`/users/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); showMsg('User updated'); }
    else { await api('/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); showMsg('User created'); }
    resetUserForm(); loadUsers();
  } catch(err){ showMsg(err.message, false); }
});

function resetUserForm(){
  document.getElementById('userForm').reset(); document.getElementById('editUserId').value='';
  document.getElementById('userFormTitle').textContent='Create User';
  document.getElementById('uSubmit').textContent='Create';
  document.getElementById('uCancel').classList.add('hidden');
  document.getElementById('uPassword').required = true;
}

function editUser(u){
  document.getElementById('editUserId').value=u.id;
  document.getElementById('uFirstName').value=u.first_name || '';
  document.getElementById('uLastName').value=u.last_name || '';
  document.getElementById('uEmail').value=u.email;
  document.getElementById('uRole').value=u.role;
  document.getElementById('uAgency').value=u.agency_id || '';
  document.getElementById('uActive').checked = u.is_active;
  document.getElementById('uPassword').value=''; document.getElementById('uPassword').required = false;
  document.getElementById('userFormTitle').textContent='Edit User';
  document.getElementById('uSubmit').textContent='Update';
  document.getElementById('uCancel').classList.remove('hidden');
}

async function deleteUser(id){
  if(!confirm('Delete this user?')) return;
  try { await api(`/users/${id}`,{method:'DELETE'}); showMsg('User deleted'); loadUsers(); } catch(err){ showMsg(err.message, false); }
}

(async function(){ await loadAgencies(); loadUsers(); })();
</script>
<script src='/static/sortable.js'></script>
<script src="/static/theme.js"></script>
</body>
</html>
