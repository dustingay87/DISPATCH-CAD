<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Unified Response - MDT</title>
<link rel='icon' href='/static/favicon.png' type='image/png'>
<script src='https://cdn.tailwindcss.com'></script>
<link rel='stylesheet' href='/static/branding.css'>
<style>
  html,body { height:100%; margin:0; overflow:hidden; font-family: 'Inter', system-ui, sans-serif; }
  .mdt-btn { padding:1.25rem; border-radius:0.75rem; font-size:1.25rem; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; min-height:4rem; width:100%; touch-action:manipulation; }
  .incident-card { background:#1e293b; border-left:8px solid; border-radius:0.75rem; padding:1.5rem; }
  .priority-1 { border-color:#ef4444; }
  .priority-2 { border-color:#f97316; }
  .priority-3 { border-color:#eab308; }
  .priority-4 { border-color:#22c55e; }
  .log { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:0.875rem; }
  #dispatchOverlay { display:none; position:fixed; inset:0; z-index:100; align-items:center; justify-content:center; text-align:center; color:#fff; padding:2rem; user-select:none; touch-action:manipulation; }
  #dispatchOverlay.active { display:flex; }
  #dispatchOverlay.priority-1 { background:#7f1d1d; }
  #dispatchOverlay.priority-2 { background:#9a3412; }
  #dispatchOverlay.priority-3 { background:#a16207; }
  #dispatchOverlay.priority-4 { background:#166534; }
  .do-priority { font-size:1.5rem; font-weight:800; letter-spacing:0.1em; margin-bottom:0.75rem; opacity:0.9; }
  .do-call { font-size:3.5rem; font-weight:900; line-height:1; }
  .do-type { font-size:1.75rem; margin:0.5rem 0; }
  .do-location { font-size:1.25rem; margin-bottom:1.5rem; opacity:0.9; }
  .do-timer { font-size:5rem; font-weight:700; font-variant-numeric:tabular-nums; margin:1rem 0; }
  .do-instruction { display:inline-block; font-size:1.5rem; font-weight:700; text-transform:uppercase; border:4px solid #fff; padding:1rem 2rem; border-radius:1rem; margin-top:1.5rem; }
</style>

<link rel='stylesheet' href='/static/theme.css'>
<script>if(localStorage.getItem('ur_theme')==='light')document.documentElement.classList.add('light');</script>
</head>
<body class='bg-slate-900 text-slate-100 h-screen flex flex-col d2d-font-body'>
  <header class='h-20 d2d-header flex items-center justify-between px-6'>
    <div class='flex items-center space-x-4'>
      <div class='text-3xl font-bold text-white' id='unitCallsign'>--</div>
      <div class='text-slate-400 text-lg' id='unitAgency'>--</div>
    </div>
    <div class='flex items-center space-x-6 text-lg'>
      <div id='clock' class='font-mono text-2xl'></div>
      <a id='mobileLink' href='/mobile-mdt?unit_id=1' class='text-sm bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded'>Mobile MDT</a>
      <label class='flex items-center space-x-2'><input id='liveToggle' type='checkbox' checked class='accent-blue-500 w-5 h-5'> <span>Live</span></label>
    </div>
  </header>

  <div class='flex-1 p-4 grid grid-cols-1 lg:grid-cols-3 gap-4 overflow-hidden'>
    <section class='col-span-1 lg:col-span-2 flex flex-col space-y-4 overflow-hidden'>
      <div class='flex items-center justify-between bg-slate-800 rounded-lg p-4'>
        <div class='text-xl'>Status: <span id='unitStatus' class='font-bold text-white'>--</span></div>
        <div class='text-xl'>Shift: <span id='shiftTimer' class='font-mono text-green-400'>--</span></div>
        <div class='text-xl'>On Call: <span id='callTimer' class='font-mono text-yellow-400'>--</span></div>
      </div>
      <div id='callPanel' class='flex-1 overflow-y-auto space-y-4'></div>
    </section>

    <section class='flex flex-col space-y-4 overflow-hidden'>
      <div class='card bg-slate-800 rounded-lg p-4 flex-1 flex flex-col min-h-0'>
        <div class='text-lg font-semibold border-b border-slate-600 pb-2 mb-2'>Status Buttons</div>
        <div id='statusButtons' class='grid grid-cols-2 gap-3 overflow-y-auto'></div>
      </div>
      <div class='card bg-slate-800 rounded-lg p-4 flex-1 flex flex-col min-h-0'>
        <div class='text-lg font-semibold border-b border-slate-600 pb-2 mb-2'>Messages</div>
        <div id='messages' class='flex-1 overflow-y-auto log space-y-1 text-slate-300'></div>
        <div class='flex p-2 gap-2 border-t border-slate-600 mt-2'>
          <input id='msgReply' type='text' class='flex-1 bg-slate-900 border border-slate-600 rounded px-2 text-sm' placeholder='Reply to dispatch...'>
          <button class='bg-blue-700 hover:bg-blue-600 text-white px-3 py-1 rounded text-sm' onclick='sendMessage()'>Send</button>
        </div>
      </div>
      <div class='card bg-slate-800 rounded-lg p-4'>
        <div class='text-lg font-semibold border-b border-slate-600 pb-2 mb-2'>Crew</div>
        <div id='crew' class='text-slate-300'>--</div>
      </div>
    </section>
  </div>

  <div id='loading' class='absolute inset-0 bg-slate-950/90 flex items-center justify-center text-2xl font-bold hidden'></div>
  <div id='startScreen' class='absolute inset-0 bg-slate-950/95 flex items-start justify-center pt-10 z-50 overflow-auto'>
    <div class='bg-slate-800 border border-slate-600 rounded-xl p-6 w-full max-w-2xl shadow-2xl'>
      <h1 class='text-2xl font-bold mb-1'>Unified Response - MDT Start</h1>
      <p class='text-slate-400 text-sm mb-4'>Select your unit, crew, and duty status to appear on the dispatcher screen.</p>
      <div id='startForm' class='space-y-4'></div>
    </div>
  </div>
  <div id='dispatchOverlay' onclick='setStatus("ER")'></div>
<script>
const CONFIG = {
  police: { statuses: [{label:'AQ', code:'AQ'},{label:'CAN', code:'CAN'},{label:'Lunch', code:'LUN'},{label:'AFR', code:'AFR'},{label:'OS', code:'OS'},{label:'ER', code:'ER'},{label:'TR', code:'TR'}] },
  fire: { statuses: [{label:'AQ', code:'AQ'},{label:'CAN', code:'CAN'},{label:'OS', code:'OS'},{label:'ER', code:'ER'},{label:'OOS', code:'OOS'},{label:'AFR', code:'AFR'},{label:'Maint', code:'MAINT'}] },
  ems: { statuses: [{label:'AQ', code:'AQ'},{label:'ER', code:'ER'},{label:'OS', code:'OS'},{label:'AP', code:'AP'},{label:'TR', code:'TR'},{label:'TH', code:'TH'},{label:'AD', code:'AD'},{label:'CAN', code:'CAN'},{label:'NPF', code:'NPF'},{label:'NO_TRANSPORT', code:'NO_TRANSPORT'},{label:'PATIENT_REFUSAL', code:'PATIENT_REFUSAL'},{label:'DEL', code:'DEL'},{label:'AFR', code:'AFR'}] },
};
function fmtDur(s){ const h=Math.floor(s/3600); const m=Math.floor((s%3600)/60); const sec=Math.floor(s%60); return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }
function elapsed(iso){ return iso ? (Date.now()-new Date(iso).getTime())/1000 : 0; }
function statusLabel(code){ const M={AQ:'Available',OS:'On Scene',ER:'En Route',TR:'Transport',CAN:'Cancelled',NPF:'No Patient Found',NO_TRANSPORT:'No Transport',PATIENT_REFUSAL:'Patient Refusal',DEL:'Delivered',AFR:'Available for Response',LUN:'Lunch',OOS:'Out of Service',MAINT:'Maintenance',AK:'Dispatched',dispatched:'Dispatched',open:'Open',closed:'Closed',en_route:'En Route',on_scene:'On Scene',TC:'Traffic Control',CT:'Citation',ARR:'Arrest',BK:'Booking',WATER:'Water on Fire',EXT:'Extinguished',OVER:'Overhaul',IN_SERVICE:'In Service',ON_DUTY:'On Duty',OFF_DUTY:'Off Duty',AP:'At Patient',TH:'Transporting to Hospital',AD:'At Destination'}; return M[code]||code; }
function api(path, opts={}){ return fetch(path, {...opts, credentials:'include'}).then(r=>{ if(r.status===401){ window.location.href='/login'; throw new Error('Unauthorized'); } if(!r.ok) throw new Error(`${path} ${r.status}`); return r.json(); }); }

const url = new URL(window.location.href);
let unitId = parseInt(url.searchParams.get('unit_id')) || null;
let state = { unit:null, incident:null, destination:null, messages:[], crew:[], agencyMap:{}, config:{statuses:[], dispositions:[], callTypes:[]}, lastIncidentId:null, start:{units:[], personnel:[]} };
let dispatchedAt = null, dispatchedCall = null;

function showLoading(msg){ const el=document.getElementById('loading'); el.textContent=msg; el.classList.remove('hidden'); }
function hideLoading(){ document.getElementById('loading').classList.add('hidden'); }

const PROVIDER_LEVELS = ['Paramedic','Advanced','Basic','Critical Care'];

async function loadStart(){
  try {
    const me = await api('/me');
    const agencyId = me.agency_id;
    if(!agencyId) throw new Error('No agency assigned');
    const [agencies, units, personnel] = await Promise.all([api('/agencies'), api(`/units?agency_id=${agencyId}`), api(`/personnel?agency_id=${agencyId}`)]);
    state.agencyMap = {}; agencies.forEach(a=>state.agencyMap[a.id]=a);
    state.start.units = units.filter(u=>u.is_active!==false);
    state.start.personnel = personnel;
    renderStart();
  } catch(e){ document.getElementById('startForm').innerHTML = `<div class='text-red-400'>Error: ${e.message}</div>`; }
}

function getAgencyType(unit){ return state.agencyMap[unit?.agency_id]?.agency_type || ''; }
function renderStart(){
  const unitOpts = state.start.units.map(u=>`<option value='${u.id}'>${u.call_sign} - ${u.name}</option>`).join('');
  const crewList = state.start.personnel.map(p=>`
    <div class='flex items-center gap-2 bg-slate-900 p-2 rounded'>
      <input type='checkbox' id='crew-${p.id}' value='${p.id}' class='crew-check w-4 h-4 accent-blue-500' data-ems='${p.provider_level||''}'>
      <div class='flex-1'>
        <div class='font-semibold'>${p.first_name||''} ${p.last_name||''}</div>
        <div class='text-xs text-slate-400'>${p.duty_status||'off_duty'} ${p.provider_level ? '• '+p.provider_level : ''}</div>
      </div>
      ${p.photo_url ? `<img src='${p.photo_url}' class='h-8 w-8 rounded-full object-cover border border-slate-600'>` : ''}
    </div>
  `).join('');
  document.getElementById('startForm').innerHTML = `
    <div>
      <label class='block text-sm text-slate-300 mb-1'>Unit</label>
      <select id='startUnit' class='w-full bg-slate-900 border border-slate-600 rounded p-2' onchange='updateProviderControls()'>
        <option value=''>Select unit...</option>
        ${unitOpts}
      </select>
    </div>
    <div id='providerHeader' class='hidden text-xs text-slate-400'>Assign provider level for EMS crew:</div>
    <div class='grid grid-cols-1 sm:grid-cols-2 gap-2' id='crewList'>${crewList}</div>
    <div>
      <label class='block text-sm text-slate-300 mb-1'>Duty Status</label>
      <select id='startStatus' class='w-full bg-slate-900 border border-slate-600 rounded p-2'>
        <option value='IN_SERVICE'>In Service</option>
        <option value='ON_DUTY'>On Duty</option>
        <option value='AQ'>Available</option>
      </select>
    </div>
    <button class='w-full bg-blue-700 hover:bg-blue-600 text-white font-bold py-3 rounded' onclick='startMDT()'>Start Shift</button>
  `;
  updateProviderControls();
}

function updateProviderControls(){
  const selectedId = parseInt(document.getElementById('startUnit')?.value);
  const unit = state.start.units.find(u=>u.id===selectedId);
  const isEms = getAgencyType(unit)==='ems';
  document.getElementById('providerHeader').classList.toggle('hidden', !isEms);
  state.start.personnel.forEach(p=>{
    const row = document.getElementById('crew-'+p.id)?.parentElement;
    if(!row) return;
    let sel = row.querySelector('.provider-select');
    if(isEms){
      if(!sel){
        sel = document.createElement('select');
        sel.className='provider-select bg-slate-800 border border-slate-600 rounded text-xs p-1';
        sel.innerHTML = '<option value="">Provider level</option>' + PROVIDER_LEVELS.map(l=>`<option value='${l}'>${l}</option>`).join('');
        if(p.provider_level) sel.value = p.provider_level;
        row.appendChild(sel);
      }
    } else if(sel) { sel.remove(); }
  });
}

async function startMDT(){
  const unitSel = document.getElementById('startUnit');
  const selectedUnitId = parseInt(unitSel.value);
  if(!selectedUnitId) return alert('Select a unit');
  const status = document.getElementById('startStatus').value;
  const checked = [...document.querySelectorAll('.crew-check:checked')];
  if(!checked.length) return alert('Select at least one crew member');
  const personnelIds = checked.map(cb=>parseInt(cb.value));
  const providerLevels = {};
  const unit = state.start.units.find(u=>u.id===selectedUnitId);
  if(getAgencyType(unit)==='ems'){
    personnelIds.forEach(id=>{
      const row = document.getElementById('crew-'+id).parentElement;
      const sel = row.querySelector('.provider-select');
      if(sel && sel.value) providerLevels[id] = sel.value;
    });
  }
  try {
    const result = await api('/mdt/start', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({unit_id:selectedUnitId, personnel_ids:personnelIds, status_code:status, provider_levels:providerLevels})});
    const url = new URL(window.location.href);
    url.searchParams.set('unit_id', selectedUnitId);
    history.replaceState(null,'',url);
    unitId = selectedUnitId;
    document.getElementById('startScreen').classList.add('hidden');
    await load();
  } catch(e){ alert('Start error: '+e.message); }
}

async function load(){
  try {
    const [agencies, unit, personnel] = await Promise.all([api('/agencies'), api(`/units/${unitId}`), api(`/personnel?unit_id=${unitId}`)]);
    state.agencyMap={}; agencies.forEach(a=>state.agencyMap[a.id]=a);
    state.unit=unit; state.crew=personnel;
    if(unit.agency_id){
      const cfg = await api(`/config?agency_id=${unit.agency_id}`);
      state.config.statuses = cfg.find(c=>c.category==='statuses')?.value || [];
      state.config.callTypes = cfg.find(c=>c.category==='call_types')?.value || [];
      const disp = cfg.find(c=>c.category==='dispositions')?.value;
      state.config.dispositions = disp ? (Array.isArray(disp) ? disp : [disp]) : (unit.agency_type==='ems' ? ['Transport to hospital','Refused','Treated/Released','Deceased','AMA'] : ['Cleared','Cancelled','False alarm']);
    }
    if(unit.current_incident_id){ state.incident = await api(`/incidents/${unit.current_incident_id}`); state.messages = await api(`/units/${unitId}/messages`); try { state.destination = await api(`/incidents/${unit.current_incident_id}/destination`); } catch(e){ state.destination = null; } }
    else { state.incident=null; state.destination=null; state.messages = await api(`/units/${unitId}/messages`); }
    state.destinationStatus = null;
    if(state.destination && state.destination.destination && state.destination.destination.id){ try { state.destinationStatus = await api(`/destinations/${state.destination.destination.id}/status?limit=1`); } catch(e){} }
    render();
  } catch(e){ document.getElementById('callPanel').innerHTML = `<div class='text-red-400 p-4 text-xl'>Error: ${e.message}</div>`; }
}

function render(){
  const u = state.unit; const a=state.agencyMap[u.agency_id] || {}; const cfg=CONFIG[a.agency_type] || {statuses:[]};
  document.getElementById('unitCallsign').textContent = u.call_sign;
  document.getElementById('unitAgency').textContent = a.name || a.agency_type || '';
  document.getElementById('unitStatus').textContent = statusLabel(u.current_status);
  document.getElementById('shiftTimer').textContent = u.in_service_at ? fmtDur(elapsed(u.in_service_at)) : '--';
  const onCall = ['OS','ER','TR','TH','AD','HEMS','AK','dispatched'].includes(u.current_status) && u.last_assigned_at;
  document.getElementById('callTimer').textContent = onCall ? fmtDur(elapsed(u.last_assigned_at)) : '--';

  document.getElementById('statusButtons').innerHTML = state.config.statuses.map(s=>{
    let color='bg-slate-700 hover:bg-slate-600';
    if(s.code==='OS'||s.code==='AD'||s.code==='AP') color='bg-red-700 hover:bg-red-600';
    else if(s.code==='ER'||s.code==='TR'||s.code==='DEL'||s.code==='TH'||s.code==='HEMS') color='bg-yellow-700 hover:bg-yellow-600';
    else if(s.code==='AQ') color='bg-green-700 hover:bg-green-600';
    else if(s.code==='CAN'||s.code==='NPF'||s.code==='NO_TRANSPORT'||s.code==='PATIENT_REFUSAL'||s.code==='OOS'||s.code==='MAINT'||s.code==='LUN'||s.code==='AFR') color='bg-slate-600 hover:bg-slate-500';
    return `<button class='mdt-btn ${color} text-white' onclick='setStatus("${s.code}")'>${statusLabel(s.code)}</button>`;
  }).join('') + `<button class='mdt-btn bg-indigo-700 hover:bg-indigo-600 text-white' onclick='toggleShift()'>Start/End Shift</button>`;

  document.getElementById('crew').innerHTML = state.crew.length ? state.crew.map(p=>{
    const photo = p.photo_url ? `<img src='${p.photo_url}' class='h-8 w-8 rounded-full object-cover border border-slate-600 mr-2' alt=''>` : `<div class='h-8 w-8 rounded-full bg-slate-700 flex items-center justify-center text-xs mr-2'>${(p.first_name?.[0]||'')}${(p.last_name?.[0]||'')}</div>`;
    const badge = p.provider_level ? `<span class='ml-2 px-1.5 rounded bg-cyan-900 text-cyan-200 text-[10px]'>${p.provider_level}</span>` : '';
    return `<div class='flex items-center mb-1'>${photo}<div class='flex-1'><div class='font-semibold text-sm'>${p.first_name||''} ${p.last_name||''}</div><div class='text-[10px] text-slate-400'>${p.duty_status||'off_duty'}${badge}</div></div></div>`;
  }).join('') : 'No crew assigned';

  if(state.messages.length){
    document.getElementById('messages').innerHTML = state.messages.map(m=>{
      const t=m.sent_at ? new Date(m.sent_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '';
      return `<div class='border-l-4 border-blue-500 pl-2'><span class='text-slate-500'>${t}</span> ${m.message_text||''}</div>`;
    }).join('');
  } else document.getElementById('messages').innerHTML = '<div class=\'text-slate-500\'>No messages</div>';

  const call = state.incident;
  if(call && call.id !== state.lastIncidentId){ notify(call); state.lastIncidentId = call.id; }
  const isDispatched = u.current_incident_id && call && (u.current_status === 'dispatched' || u.current_status === 'AK');
  if(isDispatched){
    dispatchedAt = u.last_assigned_at; dispatchedCall = call;
    document.getElementById('dispatchOverlay').classList.add('active');
    updateDispatchOverlay();
  } else {
    dispatchedAt = null; dispatchedCall = null;
    document.getElementById('dispatchOverlay').classList.remove('active');
  }
  if(call){
    document.getElementById('callPanel').innerHTML = `
      <div class='incident-card priority-${Math.min(Math.max(call.priority||2,1),4)}'>
        <div class='flex justify-between items-start'>
          <div>
            <div class='text-3xl font-bold text-white'>${call.call_number||call.incident_number}</div>
            <div class='text-2xl text-slate-200 mt-1'>${call.call_type}</div>
          </div>
          <div class='text-4xl font-bold'>P${call.priority}</div>
        </div>
        <div class='mt-4 grid grid-cols-2 gap-4 text-lg'>
          <div><span class='text-slate-400'>Location:</span> <span class='font-semibold'>${call.location_text||'-'}</span></div>
          <div><span class='text-slate-400'>Caller:</span> ${call.caller_name||'-'} ${call.callback||''}</div>
          <div class='col-span-2'><span class='text-slate-400'>Narrative:</span> ${call.narrative||'-'}</div>
          ${extraHtml(call.extra)}
        </div>
        <div class='mt-4 flex flex-wrap gap-2'>
          <button class='bg-blue-700 hover:bg-blue-600 text-white px-4 py-3 rounded text-lg' onclick='setStatus("AK")'>Acknowledge</button>
          <button class='bg-yellow-700 hover:bg-yellow-600 text-white px-4 py-3 rounded text-lg' onclick='setStatus("ER")'>En Route</button>
          <button class='bg-red-700 hover:bg-red-600 text-white px-4 py-3 rounded text-lg' onclick='setStatus("OS")'>On Scene</button>
          <button class='bg-green-700 hover:bg-green-600 text-white px-4 py-3 rounded text-lg' onclick='exportEpcr()'>ePCR Export</button>
        </div>
        ${destinationHtml(state.destination)}
        <div id='mdtMileageSummary' class='mt-4 p-3 bg-slate-800 rounded border border-slate-600 text-sm text-slate-300'>Mileage: loading...</div>
      </div>`;
    loadMileageSummaryMDT(u.current_incident_id);
  } else {
    document.getElementById('callPanel').innerHTML = `<div class='flex-1 flex items-center justify-center text-2xl text-slate-500'>No active call assigned</div>`;
  }
  hideLoading();
}

function extraHtml(extra){
  if(!extra || typeof extra!=='object') return '';
  return Object.entries(extra).map(([k,v])=>`<div class='col-span-1'><span class='text-slate-400 capitalize'>${k}:</span> ${v}</div>`).join('');
}

function destinationHtml(dest){
  if(!dest) return `<div class='mt-4 p-3 bg-slate-800 rounded text-slate-400'>No destination set. Use Transport status to set one.</div>`;
  const d = dest.destination || {};
  const n = dest.notes || {};
  const details = d.details || {};
  const notes = Object.entries(n).map(([k,v])=> v ? `<div class='text-sm'><span class='text-slate-400 capitalize'>${k}:</span> ${v}</div>` : '').filter(Boolean).join('');
  const detailRows = Object.entries(details).map(([k,v])=>{
    if(!v || (Array.isArray(v) && !v.length)) return '';
    const label = k.replace(/_/g,' ');
    const value = Array.isArray(v) ? v.join(', ') : v;
    return `<div class='text-sm'><span class='text-slate-400 capitalize'>${label}:</span> ${value}</div>`;
  }).filter(Boolean).join('');
  const st = state.destinationStatus && state.destinationStatus.length ? state.destinationStatus[0] : null;
  const statusBadge = st ? `<span class='ml-2 px-1.5 py-0.5 rounded text-xs ${statusColor(st.status)}'>${st.status.toUpperCase()}${st.reason ? ': '+st.reason : ''}</span>` : '';
  return `<div class='mt-4 p-3 bg-slate-800 rounded border border-slate-600'>
    <div class='font-bold text-lg'>Destination: ${d.name||'-'}${statusBadge}</div>
    <div class='text-slate-300'>${d.address||''} ${d.category ? `(${d.category})` : ''}</div>
    <div class='mt-2'>${notes || '<span class="text-slate-500">No notes</span>'}</div>
    <div class='mt-2 pt-2 border-t border-slate-600'>${detailRows || '<span class="text-slate-500">No facility details</span>'}</div>
  </div>`;
}

function statusColor(status){
  const col = {open:'bg-green-700', divert:'bg-red-700', on_hold:'bg-yellow-700', full:'bg-orange-700', closed:'bg-slate-700'}[status] || 'bg-slate-700';
  return col;
}

async function promptDestination(incidentId){
  const name = prompt('Destination name (hospital/jail/facility):'); if(!name) return;
  const address = prompt('Destination address:') || '';
  const notes = {};
  const gate = prompt('Gate code:'); if(gate) notes.gate_code = gate;
  const door = prompt('Door code:'); if(door) notes.door_code = door;
  const dogs = prompt('Vicious dogs / animal alerts:'); if(dogs) notes.animals = dogs;
  const people = prompt('Disorderly persons / known hazards:'); if(people) notes.people = people;
  const other = prompt('Other destination notes:'); if(other) notes.other = other;
  const result = await api(`/incidents/${incidentId}/destination`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({destination:{name, address, category:'transport', notes}, notes})});
  state.destination = result; return result;
}

window.setStatus = async function(code){
  const u=state.unit;
  let extra={status_code:code};
  if(code==='TR' || code==='TH' || code==='CAN'){ const pc=prompt('Passenger/Patient count?'); if(pc) extra.passenger_count=parseInt(pc); }
  const cfg=state.config;
  if(code==='CAN' || code==='TR' || code==='NPF' || code==='NO_TRANSPORT' || code==='PATIENT_REFUSAL'){ const d=prompt('Disposition?\n'+(cfg.dispositions||[]).join('\n')); if(d) extra.disposition=d; }
  if(u.current_incident_id && ['OS','ER','TR','TH','ED','DEL','AD','AQ'].includes(code)){
    const m = prompt('Mileage (odometer)?'); if(m && !isNaN(parseFloat(m))) extra.mileage = parseFloat(m);
  }
  if((code==='TR' || code==='TH' || code==='ED') && u.current_incident_id){
    let dest = state.destination;
    if(!dest || !dest.destination_id){ dest = await promptDestination(u.current_incident_id); if(dest) state.destination = dest; }
    if(dest && dest.destination_id) extra.destination_id = dest.destination_id;
  }
  const path = u.current_incident_id ? `/incidents/${u.current_incident_id}/units/${u.id}/status` : `/units/${u.id}/status`;
  try { await api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(extra)}); await load(); } catch(e){ alert(e.message); }
};

window.toggleShift = async function(){
  try { const action = state.unit.in_service_at ? 'end' : 'start'; await api(`/units/${unitId}/shift`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})}); await load(); } catch(e){ alert(e.message); }
};

window.exportEpcr = async function(){
  if(!state.unit || !state.unit.current_incident_id) return;
  const dest = state.destination;
  const destId = dest && dest.destination_id ? dest.destination_id : null;
  try {
    const res = await api(`/incidents/${state.unit.current_incident_id}/epcr`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({incident_id:state.unit.current_incident_id, destination_id:destId})});
    alert(`ePCR export generated (ID ${res.id}).`);
  } catch(e){ alert('ePCR export failed: '+e.message); }
};

async function loadMileageSummaryMDT(incidentId){
  const el = document.getElementById('mdtMileageSummary'); if(!el) return;
  try {
    const data = await api(`/incidents/${incidentId}/mileage-summary`);
    const total = data.total_trip_miles != null ? `Trip: ${data.total_trip_miles} mi` : 'Trip mileage unavailable';
    const rows = (data.legs||[]).map(l=>`<div><b>${l.call_sign||'Unit'}</b> -> ${l.destination||'?'}: ${l.trip_miles!=null?l.trip_miles+' mi':'?'} ${l.turnaround_seconds!=null?'(turn '+fmtDur(l.turnaround_seconds)+')':''}</div>`).join('');
    el.innerHTML = `<div class='font-bold mb-1'>Mileage</div><div>${total}</div>${rows}`;
  } catch(e){ el.innerHTML = `<div class='font-bold mb-1'>Mileage</div><div class='text-slate-400'>Unavailable</div>`; }
}
window.sendMessage = async function(){
  const inp = document.getElementById('msgReply'); const text = inp.value.trim(); if(!text) return;
  try { await api('/messages', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({unit_id:unitId, channel:'mdt', message_text:text})}); inp.value=''; await load(); } catch(e){ alert(e.message); }
};

function notify(call){ if('Notification' in window && Notification.permission==='granted'){ new Notification('New Call Assigned', {body:`${call.call_number||call.incident_number} - ${call.call_type}`, tag:'call_'+call.id}); } }
function updateDispatchOverlay(){
  const el = document.getElementById('dispatchOverlay'); if(!el) return;
  if(!dispatchedAt || !dispatchedCall){ el.classList.remove('active'); return; }
  const sec = elapsed(dispatchedAt);
  const p = Math.min(Math.max(dispatchedCall.priority||2,1),4);
  el.className = `active priority-${p}`;
  el.innerHTML = `<div class='do-content'>
    <div class='do-priority'>PRIORITY ${dispatchedCall.priority}</div>
    <div class='do-call'>${dispatchedCall.call_number||dispatchedCall.incident_number}</div>
    <div class='do-type'>${dispatchedCall.call_type}</div>
    <div class='do-location'>${dispatchedCall.location_text||''}</div>
    <div class='do-timer'>${fmtDur(sec)}</div>
    <div class='do-instruction'>Touch to En Route</div>
  </div>`;
}
function updateClock(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}); updateDispatchOverlay(); }
updateClock(); setInterval(updateClock,1000);
if(unitId){ load(); } else { loadStart(); }
if('Notification' in window) Notification.requestPermission();
setInterval(()=>{ if(unitId && document.getElementById('liveToggle').checked) load(); }, 10000);
</script>
<script src="/static/theme.js"></script>
</body>
</html>
