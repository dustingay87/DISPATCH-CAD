<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Standing Orders</title>
<script src='https://cdn.tailwindcss.com'></script>
<style>
  body { background:#0f172a; color:#e2e8f0; font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  .panel { background:#1e293b; border:1px solid #334155; border-radius:.5rem; }
  .btn { background:#3b82f6; padding:.4rem .75rem; border-radius:.375rem; font-weight:600; }
  .btn:hover { background:#2563eb; }
  .btn-red { background:#ef4444; }
  .btn-red:hover { background:#dc2626; }
  .btn-sm { padding:.25rem .5rem; font-size:.75rem; }
  .form-input { background:#0f172a; border:1px solid #475569; border-radius:.375rem; padding:.4rem; color:#fff; width:100%; }
  .form-input:focus { border-color:#3b82f6; outline:none; }
  .tag { display:inline-block; padding:.1rem .4rem; border-radius:.25rem; font-size:.7rem; font-weight:600; background:#334155; }
</style>

<link rel='stylesheet' href='/static/theme.css'>
<script>if(localStorage.getItem('ur_theme')==='light')document.documentElement.classList.add('light');</script>
</head>
<body class='p-4'>
<div class='max-w-7xl mx-auto'>
  <div class='flex justify-between items-center mb-4'>
    <h1 class='text-2xl font-bold'>Standing Orders</h1>
    <div class='flex space-x-2'>
      <a href='/scheduled-transports-page' class='text-sm text-blue-400 hover:underline'>Scheduled Transports</a>
      <button class='btn btn-sm' onclick='openNew()'>New Standing Order</button>
    </div>
  </div>

  <div id='formPanel' class='hidden panel p-3 mb-4'>
    <h2 class='font-bold mb-2'>Create / Edit Standing Order</h2>
    <form id='soForm' class='grid grid-cols-1 md:grid-cols-2 gap-2' onsubmit='return false;'>
      <input type='hidden' id='soId'>
      <div><label class='text-xs text-slate-400'>Agency</label><select id='agency' class='form-input' onchange='agencyChanged()'></select></div>
      <div><label class='text-xs text-slate-400'>Patient Name</label><input id='patientName' class='form-input'></div>
      <div class='md:col-span-2'><label class='text-xs text-slate-400'>Pickup Address</label><input id='pickupAddress' class='form-input'></div>
      <div class='grid grid-cols-2 gap-2'>
        <input id='pickupLat' class='form-input' placeholder='lat'>
        <input id='pickupLng' class='form-input' placeholder='lng'>
      </div>
      <div class='md:col-span-2'>
        <label class='text-xs text-slate-400'>Destination</label>
        <select id='destination' class='form-input' onchange='destChanged()'><option value=''>Select destination</option></select>
      </div>
      <div><input id='destName' class='form-input' placeholder='Destination name'></div>
      <div><input id='destAddress' class='form-input' placeholder='Destination address'></div>
      <div class='grid grid-cols-2 gap-2'>
        <input id='destLat' class='form-input' placeholder='lat'>
        <input id='destLng' class='form-input' placeholder='lng'>
      </div>
      <div><label class='text-xs text-slate-400'>Call Type</label><input id='callType' class='form-input' value='Routine Transport'></div>
      <div><label class='text-xs text-slate-400'>Service Level</label><select id='serviceLevel' class='form-input'><option value='BLS'>BLS</option><option value='ALS'>ALS</option><option value='CCT'>CCT</option></select></div>
      <div><label class='text-xs text-slate-400'>Mobility</label><select id='mobility' class='form-input'><option value='Ambulatory'>Ambulatory</option><option value='Wheelchair'>Wheelchair</option><option value='Stretcher'>Stretcher</option><option value='Bariatric'>Bariatric</option></select></div>
      <div class='text-xs'>
        <label class='flex items-center space-x-1'><input id='oxygen' type='checkbox' class='accent-blue-500'> <span>Oxygen</span></label>
        <label class='flex items-center space-x-1'><input id='isolation' type='checkbox' class='accent-blue-500'> <span>Isolation</span></label>
        <label class='flex items-center space-x-1'><input id='stretcher' type='checkbox' class='accent-blue-500'> <span>Stretcher</span></label>
        <label class='flex items-center space-x-1'><input id='wheelchair' type='checkbox' class='accent-blue-500'> <span>Wheelchair</span></label>
      </div>
      <div class='md:col-span-2'>
        <label class='text-xs text-slate-400'>Recurrence</label>
        <div class='grid grid-cols-2 md:grid-cols-4 gap-2'>
          <select id='recFreq' class='form-input'><option value='daily'>Daily</option><option value='weekly'>Weekly</option><option value='monthly'>Monthly</option></select>
          <input id='recInterval' class='form-input' type='number' value='1' placeholder='Interval'>
          <input id='recTime' class='form-input' type='time' value='08:00'>
          <input id='recDays' class='form-input' placeholder='Days of week (0-6)'>
        </div>
      </div>
      <div class='md:col-span-2'>
        <label class='text-xs text-slate-400'>Notes</label>
        <textarea id='notes' class='form-input' rows='2'></textarea>
      </div>
      <div class='md:col-span-2 flex gap-2'>
        <button class='btn' onclick='save()'>Save</button>
        <button class='btn btn-red' type='button' onclick='closeForm()'>Cancel</button>
      </div>
    </form>
    <div id='generatePanel' class='mt-3 hidden'>
      <label class='text-xs text-slate-400'>Generate transports from <input id='genStart' type='date' class='form-input w-40 inline'> to <input id='genEnd' type='date' class='form-input w-40 inline'></label>
      <button class='btn btn-sm' onclick='generate()'>Generate</button>
      <div id='genResult' class='text-xs mt-1 text-slate-300'></div>
    </div>
  </div>

  <div id='list' class='text-sm space-y-2'>Loading...</div>
</div>

<script>
function api(path, opts={}){ return fetch(path, {...opts, credentials:'include'}).then(r=>{ if(r.status===401){ window.location.href='/login'; throw new Error('Unauthorized'); } if(!r.ok) throw new Error(`${path} ${r.status}`); return r.json(); }); }
let state={agencies:[],destinations:[],orders:[]};

async function init(){
  [state.agencies, state.destinations] = await Promise.all([api('/agencies'), api('/destinations')]);
  const agencySel = document.getElementById('agency');
  agencySel.innerHTML = state.agencies.map(a=>`<option value='${a.id}'>${a.name}</option>`).join('');
  agencyChanged();
  await load();
}

function agencyChanged(){
  const agencyId = document.getElementById('agency').value;
  const destSel = document.getElementById('destination');
  const agencyDests = state.destinations.filter(d=>d.agency_id==parseInt(agencyId));
  destSel.innerHTML = `<option value=''>Select destination</option>` + agencyDests.map(d=>`<option value='${d.id}'>${d.name} (${d.category||''})</option>`).join('');
}

function destChanged(){
  const destId = parseInt(document.getElementById('destination').value);
  const d = state.destinations.find(x=>x.id===destId);
  if(d){
    document.getElementById('destName').value = d.name||'';
    document.getElementById('destAddress').value = d.address||'';
    document.getElementById('destLat').value = d.lat||'';
    document.getElementById('destLng').value = d.lng||'';
  }
}

function fmtDate(iso){ return iso ? new Date(iso).toLocaleDateString() : '-'; }
function fmtDateTime(iso){ if(!iso) return '-'; const d=new Date(iso); return d.toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}); }

async function load(){
  try {
    state.orders = await api('/standing-orders');
    renderList();
  } catch(e){ document.getElementById('list').innerHTML = `<div class='text-red-400'>Error: ${e.message}</div>`; }
}

function recText(o){
  if(!o.recurrence) return 'No recurrence';
  return `${o.recurrence.frequency||'daily'} every ${o.recurrence.interval||1} at ${o.recurrence.time||'08:00'}`;
}

function renderList(){
  const el = document.getElementById('list');
  if(!state.orders.length){ el.innerHTML = '<div class="text-slate-400">No standing orders.</div>'; return; }
  el.innerHTML = state.orders.map(o=>`
    <div class='bg-slate-800 rounded p-3 border border-slate-700'>
      <div class='flex justify-between items-start'>
        <div>
          <div class='font-bold text-white'>${o.patient_name||'Unknown patient'} ${o.active?'<span class="tag">Active</span>':'<span class="tag bg-slate-600">Inactive</span>'}</div>
          <div class='text-slate-400'>${o.call_type} • ${o.service_level||'-'} • ${o.mobility_level||'-'}</div>
          <div class='text-slate-500 text-xs mt-1'>Pickup: ${o.pickup_address||'-'}</div>
          <div class='text-slate-500 text-xs'>Dest: ${o.destination_name||'-'}</div>
          <div class='text-slate-500 text-xs'>Recurrence: ${recText(o)}</div>
        </div>
        <div class='flex flex-col gap-1'>
          <button class='btn btn-sm' onclick='editOrder(${o.id})'>Edit</button>
          <button class='btn btn-red btn-sm' onclick='deleteOrder(${o.id})'>Delete</button>
          <button class='btn btn-green btn-sm' onclick='openGenerate(${o.id})'>Generate</button>
        </div>
      </div>
    </div>
  `).join('');
}

function openNew(){ document.getElementById('soForm').reset(); document.getElementById('soId').value=''; document.getElementById('agency').value=state.agencies[0]?.id||''; agencyChanged(); document.getElementById('generatePanel').classList.add('hidden'); document.getElementById('formPanel').classList.remove('hidden'); }
function closeForm(){ document.getElementById('formPanel').classList.add('hidden'); }

function editOrder(id){
  const o = state.orders.find(x=>x.id===id); if(!o) return;
  document.getElementById('soId').value = o.id;
  document.getElementById('agency').value = o.agency_id; agencyChanged();
  document.getElementById('patientName').value = o.patient_name||'';
  document.getElementById('pickupAddress').value = o.pickup_address||'';
  document.getElementById('pickupLat').value = o.pickup_lat||'';
  document.getElementById('pickupLng').value = o.pickup_lng||'';
  document.getElementById('destination').value = o.destination_id||''; destChanged();
  document.getElementById('destName').value = o.destination_name||'';
  document.getElementById('destAddress').value = o.destination_address||'';
  document.getElementById('destLat').value = o.destination_lat||'';
  document.getElementById('destLng').value = o.destination_lng||'';
  document.getElementById('callType').value = o.call_type||'Routine Transport';
  document.getElementById('serviceLevel').value = o.service_level||'BLS';
  document.getElementById('mobility').value = o.mobility_level||'Ambulatory';
  document.getElementById('oxygen').checked = o.oxygen;
  document.getElementById('isolation').checked = o.isolation;
  document.getElementById('stretcher').checked = o.stretcher;
  document.getElementById('wheelchair').checked = o.wheelchair;
  document.getElementById('recFreq').value = o.recurrence?.frequency||'daily';
  document.getElementById('recInterval').value = o.recurrence?.interval||1;
  document.getElementById('recTime').value = o.recurrence?.time||'08:00';
  document.getElementById('recDays').value = (o.recurrence?.days_of_week||[]).join(',');
  document.getElementById('notes').value = o.notes||'';
  document.getElementById('generatePanel').classList.remove('hidden');
  document.getElementById('formPanel').classList.remove('hidden');
}

function getPayload(){
  const days = document.getElementById('recDays').value.split(',').map(s=>parseInt(s.trim())).filter(n=>!isNaN(n));
  return {
    agency_id: parseInt(document.getElementById('agency').value),
    patient_name: document.getElementById('patientName').value,
    pickup_address: document.getElementById('pickupAddress').value,
    pickup_lat: parseFloat(document.getElementById('pickupLat').value) || null,
    pickup_lng: parseFloat(document.getElementById('pickupLng').value) || null,
    destination_id: parseInt(document.getElementById('destination').value) || null,
    destination_name: document.getElementById('destName').value,
    destination_address: document.getElementById('destAddress').value,
    destination_lat: parseFloat(document.getElementById('destLat').value) || null,
    destination_lng: parseFloat(document.getElementById('destLng').value) || null,
    call_type: document.getElementById('callType').value,
    service_level: document.getElementById('serviceLevel').value,
    mobility_level: document.getElementById('mobility').value,
    oxygen: document.getElementById('oxygen').checked,
    isolation: document.getElementById('isolation').checked,
    stretcher: document.getElementById('stretcher').checked,
    wheelchair: document.getElementById('wheelchair').checked,
    notes: document.getElementById('notes').value,
    recurrence: {
      frequency: document.getElementById('recFreq').value,
      interval: parseInt(document.getElementById('recInterval').value) || 1,
      time: document.getElementById('recTime').value,
      days_of_week: days.length ? days : null
    },
    active: true
  };
}

async function save(){
  const id = document.getElementById('soId').value;
  const payload = getPayload();
  try {
    if(id){ await api(`/standing-orders/${id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}); }
    else { await api('/standing-orders', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}); }
    closeForm(); await load();
  } catch(e){ alert(e.message); }
}

async function deleteOrder(id){
  if(!confirm('Delete this standing order?')) return;
  try { await api(`/standing-orders/${id}`, {method:'DELETE'}); await load(); } catch(e){ alert(e.message); }
}

let genId = null;
function openGenerate(id){ genId=id; document.getElementById('generatePanel').classList.remove('hidden'); document.getElementById('formPanel').classList.remove('hidden'); }

async function generate(){
  if(!genId) return;
  const start = document.getElementById('genStart').value, end = document.getElementById('genEnd').value;
  if(!start || !end){ alert('Select start and end dates'); return; }
  try {
    const res = await api(`/standing-orders/${genId}/generate`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({start_date:start, end_date:end})});
    document.getElementById('genResult').textContent = `Created ${res.created} scheduled transports.`;
  } catch(e){ alert(e.message); }
}

init();
</script>
<script src="/static/theme.js"></script>
</body>
</html>
