<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unified Response - Dashboard</title>
  <link rel="icon" href="/static/favicon.png" type="image/png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/branding.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    #map { height: 100%; width: 100%; }
    body { height: 100vh; overflow: hidden; }
  </style>

<link rel='stylesheet' href='/static/theme.css'>
<script>if(localStorage.getItem('ur_theme')==='light')document.documentElement.classList.add('light');</script>
</head>
<body class="bg-gray-100 text-gray-800 d2d-font-body">
  <header class="d2d-header p-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <img src="/static/d2d-logo.png" class="h-8 w-8" alt="" />
      <h1 class="text-xl d2d-logo-text text-white">Unified Response</h1>
      <span class="text-slate-400 text-sm">Dashboard</span>
    </div>
    <div class='space-x-2'>
      <button id='refreshBtn' class='bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded text-sm'>Refresh</button>
      <button id='seedBtn' class='bg-green-600 hover:bg-green-700 px-3 py-1 rounded text-sm'>Seed Demo</button>
      <button id='addAgencyBtn' class='bg-slate-600 hover:bg-slate-700 px-3 py-1 rounded text-sm'>Add Agency</button>
      <button id='addUnitBtn' class='bg-slate-600 hover:bg-slate-700 px-3 py-1 rounded text-sm'>Add Unit</button>
      <button id='addIncidentBtn' class='bg-slate-600 hover:bg-slate-700 px-3 py-1 rounded text-sm'>Add Incident</button>
      <a href='/dashboard_v5.html' class='bg-indigo-600 hover:bg-indigo-700 px-3 py-1 rounded text-sm text-white'>v5 Console</a>
      <a href='/supervisor-page' class='bg-purple-600 hover:bg-purple-700 px-3 py-1 rounded text-sm text-white'>Supervisor</a>
      <a href='/billing-page' class='bg-cyan-600 hover:bg-cyan-700 px-3 py-1 rounded text-sm text-white'>Billing</a>
      <a href='/taip-verify-page' class='bg-orange-600 hover:bg-orange-700 px-3 py-1 rounded text-sm text-white'>TAIP</a>
    </div>
  </header>
  <main class="flex h-[calc(100vh-64px)]">
    <aside class="w-80 bg-white border-r overflow-y-auto p-4 space-y-4">
      <div>
        <h2 class="font-semibold text-sm uppercase text-slate-500 mb-2">Agencies</h2>
        <ul id="agencyList" class="space-y-1 text-sm"></ul>
      </div>
      <div>
        <h2 class="font-semibold text-sm uppercase text-slate-500 mb-2">Units</h2>
        <ul id="unitList" class="space-y-1 text-sm"></ul>
      </div>
      <div>
        <h2 class="font-semibold text-sm uppercase text-slate-500 mb-2">Incidents</h2>
        <ul id="incidentList" class="space-y-1 text-sm"></ul>
      </div>
    </aside>
    <section class="flex-1 relative">
      <div id="map"></div>
    </section>
  </main>
  <script>
    const DEMO_LAT = 39.9612;
    const DEMO_LNG = -82.9988;

    function showStatus(msg) {
      const header = document.querySelector('header h1');
      const old = header.textContent;
      header.textContent = msg;
      setTimeout(() => header.textContent = old, 3000);
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, opts);
      if (!res.ok) throw new Error(`${path} ${res.status}`);
      return res.json();
    }

    let map, layers = [];

    function initMap() {
      map = L.map('map').setView([DEMO_LAT, DEMO_LNG], 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
    }

    function clearMarkers() {
      layers.forEach(l => map.removeLayer(l));
      layers = [];
    }

    function addMarker(lat, lng, title, color = 'blue') {
      if (lat == null || lng == null) return;
      const marker = L.circleMarker([lat, lng], {
        radius: 8, color, fillColor: color, fillOpacity: 0.8
      }).addTo(map).bindPopup(title);
      layers.push(marker);
    }

    async function refresh() {
      try {
        const [agencies, units, incidents] = await Promise.all([
          api('/agencies'), api('/units'), api('/incidents')
        ]);
        document.getElementById('agencyList').innerHTML = agencies.length
          ? agencies.map(a => `<li class="p-2 bg-slate-50 rounded">${a.name} <span class="text-xs text-slate-500">(${a.agency_type})</span></li>`).join('')
          : '<li class="text-slate-400 text-sm">No agencies</li>';
        document.getElementById('unitList').innerHTML = units.length
          ? units.map(u => `<li class="p-2 bg-slate-50 rounded">${u.call_sign} - ${u.current_status} <span class="text-xs text-slate-500">${u.unit_type}</span></li>`).join('')
          : '<li class="text-slate-400 text-sm">No units</li>';
        document.getElementById('incidentList').innerHTML = incidents.length
          ? incidents.map(i => `<li class="p-2 bg-red-50 rounded">${i.incident_number}: ${i.call_type} <span class="text-xs text-slate-500">${i.status}</span></li>`).join('')
          : '<li class="text-slate-400 text-sm">No incidents</li>';
        clearMarkers();
        agencies.forEach(a => addMarker(a.lat, a.lng, `<b>${a.name}</b><br>${a.agency_type}`, 'blue'));
        units.forEach(u => addMarker(u.lat, u.lng, `<b>${u.call_sign}</b><br>${u.current_status}`, 'green'));
        incidents.forEach(i => addMarker(i.lat, i.lng, `<b>${i.incident_number}</b><br>${i.call_type}`, 'red'));
      } catch (e) {
        showStatus('Error: ' + e.message);
      }
    }

    async function seed() {
      try {
        const agency = await api('/agencies', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({name: 'Demo Fire Department', agency_type: 'fire'})
        });
        await api('/units', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({agency_id: agency.id, name: 'Engine 1', call_sign: 'E1', unit_type: 'engine', lat: DEMO_LAT + 0.02, lng: DEMO_LNG + 0.02})
        });
        await api('/incidents', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({agency_id: agency.id, call_type: 'Medical Emergency', lat: DEMO_LAT - 0.01, lng: DEMO_LNG + 0.01})
        });
        await refresh();
        showStatus('Demo data seeded');
      } catch (e) {
        showStatus('Seed error: ' + e.message);
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', refresh);
    document.getElementById('seedBtn').addEventListener('click', seed);

    async function addAgency() {
      const name = prompt('Agency name');
      if (!name) return;
      const agency_type = prompt('Agency type (fire/police/ems)', 'fire') || 'fire';
      try { await api('/agencies', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name, agency_type})}); await refresh(); showStatus('Agency added'); } catch (e) { showStatus('Error: ' + e.message); }
    }
    async function addUnit() {
      const agency_id = parseInt(prompt('Agency ID'));
      if (!agency_id) return;
      const name = prompt('Unit name');
      if (!name) return;
      const call_sign = prompt('Call sign');
      if (!call_sign) return;
      const unit_type = prompt('Unit type', 'engine') || 'engine';
      try { await api('/units', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({agency_id, name, call_sign, unit_type, lat: DEMO_LAT + 0.02, lng: DEMO_LNG + 0.02})}); await refresh(); showStatus('Unit added'); } catch (e) { showStatus('Error: ' + e.message); }
    }
    async function addIncident() {
      const agency_id = parseInt(prompt('Agency ID'));
      if (!agency_id) return;
      const call_type = prompt('Call type');
      if (!call_type) return;
      try { await api('/incidents', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({agency_id, call_type, lat: DEMO_LAT - 0.01, lng: DEMO_LNG + 0.01})}); await refresh(); showStatus('Incident added'); } catch (e) { showStatus('Error: ' + e.message); }
    }

    document.getElementById('addAgencyBtn').addEventListener('click', addAgency);
    document.getElementById('addUnitBtn').addEventListener('click', addUnit);
    document.getElementById('addIncidentBtn').addEventListener('click', addIncident);

    initMap();
    refresh();
  </script>
<script src="/static/theme.js"></script>
</body>
</html>
