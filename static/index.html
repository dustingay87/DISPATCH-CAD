<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VolCAD Dispatch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    #map { height: 100%; width: 100%; }
    body { height: 100vh; overflow: hidden; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">
  <header class="bg-slate-800 text-white p-4 flex items-center justify-between">
    <h1 class="text-xl font-bold tracking-wide">VolCAD Dispatch Dashboard</h1>
    <div class="space-x-2">
      <button id="refreshBtn" class="bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded text-sm">Refresh</button>
      <button id="seedBtn" class="bg-green-600 hover:bg-green-700 px-3 py-1 rounded text-sm">Seed Demo Data</button>
    </div>
  </header>
  <main class="flex h-[calc(100vh-64px)]">
    <aside class="w-80 bg-white border-r overflow-y-auto p-4 space-y-4">
      <div>
        <h2 class="font-semibold text-sm uppercase text-slate-500 mb-2">Agencies</h2>
        <ul id="agencyList" class="space-y-1 text-sm"></ul>
      </div>
      <div>
        <h2 class="font-semibold text-sm uppercase text-slate-500 mb-2">Units</h2>
        <ul id="unitList" class="space-y-1 text-sm"></ul>
      </div>
      <div>
        <h2 class="font-semibold text-sm uppercase text-slate-500 mb-2">Incidents</h2>
        <ul id="incidentList" class="space-y-1 text-sm"></ul>
      </div>
    </aside>
    <section class="flex-1 relative">
      <div id="map"></div>
    </section>
  </main>
  <script>
    const DEMO_LAT = 39.9612;
    const DEMO_LNG = -82.9988;

    function showStatus(msg) {
      const header = document.querySelector('header h1');
      const old = header.textContent;
      header.textContent = msg;
      setTimeout(() => header.textContent = old, 3000);
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, opts);
      if (!res.ok) throw new Error(`${path} ${res.status}`);
      return res.json();
    }

    let map, layers = [];

    function initMap() {
      map = L.map('map').setView([DEMO_LAT, DEMO_LNG], 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
    }

    function clearMarkers() {
      layers.forEach(l => map.removeLayer(l));
      layers = [];
    }

    function addMarker(lat, lng, title, color = 'blue') {
      if (lat == null || lng == null) return;
      const marker = L.circleMarker([lat, lng], {
        radius: 8, color, fillColor: color, fillOpacity: 0.8
      }).addTo(map).bindPopup(title);
      layers.push(marker);
    }

    async function refresh() {
      try {
        const [agencies, units, incidents] = await Promise.all([
          api('/agencies'), api('/units'), api('/incidents')
        ]);
        document.getElementById('agencyList').innerHTML = agencies.length
          ? agencies.map(a => `<li class="p-2 bg-slate-50 rounded">${a.name} <span class="text-xs text-slate-500">(${a.agency_type})</span></li>`).join('')
          : '<li class="text-slate-400 text-sm">No agencies</li>';
        document.getElementById('unitList').innerHTML = units.length
          ? units.map(u => `<li class="p-2 bg-slate-50 rounded">${u.call_sign} - ${u.current_status} <span class="text-xs text-slate-500">${u.unit_type}</span></li>`).join('')
          : '<li class="text-slate-400 text-sm">No units</li>';
        document.getElementById('incidentList').innerHTML = incidents.length
          ? incidents.map(i => `<li class="p-2 bg-red-50 rounded">${i.incident_number}: ${i.call_type} <span class="text-xs text-slate-500">${i.status}</span></li>`).join('')
          : '<li class="text-slate-400 text-sm">No incidents</li>';
        clearMarkers();
        agencies.forEach(a => addMarker(a.lat, a.lng, `<b>${a.name}</b><br>${a.agency_type}`, 'blue'));
        units.forEach(u => addMarker(u.current_lat, u.current_lng, `<b>${u.call_sign}</b><br>${u.current_status}`, 'green'));
        incidents.forEach(i => addMarker(i.lat, i.lng, `<b>${i.incident_number}</b><br>${i.call_type}`, 'red'));
      } catch (e) {
        showStatus('Error: ' + e.message);
      }
    }

    async function seed() {
      try {
        const agency = await api('/agencies', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({name: 'Demo Fire Department', agency_type: 'fire'})
        });
        await api('/units', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({agency_id: agency.id, name: 'Engine 1', call_sign: 'E1', unit_type: 'engine', lat: DEMO_LAT + 0.02, lng: DEMO_LNG + 0.02})
        });
        await api('/incidents', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({agency_id: agency.id, call_type: 'Medical Emergency', lat: DEMO_LAT - 0.01, lng: DEMO_LNG + 0.01})
        });
        await refresh();
        showStatus('Demo data seeded');
      } catch (e) {
        showStatus('Seed error: ' + e.message);
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', refresh);
    document.getElementById('seedBtn').addEventListener('click', seed);

    initMap();
    refresh();
  </script>
</body>
</html>
