<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>D2D Call Entry</title>
<script src='https://cdn.tailwindcss.com'></script>
<style>
  html,body { height:100%; margin:0; background:#0f172a; color:#e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:0.5rem; padding:1rem; }
  .btn { padding:0.5rem 1rem; border-radius:0.375rem; font-size:0.875rem; }
  .btn-primary { background:#2563eb; color:#fff; }
  .btn-primary:hover { background:#1d4ed8; }
  .tab { padding:0.35rem 0.75rem; border-radius:0.25rem; font-size:0.8rem; cursor:pointer; background:#334155; color:#94a3b8; }
  .tab.active { background:#475569; color:#fff; }
  input, select, textarea { background:#0f172a; border:1px solid #334155; color:#e2e8f0; padding:0.5rem 0.75rem; border-radius:0.25rem; width:100%; }
  .hidden { display:none; }
</style>
</head>
<body class='p-4'>
  <div class='max-w-3xl mx-auto space-y-4'>
    <div class='flex justify-between items-center'>
      <h1 class='text-2xl font-bold'>D2D <span class='text-slate-400 font-normal'>Call Entry</span></h1>
      <div class='space-x-2'>
        <a href='/console' class='btn bg-slate-700 hover:bg-slate-600 text-white'>Console</a>
        <a href='/admin' class='btn bg-slate-700 hover:bg-slate-600 text-white'>Admin</a>
      </div>
    </div>

    <div id='msg' class='hidden px-4 py-2 rounded text-sm'></div>

    <div class='card space-y-4'>
      <div class='flex items-center justify-between'>
        <div class='flex space-x-2' id='disciplineTabs'>
          <div class='tab active' data-d='police'>Police</div>
          <div class='tab' data-d='fire'>Fire/Rescue</div>
          <div class='tab' data-d='ems'>EMS</div>
        </div>
        <div class='text-xs font-mono' id='callTimer' title='Elapsed since call entry opened'>00:00:00</div>
      </div>

      <form id='callForm' class='grid grid-cols-1 md:grid-cols-2 gap-4'>
        <div class='md:col-span-2'>
          <label class='text-xs text-slate-400 uppercase'>Agency</label>
          <select id='agency' required></select>
        </div>
        <div class='md:col-span-2'>
          <label class='text-xs text-slate-400 uppercase'>Call Type</label>
          <select id='callType' required></select>
        </div>
        <div>
          <label class='text-xs text-slate-400 uppercase'>Priority</label>
          <select id='priority' required></select>
        </div>
        <div>
          <label class='text-xs text-slate-400 uppercase'>Callback</label>
          <input id='callback' type='text' placeholder='Phone number'>
        </div>
        <div class='md:col-span-2'>
          <label class='text-xs text-slate-400 uppercase'>Location</label>
          <input id='location' type='text' placeholder='Address / intersection' required>
        </div>
        <div>
          <label class='text-xs text-slate-400 uppercase'>Lat</label>
          <input id='lat' type='number' step='any' placeholder='optional'>
        </div>
        <div>
          <label class='text-xs text-slate-400 uppercase'>Lng</label>
          <input id='lng' type='number' step='any' placeholder='optional'>
        </div>
        <div class='md:col-span-2'>
          <label class='text-xs text-slate-400 uppercase'>Caller Name</label>
          <input id='caller' type='text' placeholder='Caller name'>
        </div>
        <div class='md:col-span-2'>
          <label class='text-xs text-slate-400 uppercase'>Narrative</label>
          <textarea id='narrative' rows='4' placeholder='Initial details...'></textarea>
        </div>
        <div class='md:col-span-2'>
          <label class='text-xs text-slate-400 uppercase block mb-1'>Response Goals</label>
          <div id='responseGoals' class='text-xs text-slate-400'></div>
        </div>
        <div class='md:col-span-2 flex justify-end space-x-2'>
          <span id='saveStatus' class='text-xs text-slate-500 self-center mr-2 hidden'></span>
          <button type='submit' id='submitBtn' class='btn btn-primary hidden'>Open for Dispatch</button>
        </div>
      </form>
      <div id='intakeActions' class='hidden mt-4 p-3 bg-slate-800 rounded border border-slate-600 text-sm'>
        <div class='mb-2'>Incident <b id='intakeNumber' class='text-white'></b> is in <span class='text-yellow-400'>INTAKE</span>.</div>
        <div class='flex gap-2'>
          <button id='openBtn' class='btn btn-primary'>Open for Dispatch</button>
          <a id='consoleLink' href='#' class='btn bg-slate-700 hover:bg-slate-600 text-white'>Console</a>
        </div>
      </div>
    </div>
  </div>

<script>
function api(path, opts={}){ return fetch(path, {...opts, credentials:'include'}).then(r=>{ if(r.status===401){ window.location.href='/login'; throw new Error('Unauthorized'); } if(!r.ok) throw new Error(`${path} ${r.status}`); return r.json(); }); }

let state = { agencies:[], agencyMap:{}, configs:{}, DISCIPLINE:'fire', user:null, callEntryStarted: new Date().toISOString() };
const DEFAULT_CALL_TYPES = {
  police: [
    {label:'Traffic Accident', priority:2},{label:'Theft', priority:3},{label:'Domestic', priority:2},{label:'Assault', priority:1},{label:'Welfare Check', priority:3},{label:'Suspicious Person', priority:3},{label:'Noise Complaint', priority:4},{label:'Burglary', priority:2}
  ],
  fire: [
    {label:'Structure Fire', priority:1},{label:'Vehicle Fire', priority:2},{label:'Brush Fire', priority:2},{label:'Vehicle Accident', priority:1},{label:'Medical Assist', priority:2},{label:'Alarm', priority:3},{label:'Smoke Investigation', priority:2},{label:'Hazmat', priority:1},{label:'Water Rescue', priority:1},{label:'Downed Power Line', priority:2}
  ],
  ems: [
    {label:'Cardiac Arrest', priority:1},{label:'Chest Pain', priority:1},{label:'Respiratory', priority:1},{label:'Fall', priority:2},{label:'Motor Vehicle Accident', priority:1},{label:'Overdose', priority:1},{label:'Seizure', priority:1},{label:'Unconscious', priority:1},{label:'Psychiatric', priority:3}
  ]
};
const DEFAULT_PRIORITIES = {
  police: [{priority:1,label:'Emergency',target_seconds:180},{priority:2,label:'Urgent',target_seconds:420},{priority:3,label:'Routine',target_seconds:720},{priority:4,label:'Low',target_seconds:1200}],
  fire: [{priority:1,label:'Working Fire',target_seconds:180},{priority:2,label:'Urgent',target_seconds:420},{priority:3,label:'Routine',target_seconds:720},{priority:4,label:'Low',target_seconds:1200}],
  ems: [{priority:1,label:'Priority 1',target_seconds:180},{priority:2,label:'Priority 2',target_seconds:420},{priority:3,label:'Priority 3',target_seconds:720},{priority:4,label:'Priority 4',target_seconds:1200}]
};
function moduleToDiscipline(m){ return {'law':'police','fire':'fire','ems':'ems'}[m] || m; }
function fmtDur(s){ const h=Math.floor(s/3600); const m=Math.floor((s%3600)/60); const sec=Math.floor(s%60); return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }

function showMsg(text, ok=true){
  const el = document.getElementById('msg'); el.classList.remove('hidden');
  el.className = ok ? 'px-4 py-2 rounded text-sm bg-green-900 text-green-100' : 'px-4 py-2 rounded text-sm bg-red-900 text-red-100';
  el.textContent = text; setTimeout(()=>el.classList.add('hidden'), 4000);
}

function setDiscipline(d){
  state.DISCIPLINE = d;
  document.querySelectorAll('#disciplineTabs .tab').forEach(t=>{ if(!t.classList.contains('hidden')) t.classList.toggle('active', t.dataset.d===d); });
  populateAgencies(); loadConfig(); renderResponseGoals();
}

function renderResponseGoals(){
  const cfg = state.configs && state.configs[document.getElementById('agency').value] || {};
  const goals = cfg.response_goals || {dispatch_seconds:60, en_route_seconds:120, on_scene_city_seconds:480, on_scene_county_seconds:1800};
  const el = document.getElementById('responseGoals');
  el.innerHTML = `Dispatch: <span class='text-yellow-400'>${fmtDur(goals.dispatch_seconds)}</span> · En Route: <span class='text-yellow-400'>${fmtDur(goals.en_route_seconds)}</span> · On Scene City: <span class='text-yellow-400'>${fmtDur(goals.on_scene_city_seconds)}</span> · On Scene County: <span class='text-yellow-400'>${fmtDur(goals.on_scene_county_seconds)}</span>`;
}

function startTimer(){
  const el = document.getElementById('callTimer');
  setInterval(()=>{
    const sec = (Date.now() - new Date(state.callEntryStarted).getTime())/1000;
    el.textContent = fmtDur(sec);
    if(sec > 60) el.classList.add('text-red-400');
    else el.classList.add('text-green-400');
  }, 1000);
}

function populateAgencies(){
  const sel = document.getElementById('agency');
  const filtered = state.agencies.filter(a=>a.agency_type===state.DISCIPLINE);
  sel.innerHTML = filtered.map(a=>`<option value='${a.id}'>${a.name}</option>`).join('') || '<option value="">No agencies</option>';
  loadConfig();
}

async function loadConfig(){
  const agencyId = document.getElementById('agency').value;
  if(!agencyId) return;
  try {
    const [ctRes, prRes, goalRes] = await Promise.all([api(`/config?agency_id=${agencyId}&category=call_types`), api(`/config?agency_id=${agencyId}&category=priorities`), api(`/config?agency_id=${agencyId}&category=response_goals`)]);
    const callTypes = (ctRes[0]?.value && ctRes[0].value.length) ? ctRes[0].value : DEFAULT_CALL_TYPES[state.DISCIPLINE];
    const priorities = (prRes[0]?.value && prRes[0].value.length) ? prRes[0].value : DEFAULT_PRIORITIES[state.DISCIPLINE];
    const response_goals = (goalRes[0]?.value) ? goalRes[0].value : {dispatch_seconds:60, en_route_seconds:120, on_scene_city_seconds:480, on_scene_county_seconds:1800};
    state.configs[agencyId] = { callTypes, priorities, response_goals };
    const csel = document.getElementById('callType');
    csel.innerHTML = callTypes.map(c=>`<option value='${c.label}' data-priority='${c.priority}'>${c.label} (P${c.priority})</option>`).join('') || '<option value="">No call types</option>';
    const psel = document.getElementById('priority');
    psel.innerHTML = priorities.map(p=>`<option value='${p.priority}'>P${p.priority} - ${p.label}</option>`).join('') || '<option value="2">2</option>';
    updatePriority();
    renderResponseGoals();
  } catch(e){ showMsg(e.message, false); }
}

function updatePriority(){
  const csel = document.getElementById('callType');
  const p = csel.selectedOptions[0]?.dataset.priority;
  if(p) document.getElementById('priority').value = p;
}

document.getElementById('disciplineTabs').addEventListener('click', e=>{ if(e.target.classList.contains('tab')) setDiscipline(e.target.dataset.d); });
document.getElementById('agency').addEventListener('change', loadConfig);
document.getElementById('callType').addEventListener('change', updatePriority);

let createdIncidentId = null;

function getFormBody(status='intake'){
  return {
    agency_id: parseInt(document.getElementById('agency').value),
    call_type: document.getElementById('callType').value,
    priority: parseInt(document.getElementById('priority').value),
    location_text: document.getElementById('location').value,
    callback: document.getElementById('callback').value,
    caller_name: document.getElementById('caller').value,
    narrative: document.getElementById('narrative').value,
    lat: document.getElementById('lat').value ? parseFloat(document.getElementById('lat').value) : null,
    lng: document.getElementById('lng').value ? parseFloat(document.getElementById('lng').value) : null,
    status
  };
}

async function createIntake(){
  const body = getFormBody('intake');
  try {
    const inc = await api('/incidents', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    createdIncidentId = inc.id;
    document.getElementById('intakeNumber').textContent = inc.call_number || inc.incident_number;
    document.getElementById('consoleLink').href = `/console?discipline=${state.DISCIPLINE}`;
    document.getElementById('submitBtn').classList.remove('hidden');
  } catch(err){ showMsg(err.message, false); }
}

let saveTimer;
async function saveIntake(){
  if(!createdIncidentId) return;
  const body = getFormBody('intake');
  try {
    const inc = await api(`/incidents/${createdIncidentId}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    document.getElementById('intakeNumber').textContent = inc.call_number || inc.incident_number;
    const ss = document.getElementById('saveStatus');
    ss.textContent = 'Saved'; ss.classList.remove('hidden','text-red-400'); ss.classList.add('text-green-400');
    setTimeout(()=>ss.classList.add('hidden'), 1500);
  } catch(err){
    const ss = document.getElementById('saveStatus');
    ss.textContent = 'Save failed'; ss.classList.remove('hidden','text-green-400'); ss.classList.add('text-red-400');
  }
}
function scheduleSave(){
  const ss = document.getElementById('saveStatus');
  ss.textContent = 'Saving...'; ss.classList.remove('hidden','text-red-400','text-green-400'); ss.classList.add('text-slate-400');
  clearTimeout(saveTimer); saveTimer = setTimeout(saveIntake, 800);
}

document.getElementById('callForm').addEventListener('input', scheduleSave);
document.getElementById('callForm').addEventListener('change', e=>{ if(e.target.tagName==='SELECT') scheduleSave(); });

document.getElementById('callForm').addEventListener('submit', async e=>{
  e.preventDefault();
  if(!createdIncidentId) return;
  await saveIntake();
  try {
    await api(`/incidents/${createdIncidentId}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status:'open'})});
    window.location.href = `/console?discipline=${state.DISCIPLINE}`;
  } catch(err){ showMsg(err.message, false); }
});

document.getElementById('openBtn').addEventListener('click', async e=>{
  if(!createdIncidentId) return;
  await saveIntake();
  try {
    await api(`/incidents/${createdIncidentId}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status:'open'})});
    window.location.href = `/console?discipline=${state.DISCIPLINE}`;
  } catch(err){ showMsg(err.message, false); }
});

async function init(){
  try {
    const params = new URLSearchParams(window.location.search);
    const d = params.get('discipline');
    const user = await api('/me'); state.user = user;
    state.agencies = await api('/agencies');
    state.agencyMap = {}; state.agencies.forEach(a=>state.agencyMap[a.id]=a);
    const userAgency = user?.agency_id ? state.agencyMap[user.agency_id] : null;
    const allowedDisciplines = (user?.role === 'admin') ? ['police','fire','ems'] : (userAgency ? [userAgency.agency_type] : (d ? [d] : ['fire']));
    const defaultDiscipline = allowedDisciplines[0] || 'fire';
    document.querySelectorAll('#disciplineTabs .tab').forEach(t=>t.classList.toggle('hidden', !allowedDisciplines.includes(t.dataset.d)));
    if(allowedDisciplines.length <= 1){
      document.getElementById('disciplineTabs').classList.add('hidden');
    }
    setDiscipline(defaultDiscipline);
    await createIntake();
    startTimer();
  } catch(err){ showMsg(err.message, false); }
}
init();
</script>
</body>
</html>
