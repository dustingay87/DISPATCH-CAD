<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>D2D Call Entry</title>
<script src='https://cdn.tailwindcss.com'></script>
<style>
  html,body { height:100%; margin:0; background:#0f172a; color:#e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:0.5rem; padding:1rem; }
  .btn { padding:0.5rem 1rem; border-radius:0.375rem; font-size:0.875rem; }
  .btn-primary { background:#2563eb; color:#fff; }
  .btn-primary:hover { background:#1d4ed8; }
  .tab { padding:0.35rem 0.75rem; border-radius:0.25rem; font-size:0.8rem; cursor:pointer; background:#334155; color:#94a3b8; }
  .tab.active { background:#475569; color:#fff; }
  input, select, textarea { background:#0f172a; border:1px solid #334155; color:#e2e8f0; padding:0.5rem 0.75rem; border-radius:0.25rem; width:100%; }
  .hidden { display:none; }
</style>
</head>
<body class='p-4'>
  <div class='max-w-3xl mx-auto space-y-4'>
    <div class='flex justify-between items-center'>
      <h1 class='text-2xl font-bold'>D2D <span class='text-slate-400 font-normal'>Call Entry</span></h1>
      <div class='space-x-2'>
        <a href='/console' class='btn bg-slate-700 hover:bg-slate-600 text-white'>Console</a>
        <a href='/admin' class='btn bg-slate-700 hover:bg-slate-600 text-white'>Admin</a>
      </div>
    </div>

    <div id='msg' class='hidden px-4 py-2 rounded text-sm'></div>

    <div class='card space-y-4'>
      <div class='flex items-center justify-between'>
        <div class='flex space-x-2' id='disciplineTabs'>
          <div class='tab active' data-d='police'>Police</div>
          <div class='tab' data-d='fire'>Fire</div>
          <div class='tab' data-d='ems'>EMS</div>
        </div>
        <div class='text-xs text-slate-400' id='autoPriority'>Priority auto-selected</div>
      </div>

      <form id='callForm' class='grid grid-cols-1 md:grid-cols-2 gap-4'>
        <div class='md:col-span-2'>
          <label class='text-xs text-slate-400 uppercase'>Agency</label>
          <select id='agency' required></select>
        </div>
        <div class='md:col-span-2'>
          <label class='text-xs text-slate-400 uppercase'>Call Type</label>
          <select id='callType' required></select>
        </div>
        <div>
          <label class='text-xs text-slate-400 uppercase'>Priority</label>
          <select id='priority' required></select>
        </div>
        <div>
          <label class='text-xs text-slate-400 uppercase'>Callback</label>
          <input id='callback' type='text' placeholder='Phone number'>
        </div>
        <div class='md:col-span-2'>
          <label class='text-xs text-slate-400 uppercase'>Location</label>
          <input id='location' type='text' placeholder='Address / intersection' required>
        </div>
        <div>
          <label class='text-xs text-slate-400 uppercase'>Lat</label>
          <input id='lat' type='number' step='any' placeholder='optional'>
        </div>
        <div>
          <label class='text-xs text-slate-400 uppercase'>Lng</label>
          <input id='lng' type='number' step='any' placeholder='optional'>
        </div>
        <div class='md:col-span-2'>
          <label class='text-xs text-slate-400 uppercase'>Caller Name</label>
          <input id='caller' type='text' placeholder='Caller name'>
        </div>
        <div class='md:col-span-2'>
          <label class='text-xs text-slate-400 uppercase'>Narrative</label>
          <textarea id='narrative' rows='4' placeholder='Initial details...'></textarea>
        </div>
        <div class='md:col-span-2'>
          <label class='text-xs text-slate-400 uppercase block mb-1'>Quick Timestamps</label>
          <div id='quickStamps' class='flex flex-wrap gap-2'></div>
        </div>
        <div class='md:col-span-2 flex justify-end space-x-2'>
          <button type='submit' class='btn btn-primary'>Create Incident</button>
        </div>
      </form>
    </div>
  </div>

<script>
function api(path, opts={}){ return fetch(path, {...opts, credentials:'include'}).then(r=>{ if(r.status===401){ window.location.href='/login'; throw new Error('Unauthorized'); } if(!r.ok) throw new Error(`${path} ${r.status}`); return r.json(); }); }

let state = { agencies:[], agencyMap:{}, configs:{}, DISCIPLINE:'police', user:null };
const QUICK_STAMPS = {
  police: ['Shots Fired','Object Thrown','Taser Deployed','Suspect in Custody','Officer Needs Assistance','Code 4','Suspect Fleeing'],
  fire: ['Entry Made','Smoke Showing','Fire Knocked Down','Primary Search Complete','Secondary Search Complete','Ventilation Complete','Water on Fire','All Clear'],
  ems: ['Patient Violent','Law Enforcement Needed','CPR in Progress','AED Applied','Medic on Scene','Transporting','Arrived at Hospital']
};
function moduleToDiscipline(m){ return {'law':'police','fire':'fire','ems':'ems'}[m] || m; }

function showMsg(text, ok=true){
  const el = document.getElementById('msg'); el.classList.remove('hidden');
  el.className = ok ? 'px-4 py-2 rounded text-sm bg-green-900 text-green-100' : 'px-4 py-2 rounded text-sm bg-red-900 text-red-100';
  el.textContent = text; setTimeout(()=>el.classList.add('hidden'), 4000);
}

function setDiscipline(d){
  state.DISCIPLINE = d;
  document.querySelectorAll('#disciplineTabs .tab').forEach(t=>{ if(!t.classList.contains('hidden')) t.classList.toggle('active', t.dataset.d===d); });
  populateAgencies(); loadConfig(); renderQuickStamps();
}

function renderQuickStamps(){
  const labels = QUICK_STAMPS[state.DISCIPLINE] || [];
  const el = document.getElementById('quickStamps');
  el.innerHTML = labels.map(l=>`<button type='button' class='btn bg-slate-700 hover:bg-slate-600 text-white text-xs' onclick='addStamp(${JSON.stringify(l).replace(/'/g,"&#39;")})'>${l}</button>`).join('');
}

function addStamp(label){
  const ta = document.getElementById('narrative');
  const now = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  ta.value += (ta.value ? '\n' : '') + `[${now}] ${label}`;
}

function populateAgencies(){
  const sel = document.getElementById('agency');
  const filtered = state.agencies.filter(a=>a.agency_type===state.DISCIPLINE);
  sel.innerHTML = filtered.map(a=>`<option value='${a.id}'>${a.name}</option>`).join('') || '<option value="">No agencies</option>';
  loadConfig();
}

async function loadConfig(){
  const agencyId = document.getElementById('agency').value;
  if(!agencyId) return;
  try {
    const [ctRes, prRes] = await Promise.all([api(`/config?agency_id=${agencyId}&category=call_types`), api(`/config?agency_id=${agencyId}&category=priorities`)]);
    const callTypes = ctRes[0]?.value || [];
    const priorities = prRes[0]?.value || [];
    state.configs[agencyId] = { callTypes, priorities };
    const csel = document.getElementById('callType');
    csel.innerHTML = callTypes.map(c=>`<option value='${c.label}' data-priority='${c.priority}'>${c.label} (P${c.priority})</option>`).join('') || '<option value="">No call types</option>';
    const psel = document.getElementById('priority');
    psel.innerHTML = priorities.map(p=>`<option value='${p.priority}'>P${p.priority} - ${p.label}</option>`).join('') || '<option value="2">2</option>';
    updatePriority();
  } catch(e){ showMsg(e.message, false); }
}

function updatePriority(){
  const csel = document.getElementById('callType');
  const p = csel.selectedOptions[0]?.dataset.priority;
  if(p) document.getElementById('priority').value = p;
}

document.getElementById('disciplineTabs').addEventListener('click', e=>{ if(e.target.classList.contains('tab')) setDiscipline(e.target.dataset.d); });
document.getElementById('agency').addEventListener('change', loadConfig);
document.getElementById('callType').addEventListener('change', updatePriority);

document.getElementById('callForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const body = {
    agency_id: parseInt(document.getElementById('agency').value),
    call_type: document.getElementById('callType').value,
    priority: parseInt(document.getElementById('priority').value),
    location_text: document.getElementById('location').value,
    callback: document.getElementById('callback').value,
    caller_name: document.getElementById('caller').value,
    narrative: document.getElementById('narrative').value,
    lat: document.getElementById('lat').value ? parseFloat(document.getElementById('lat').value) : null,
    lng: document.getElementById('lng').value ? parseFloat(document.getElementById('lng').value) : null,
    status: 'open'
  };
  try {
    await api('/incidents', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    showMsg('Incident created');
    setTimeout(()=>{ window.location.href = `/console?discipline=${state.DISCIPLINE}`; }, 800);
  } catch(err){ showMsg(err.message, false); }
});

async function init(){
  try {
    const params = new URLSearchParams(window.location.search);
    const d = params.get('discipline');
    const user = await api('/me'); state.user = user;
    state.agencies = await api('/agencies');
    state.agencyMap = {}; state.agencies.forEach(a=>state.agencyMap[a.id]=a);
    const selectedModule = user?.selected_module;
    const allowedDiscipline = selectedModule && selectedModule !== 'all' ? moduleToDiscipline(selectedModule) : (d || 'police');
    if(selectedModule && selectedModule !== 'all'){
      document.querySelectorAll('#disciplineTabs .tab').forEach(t=>t.classList.toggle('hidden', t.dataset.d !== allowedDiscipline));
    }
    setDiscipline(['police','fire','ems'].includes(allowedDiscipline) ? allowedDiscipline : 'police');
  } catch(err){ showMsg(err.message, false); }
}
init();
</script>
</body>
</html>
