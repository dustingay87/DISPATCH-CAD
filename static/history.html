<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>D2D Call History</title>
<script src='https://cdn.tailwindcss.com'></script>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' crossorigin=''>
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js' crossorigin=''></script>
<style>
  html,body { height:100%; margin:0; font-family: ui-sans-serif, system-ui, sans-serif; }
  .priority-1 { border-left:6px solid #ef4444; }
  .priority-2 { border-left:6px solid #f97316; }
  .priority-3 { border-left:6px solid #eab308; }
  .priority-4 { border-left:6px solid #22c55e; }
  .timeline-item { border-left:2px solid #475569; padding-left:1rem; margin-bottom:0.75rem; }
  .tab { padding:0.25rem 0.5rem; border-radius:0.25rem; font-size:0.75rem; background:#334155; color:#94a3b8; cursor:pointer; border:none; }
  .tab.active { background:#475569; color:#fff; }
  #map { height:300px; background:#0f172a; border-radius:0.5rem; }
</style>
</head>
<body class='bg-slate-900 text-slate-200 h-screen flex flex-col'>
  <header class='h-16 bg-slate-950 border-b border-slate-700 flex items-center justify-between px-4 shrink-0'>
    <div class='text-xl font-bold text-white'>D2D <span class='text-slate-500 font-normal text-base ml-2'>Call History</span></div>
    <a href='/' class='bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded'>Console</a>
  </header>
  <div class='flex-1 flex overflow-hidden'>
    <section class='w-1/3 border-r border-slate-700 flex flex-col p-3 space-y-2 overflow-hidden'>
      <div class='bg-slate-800 rounded p-3 space-y-2'>
        <div class='font-semibold text-slate-300'>Search / Filter</div>
        <div class='flex space-x-1' id='discTabs'>
          <button class='tab active' data-d='all'>All</button>
          <button class='tab' data-d='police'>Police</button>
          <button class='tab' data-d='fire'>Fire</button>
          <button class='tab' data-d='ems'>EMS</button>
        </div>
        <input id='search' placeholder='Search call #, type, location, caller' class='bg-slate-900 border border-slate-600 rounded p-2 w-full'>
        <div class='grid grid-cols-2 gap-2'>
          <select id='agencyFilter' class='bg-slate-900 border border-slate-600 rounded p-2'><option value=''>All agencies</option></select>
          <select id='statusFilter' class='bg-slate-900 border border-slate-600 rounded p-2'><option value=''>All statuses</option><option value='open'>Open</option><option value='dispatched'>Dispatched</option><option value='en_route'>En Route</option><option value='on_scene'>On Scene</option><option value='closed'>Closed</option></select>
        </div>
        <input id='callType' placeholder='Call type' class='bg-slate-900 border border-slate-600 rounded p-2 w-full'>
        <div class='grid grid-cols-2 gap-2'>
          <input id='fromDate' type='datetime-local' class='bg-slate-900 border border-slate-600 rounded p-2 text-xs'>
          <input id='toDate' type='datetime-local' class='bg-slate-900 border border-slate-600 rounded p-2 text-xs'>
        </div>
        <button id='searchBtn' class='bg-blue-700 hover:bg-blue-600 p-2 rounded w-full font-semibold'>Search</button>
      </div>
      <div class='flex-1 overflow-y-auto bg-slate-800 rounded p-2 space-y-2' id='results'>
        <div class='text-slate-500 p-4 text-center'>Use filters and click Search</div>
      </div>
    </section>
    <section class='w-2/3 flex flex-col overflow-hidden'>
      <div id='detail' class='flex-1 overflow-y-auto p-4 space-y-4'>
        <div class='text-slate-500 text-center mt-20'>Select a call to view details and timeline</div>
      </div>
    </section>
  </div>
<script>
function api(path, opts={}){ return fetch(path, {...opts, credentials:'include'}).then(r=>{ if(r.status===401){ window.location.href='/login'; throw new Error('Unauthorized'); } if(!r.ok) throw new Error(`${path} ${r.status}`); return r.json(); }); }
function fmtTime(iso){ if(!iso) return '-'; const d=new Date(iso); return d.toLocaleString(); }
let state = { agencies:[], zones:[], selected:null, selectedIncident:null, unitTrails:[] }; let map;
const DEFAULT_CENTER = [39.9612, -82.9988];

async function search(){
  try {
    if(!state.agencies.length) state.agencies = await api('/agencies');
    const params = new URLSearchParams();
    const s = document.getElementById('search').value; if(s) params.set('search',s);
    const status = document.getElementById('statusFilter').value; if(status) params.set('status',status);
    const type = document.getElementById('callType').value; if(type) params.set('call_type',type);
    const fromDate = document.getElementById('fromDate').value; if(fromDate) params.set('from_date', new Date(fromDate).toISOString());
    const toDate = document.getElementById('toDate').value; if(toDate) params.set('to_date', new Date(toDate).toISOString());
    const agencyId = document.getElementById('agencyFilter').value; if(agencyId) params.set('agency_id', agencyId);
    const incidents = await api('/incidents?'+params.toString());
    state.results = incidents;
    applyFilters();
  } catch(e){ document.getElementById('results').innerHTML = `<div class='p-4 text-red-400'>Error: ${e.message}</div>`; }
}

function applyFilters(){
  const am = agencyMap();
  const disc = state.discipline || 'all';
  let list = state.results || [];
  if(disc !== 'all' && !document.getElementById('agencyFilter').value){
    list = list.filter(i => (am[i.agency_id]?.agency_type) === disc);
  }
  renderResults(list);
}

function agencyMap(){ const m={}; state.agencies.forEach(a=>m[a.id]=a); return m; }

function renderResults(incidents){
  const am=agencyMap();
  const html = incidents.map(i=>{
    const a = am[i.agency_id] || {};
    return `<div class='p-3 rounded bg-slate-900 ${priorityClass(i.priority)} cursor-pointer hover:bg-slate-700' onclick='loadDetail(${i.id})'>
      <div class='flex justify-between items-center'><b class='text-white'>${i.call_number||i.incident_number}</b> <span class='text-xs px-1.5 rounded bg-slate-700'>${a.agency_type ? a.agency_type.toUpperCase() : '-'}</span></div>
      <div class='text-sm text-slate-300'>${i.call_type}</div>
      <div class='text-xs text-slate-500'>${i.status} | ${a.name||'-'} | ${i.location_text||'-'} | ${fmtTime(i.created_at)}</div>
    </div>`;
  }).join('');
  document.getElementById('results').innerHTML = html || '<div class="text-slate-500 p-4 text-center">No calls found</div>';
}
function priorityClass(p){ return `priority-${Math.min(Math.max(p||2,1),4)}`; }

async function loadDetail(id){
  state.selected=id;
  try {
    const [incident, timeline] = await Promise.all([api(`/incidents/${id}`), api(`/incidents/${id}/timeline`)]);
    const am=agencyMap();
    const i = incident;
    state.selectedIncident = i;
    const extra = (i.extra && typeof i.extra==='object') ? Object.entries(i.extra).map(([k,v])=>`<div><span class='text-slate-400 capitalize'>${k}:</span> ${v}</div>`).join('') : '';
    const timelineHtml = buildTimeline(timeline);
    document.getElementById('detail').innerHTML = `
      <div class='bg-slate-800 rounded p-4 ${priorityClass(i.priority)}'>
        <div class='flex justify-between items-start'>
          <div>
            <div class='text-3xl font-bold text-white'>${i.call_number||i.incident_number}</div>
            <div class='text-xl text-slate-200'>${i.call_type}</div>
          </div>
          <div class='text-3xl font-bold'>P${i.priority}</div>
        </div>
        <div class='grid grid-cols-3 gap-4 mt-4 text-sm'>
          <div><span class='text-slate-400'>Status:</span> ${i.status}</div>
          <div><span class='text-slate-400'>Agency:</span> ${am[i.agency_id]?.name||'-'} (${am[i.agency_id]?.agency_type||'-'})</div>
          <div><span class='text-slate-400'>Created:</span> ${fmtTime(i.created_at)}</div>
          <div><span class='text-slate-400'>Location:</span> ${i.location_text||'-'}</div>
          <div><span class='text-slate-400'>Caller:</span> ${i.caller_name||'-'} ${i.callback||''}</div>
          <div><span class='text-slate-400'>Closed:</span> ${fmtTime(i.closed_at)}</div>
        </div>
        <div class='mt-4'><span class='text-slate-400'>Narrative:</span> ${i.narrative||'-'}</div>
        ${extra ? `<div class='mt-4 grid grid-cols-3 gap-2 text-sm bg-slate-900/50 p-2 rounded'>${extra}</div>` : ''}
      </div>
      <div class='bg-slate-800 rounded p-4'>
        <div class='font-semibold text-slate-300 mb-3'>Timeline</div>
        ${timelineHtml}
      </div>
      <div class='bg-slate-800 rounded p-4'>
        <div class='font-semibold text-slate-300 mb-3'>Map & Trails</div>
        <div id='map' class='border border-slate-700'></div>
      </div>`;
    const unitIds = new Set();
    (timeline.assignments||[]).forEach(a=>unitIds.add(a.unit_id));
    (timeline.events||[]).forEach(e=>{ if(e.unit_id) unitIds.add(e.unit_id); });
    const positions = await api('/taip/positions?limit=500');
    initMap(); renderTrails([...unitIds], positions);
  } catch(e){ document.getElementById('detail').innerHTML = `<div class='p-4 text-red-400'>Error: ${e.message}</div>`; }
}

function buildTimeline(t){
  let html='';
  if(t.assignments && t.assignments.length){
    html += `<div class='mb-2 font-semibold text-slate-400'>Assignments</div>`;
    t.assignments.forEach(a=>{ html += `<div class='timeline-item'><b>Unit ${a.unit_id}</b> assigned ${fmtTime(a.assigned_at)} ${a.cleared_at?' - cleared '+fmtTime(a.cleared_at):''} ${a.notes?' ('+a.notes+')':''}</div>`; });
  }
  if(t.events && t.events.length){
    html += `<div class='mb-2 font-semibold text-slate-400'>Status Events</div>`;
    t.events.forEach(e=>{ html += `<div class='timeline-item'>${fmtTime(e.created_at)} - <b>${e.status_code}</b> ${e.reason||''}</div>`; });
  }
  if(t.messages && t.messages.length){
    html += `<div class='mb-2 font-semibold text-slate-400'>Dispatch Messages</div>`;
    t.messages.forEach(m=>{ html += `<div class='timeline-item'>${fmtTime(m.sent_at)} - ${m.message_text||''} <span class='text-slate-500'>(${m.method||''})</span></div>`; });
  }
  if(t.logs && t.logs.length){
    html += `<div class='mb-2 font-semibold text-slate-400'>Call Logs</div>`;
    t.logs.forEach(l=>{ html += `<div class='timeline-item'>${fmtTime(l.timestamp)} - [${l.log_type||''}] ${l.message||''}</div>`; });
  }
  if(!html) html = '<div class="text-slate-500">No timeline records</div>';
  return html;
}

function serviceAreaColor(type){ if(type==='primary') return '#22c55e'; if(type==='secondary') return '#3b82f6'; if(type==='mutual') return '#eab308'; return '#3b82f6'; }

function initMap(){
  if(map) map.remove();
  map = L.map('map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);
  const zoneLayer = L.layerGroup().addTo(map);
  (state.zones||[]).forEach(z=>{
    if(!z.geojson) return;
    try{
      const c = z.color || serviceAreaColor(z.zone_type);
      const gj = L.geoJSON(z.geojson, {style:{color:c, fillColor:c, fillOpacity:0.1, weight:2}}).addTo(zoneLayer);
      gj.bindPopup(`<b>${z.name}</b><br>${z.zone_type}`);
    }catch(e){}
  });
}

function renderTrails(unitIds, positions){
  if(!map) return;
  const trailLayer = L.layerGroup().addTo(map);
  let bounds = L.latLngBounds([]);
  (state.zones||[]).forEach(z=>{
    if(!z.geojson) return;
    try{
      const gb = L.geoJSON(z.geojson).getBounds();
      if(gb && gb.isValid()) bounds.extend(gb);
    }catch(e){}
  });
  const filtered = (positions || []).filter(p => unitIds.includes(p.unit_id) && p.lat!=null && p.lng!=null);
  const grouped = {};
  filtered.forEach(p => { if(!grouped[p.unit_id]) grouped[p.unit_id]=[]; grouped[p.unit_id].push([p.lat, p.lng]); });
  const colors = ['#ef4444','#22c55e','#3b82f6','#eab308','#a855f7'];
  Object.entries(grouped).forEach(([uid, pts], idx) => {
    if(pts.length < 2) return;
    L.polyline(pts, {color: colors[idx % colors.length], weight:2, opacity:0.8}).addTo(trailLayer);
    const last = pts[pts.length-1];
    L.circleMarker(last, {radius:5, color: colors[idx % colors.length], fillOpacity:1}).addTo(trailLayer).bindPopup(`Unit ${uid}`);
    pts.forEach(p=>bounds.extend(p));
  });
  if(state.selectedIncident && state.selectedIncident.lat!=null){
    L.circleMarker([state.selectedIncident.lat, state.selectedIncident.lng], {radius:8, color:'#ef4444', fillOpacity:0.6}).addTo(trailLayer).bindPopup('Incident');
    bounds.extend([state.selectedIncident.lat, state.selectedIncident.lng]);
  }
  if(bounds.isValid()){
    map.fitBounds(bounds, {padding:[20,20], maxZoom:15});
  } else {
    const a = state.selectedIncident && state.agencies.length ? state.agencies.find(ag=>ag.id===state.selectedIncident.agency_id) : null;
    const center = (state.selectedIncident && state.selectedIncident.lat!=null && state.selectedIncident.lng!=null) ? [state.selectedIncident.lat, state.selectedIncident.lng] : (a && a.lat!=null && a.lng!=null) ? [a.lat,a.lng] : DEFAULT_CENTER;
    map.setView(center, 13);
  }
}

async function loadAgencies(){
  state.agencies = await api('/agencies');
  try { state.zones = await api('/post-zones'); } catch(e){ state.zones = []; }
  const opts = state.agencies.map(a=>`<option value='${a.id}'>${a.name}</option>`).join('');
  document.getElementById('agencyFilter').innerHTML = '<option value="">All agencies</option>' + opts;
}

function init(){
  loadAgencies();
  document.getElementById('discTabs').addEventListener('click', e=>{
    if(!e.target.classList.contains('tab')) return;
    document.querySelectorAll('#discTabs .tab').forEach(t=>t.classList.remove('active'));
    e.target.classList.add('active');
    state.discipline = e.target.dataset.d;
    applyFilters();
  });
  document.getElementById('agencyFilter').addEventListener('change', search);
  document.getElementById('searchBtn').addEventListener('click', search);
  search();
}

init();
</script>
</body>
</html>
