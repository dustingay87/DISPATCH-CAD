<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>D2D Unified Response</title>
<script src='https://cdn.tailwindcss.com'></script>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' crossorigin=''>
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js' crossorigin=''></script>
<style>
* { box-sizing:border-box; }
html,body { height:100%; margin:0; overflow:hidden; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
.pri-1 { background:rgba(239,68,68,0.25); border-left:4px solid #ef4444; }
.pri-2 { background:rgba(249,115,22,0.25); border-left:4px solid #f97316; }
.pri-3 { background:rgba(234,179,8,0.25); border-left:4px solid #eab308; }
.pri-4 { background:rgba(34,197,94,0.25); border-left:4px solid #22c55e; }
.stat-AQ { color:#22c55e; }
.stat-OS { color:#ef4444; }
.stat-ER,.stat-TR,.stat-DEL { color:#eab308; }
.tbl { width:100%; border-collapse:collapse; font-size:0.75rem; }
.tbl th { background:#0f172a; padding:0.25rem 0.5rem; text-align:left; text-transform:uppercase; color:#94a3b8; }
.tbl td { padding:0.25rem 0.5rem; border-bottom:1px solid #334155; }
.tbl tr { cursor:pointer; }
.tbl tr:hover { background:rgba(255,255,255,0.05); }
.tbl tr.selected { outline:2px solid #3b82f6; }
#map { height:100%; min-height:180px; background:#0f172a; }
.panel { background:#1e293b; border:1px solid #334155; border-radius:0.375rem; overflow:hidden; display:flex; flex-direction:column; }
.panel-head { background:#0f172a; padding:0.35rem 0.5rem; font-weight:700; font-size:0.75rem; border-bottom:1px solid #334155; }
.panel-body { flex:1; overflow:auto; padding:0.25rem; }
@keyframes flashRed { 0%,100% { background:rgba(239,68,68,0.15); } 50% { background:rgba(239,68,68,0.55); } }
.flash-urgent { animation:flashRed 1.2s infinite; }
.overdue { color:#f87171; font-weight:bold; }
</style>
</head>
<body class='bg-slate-900 text-slate-200 text-xs h-screen flex flex-col'>
  <header class='h-14 bg-slate-950 border-b border-slate-700 flex items-center justify-between px-4 shrink-0'>
    <div class='flex items-center gap-2'>
      <div class='font-bold text-lg text-white' id='brandTitle'>D2D Unified Response</div>
      <select id='moduleSelect' class='bg-slate-800 border border-slate-600 rounded px-1 py-0.5 text-xs hidden'></select>
    </div>
    <div class='flex items-center gap-2'>
      <a href='/dashboard_v5' class='bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-xs'>v5 Console</a>
      <a href='/hud' class='bg-pink-700 hover:bg-pink-600 px-2 py-1 rounded text-xs'>HUD</a>
      <a href='/call-entry' class='bg-green-700 hover:bg-green-600 px-2 py-1 rounded text-xs'>Call Entry</a>
      <a href='/scheduled-transports-page' class='bg-indigo-700 hover:bg-indigo-600 px-2 py-1 rounded text-xs'>Scheduled</a>
      <a href='/coverage-page' class='bg-teal-700 hover:bg-teal-600 px-2 py-1 rounded text-xs'>Coverage</a>
      <a href='/reports-page' class='bg-orange-700 hover:bg-orange-600 px-2 py-1 rounded text-xs'>Reports</a>
      <a href='/mdt?unit_id=1' class='bg-purple-700 hover:bg-purple-600 px-2 py-1 rounded text-xs'>MDT</a>
      <a href='/mobile-mdt?unit_id=1' class='bg-purple-800 hover:bg-purple-700 px-2 py-1 rounded text-xs'>Mobile MDT</a>
      <a href='/avl' class='bg-cyan-700 hover:bg-cyan-600 px-2 py-1 rounded text-xs'>AVL</a>
    </div>
  </header>
  <main class='flex-1 grid grid-cols-12 gap-1 p-1 overflow-hidden'>
    <section class='col-span-8 flex flex-col gap-1 min-h-0'>
      <div class='panel flex-1 min-h-0'>
        <div class='panel-head flex justify-between'><span>Active Calls</span><span id='callCount' class='text-slate-400'>0</span></div>
        <div id='openWork' class='panel-body p-0'></div>
      </div>
      <div class='panel h-2/5 min-h-0'>
        <div class='panel-head'>Map</div>
        <div class='panel-body p-0'><div id='map'></div></div>
      </div>
    </section>
    <section class='col-span-4 flex flex-col gap-1 min-h-0'>
      <div class='panel h-1/3 min-h-0'>
        <div class='panel-head flex justify-between'><span>Scheduled Transports</span><span id='scheduledCount' class='text-slate-400'>0</span></div>
        <div id='scheduledList' class='panel-body p-0'></div>
      </div>
      <div class='panel flex-1 min-h-0'>
        <div class='panel-head flex justify-between'><span>On Duty Units</span><span id='unitCount' class='text-slate-400'>0</span></div>
        <div id='vehicleInfo' class='panel-body p-0'></div>
      </div>
      <div class='panel h-2/5 min-h-0'>
        <div class='panel-head'>Trip / Vehicle Summary</div>
        <div id='tripSummary' class='panel-body'></div>
      </div>
    </section>
  </main>
<script>
const CENTER=[39.9612,-82.9988];
let state={agencies:[],units:[],mapUnits:[],incidents:[],scheduled:[],agencyMap:{},postZones:[],unitPostings:[],postingMap:{},personnel:[],selectedTrip:null,selectedVehicle:null,user:null,crossAgencies:[]};
const MODULE_LABELS={ems:'EMS',fire:'Fire',law:'Law',all:'Command'};
const MODULE_BRAND={ems:'D2D EMS',fire:'D2D Fire',law:'D2D Law',all:'D2D Command'};
const MODULE_COLOR={ems:'bg-emerald-700',fire:'bg-red-700',law:'bg-blue-700',all:'bg-purple-700'};
let map,layers;

function api(path,opts={}){return fetch(path,{...opts,credentials:'include'}).then(r=>{if(r.status===401){window.location.href='/login';throw new Error('Unauthorized');}if(!r.ok)throw new Error(`${path} ${r.status}`);return r.json();});}
function statusLabel(c){const M={AQ:'Available',OS:'On Scene',ER:'En Route',TR:'Transport',CAN:'Cancelled',NPF:'No Patient Found',DEL:'Delivered',AFR:'Available for Response',LUN:'Lunch',OOS:'Out of Service',MAINT:'Maintenance',AK:'Dispatched',dispatched:'Dispatched',open:'Open',closed:'Closed',en_route:'En Route',on_scene:'On Scene',TC:'Traffic Control',CT:'Citation',ARR:'Arrest',BK:'Booking',WATER:'Water on Fire',EXT:'Extinguished',OVER:'Overhaul'};return M[c]||c;}
function fmtTime(iso){if(!iso)return '-';const d=new Date(iso);return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function fmtDur(s){const h=Math.floor(s/3600);const m=Math.floor((s%3600)/60);const sec=Math.floor(s%60);return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;}
function elapsed(iso){return iso?(Date.now()-new Date(iso).getTime())/1000:0;}
function priorityClass(p){return `pri-${Math.min(Math.max(p||2,1),4)}`;}
function statClass(c){if(c==='AQ')return 'stat-AQ';if(c==='OS')return 'stat-OS';if(['ER','TR','DEL'].includes(c))return 'stat-ER';return 'text-slate-400';}

function applyModuleBadge(){
  const m=state.user?.selected_module||localStorage.getItem('ur_module')||'all';
  document.getElementById('brandTitle').textContent=MODULE_BRAND[m]||MODULE_BRAND.all;
  document.title=MODULE_BRAND[m]||MODULE_BRAND.all;
  const sel=document.getElementById('moduleSelect');
  if(sel){ sel.value=m; }
}
function populateModuleSelect(){
  const mods=state.user?.modules||[];
  const sel=document.getElementById('moduleSelect');
  if(!mods.length){ sel.classList.add('hidden'); return; }
  const options=[...mods.map(m=>`<option value='${m}'>${MODULE_LABELS[m]||m}</option>`),`<option value='all'>${MODULE_LABELS.all}</option>`];
  sel.innerHTML=options.join('');
  sel.classList.remove('hidden');
  sel.onchange=async (e)=>{
    const m=e.target.value;
    try{
      await api('/me/module',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({module:m})});
      if(state.user) state.user.selected_module=m;
      localStorage.setItem('ur_module',m);
      applyModuleBadge();
      load();
    }catch(err){console.error(err);}
  };
}
async function init(){
  try{
    state.user=await api('/me');
    state.crossAgencies=state.user.cross_discipline_agencies||[];
    localStorage.setItem('ur_module',state.user.selected_module||'all');
    populateModuleSelect();applyModuleBadge();load();
  }catch(e){console.error(e);load();}
}
async function load(){
  const aid=state.user?.agency_id;
  const promises=[api('/agencies'),api('/units'),api('/incidents'),api('/post-zones'),api('/unit-postings'),api('/scheduled-transports?status=scheduled')];
  if(aid) promises.push(api(`/personnel?agency_id=${aid}`));
  const [agencies,units,incidents,postZones,unitPostings,scheduled,...rest]=await Promise.all(promises);
  state.personnel=aid?rest[0]:[];
  state.agencies=agencies;state.incidents=incidents;state.scheduled=scheduled||[];state.agencyMap={};state.agencies.forEach(a=>state.agencyMap[a.id]=a);
  if(state.user && state.user.selected_module && state.user.selected_module!=='all'){
    const sm=state.user.selected_module;
    state.incidents=state.incidents.filter(i=>{const at=(state.agencyMap[i.agency_id]||{}).agency_type;return (sm==='law'&&at==='police')||at===sm;});
    state.units=units.filter(u=>{const at=(state.agencyMap[u.agency_id]||{}).agency_type;return (sm==='law'&&at==='police')||at===sm;});
    state.mapUnits=units.filter(u=>{const at=(state.agencyMap[u.agency_id]||{}).agency_type; return (sm==='law'&&at==='police')||at===sm||state.crossAgencies.includes(u.agency_id);});
  } else {
    state.units=units; state.mapUnits=units;
  }
  state.postZones=postZones||[];state.unitPostings=unitPostings||[];state.postingMap={};
  (state.unitPostings||[]).forEach(p=>{ if(p.is_current) state.postingMap[p.unit_id]=p.post_zone; });
  renderOpenWork();renderVehicleInfo();renderMap();renderTripSummary();renderScheduled();
}
function initMap(){if(map)return;map=L.map('map',{center:CENTER,zoom:11});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap'}).addTo(map);layers={units:L.layerGroup().addTo(map),incidents:L.layerGroup().addTo(map),zones:L.layerGroup().addTo(map)};}

function renderOpenWork(){
  const active=state.incidents.filter(i=>i.status!=='closed').sort((a,b)=>(a.priority||2)-(b.priority||2)||new Date(b.created_at)-new Date(a.created_at));
  document.getElementById('callCount').textContent=active.length;
  const html=active.length?`<table class='tbl'><thead><tr><th>Priority</th><th>Call Type</th><th>Time</th><th>Location</th><th>City</th><th>Agency</th><th>Status</th><th>Units</th></tr></thead><tbody>`+active.map(i=>{
    const a=state.agencyMap[i.agency_id]||{};
    const assigned=state.units.filter(u=>u.current_incident_id===i.id).map(u=>u.call_sign).join(', ')||'-';
    return `<tr class='${priorityClass(i.priority)} ${state.selectedTrip===i.id?'selected':''}' onclick='selectTrip(${i.id})'>
      <td class='font-bold'>P${i.priority}</td>
      <td>${i.call_type}</td>
      <td>${fmtTime(i.created_at)}</td>
      <td>${i.location_text||'-'}</td>
      <td>${i.city||'-'}</td>
      <td>${a.name||'-'}</td>
      <td class='${statClass(i.status)}'>${statusLabel(i.status)}</td>
      <td>${assigned}</td>
    </tr>`;
  }).join('')+'</tbody></table>':'<div class="p-2 text-slate-500">No active calls</div>';
  document.getElementById('openWork').innerHTML=html;
}

function renderVehicleInfo(){
  const sorted=state.units.slice().sort((a,b)=>(a.call_sign||'').localeCompare(b.call_sign||''));
  document.getElementById('unitCount').textContent=sorted.length;
  const html=sorted.length?`<table class='tbl'><thead><tr><th>Unit</th><th>Type</th><th>Svc</th><th>Status</th><th>Call</th><th>Post</th><th>Loc</th></tr></thead><tbody>`+sorted.map(u=>{
    const inc=u.current_incident_id?(state.incidents.find(i=>i.id===u.current_incident_id)?.call_number||u.current_incident_id):'-';
    const svc=u.capabilities && u.capabilities.service_level ? u.capabilities.service_level : '-';
    const post = state.postingMap[u.id] ? state.postingMap[u.id].name : '-';
    return `<tr class='${state.selectedVehicle===u.id?'selected':''}' onclick='selectVehicle(${u.id})'>
      <td class='font-bold'>${u.call_sign}</td>
      <td>${u.unit_type||'-'}</td>
      <td>${svc}</td>
      <td class='${statClass(u.current_status)} cursor-context-menu' oncontextmenu='showUnitStatusMenu(event, ${u.id}); return false;'>${statusLabel(u.current_status)}</td>
      <td>${inc}</td>
      <td>${post}</td>
      <td>${u.lat!=null&&u.lng!=null?'GPS':'-'}</td>
    </tr>`;
  }).join('')+'</tbody></table>':'<div class="p-2 text-slate-500">No units</div>';
  document.getElementById('vehicleInfo').innerHTML=html;
}

function renderMap(){
  initMap();layers.units.clearLayers();layers.incidents.clearLayers();layers.zones.clearLayers();
  (state.postZones||[]).forEach(z=>{
    if(!z.geojson) return;
    try {
      const gj = L.geoJSON(z.geojson, {style:{color:z.color||'#3b82f6',weight:2,fillColor:z.color||'#3b82f6',fillOpacity:0.1}}).addTo(layers.zones);
      gj.bindPopup(`<b>${z.name}</b><br>${z.zone_type||'post'}<br>Min units: ${z.minimum_units||0}`);
    } catch(e){ console.log('zone render error', z, e); }
  });
  state.mapUnits.forEach(u=>{if(u.lat==null||u.lng==null)return;const col=u.current_status==='OS'?'#ef4444':u.current_status==='AQ'?'#22c55e':u.current_status==='ER'||u.current_status==='TR'||u.current_status==='DEL'?'#eab308':'#64748b';const a=state.agencyMap[u.agency_id]||{};const cross=a.agency_type && (a.agency_type!==(state.user?.selected_module==='law'?'police':state.user?.selected_module));const m=L.circleMarker([u.lat,u.lng],{radius:cross?4:6,color:col,fillColor:col,fillOpacity:0.9}).addTo(layers.units);m.bindPopup(`<b>${u.call_sign}</b><br>${statusLabel(u.current_status)}<br><span class='text-slate-400'>${a.name||a.agency_type||''}</span>`);});
  state.incidents.forEach(i=>{if(i.lat==null||i.lng==null)return;const col=i.priority===1?'#ef4444':i.priority===2?'#f97316':i.priority===3?'#eab308':'#22c55e';const m=L.circleMarker([i.lat,i.lng],{radius:8,color:col,fillColor:col,fillOpacity:0.6}).addTo(layers.incidents);m.bindPopup(`<b>${i.call_number||i.incident_number}</b><br>${i.call_type}<br>${statusLabel(i.status)}`);});
}

function renderTripSummary(){
  const el=document.getElementById('tripSummary');el.innerHTML='';
  if(state.selectedTrip){
    const i=state.incidents.find(x=>x.id===state.selectedTrip);if(!i)return;
    const a=state.agencyMap[i.agency_id]||{};
    const assigned=state.units.filter(u=>u.current_incident_id===i.id).map(u=>u.call_sign).join(', ')||'none';
    const opts=state.units.filter(u=>u.current_status==='AQ'||u.current_status==='Available').map(u=>`<option value='${u.id}'>${u.call_sign}</option>`).join('');
    el.innerHTML=`<div class='space-y-1'>
      <div class='font-bold text-white'>${i.call_number||i.incident_number}</div>
      <div>${i.call_type} <span class='text-slate-400'>P${i.priority}</span></div>
      <div><span class='text-slate-400'>Location:</span> ${i.location_text||'-'}</div>
      <div><span class='text-slate-400'>Agency:</span> ${a.name||'-'}</div>
      <div><span class='text-slate-400'>Status:</span> ${statusLabel(i.status)}</div>
      <div><span class='text-slate-400'>Elapsed:</span> ${fmtDur(elapsed(i.created_at))}</div>
      <div><span class='text-slate-400'>Units:</span> ${assigned}</div>
      <div id='destinationStatusSummary' class='text-xs text-slate-400 mt-1'>Destination status: loading...</div>
      <div id='mileageSummary' class='text-xs text-slate-400 mt-1'>Mileage: loading...</div>
      <div class='flex gap-1 mt-2'><select id='addUnit' class='bg-slate-800 border border-slate-600 rounded px-1 py-0.5 text-xs'><option value=''>Add unit</option>${opts}</select><button class='bg-blue-700 hover:bg-blue-600 px-2 py-0.5 rounded text-xs' onclick='addUnitToTrip(${i.id})'>Add</button></div>
      <div class='mt-2'><div class='text-xs font-semibold text-slate-400'>Recommendations</div><div id='recs'>Loading...</div></div>
    </div>`;
    loadRecommendations(i.id); loadMileageSummary(i.id); loadDestinationStatusSummary(i.id);
  }else if(state.selectedVehicle){
    const u=state.units.find(x=>x.id===state.selectedVehicle);if(!u)return;
    const inc=u.current_incident_id?(state.incidents.find(i=>i.id===u.current_incident_id)?.call_number||u.current_incident_id):'-';
    const crew=state.personnel.filter(p=>p.current_unit_id===u.id);
    const crewList=crew.map(p=>`<span class='inline-flex items-center gap-1 bg-slate-700 rounded px-1 py-0.5'>${p.first_name} ${p.last_name} <button class='text-red-400 hover:text-red-300' onclick='removeCrew(${p.id})'>&times;</button></span>`).join(' ')||'<span class="text-slate-500">-</span>';
    const maxCrew=3;
    const canAdd=crew.length<maxCrew;
    const available=state.personnel.filter(p=>!p.current_unit_id && (p.duty_status==='off_duty'||p.duty_status==='on_duty')).map(p=>`<option value='${p.id}'>${p.first_name} ${p.last_name}</option>`).join('');
    const addCrew=canAdd&&available?`<div class='flex gap-1 mt-1'><select id='addCrew' class='bg-slate-800 border border-slate-600 rounded px-1 py-0.5 text-xs'><option value=''>Add crew</option>${available}</select><button class='bg-blue-700 hover:bg-blue-600 px-2 py-0.5 rounded text-xs' onclick='addCrewToUnit(${u.id})'>Add</button></div>`:`<div class='text-xs text-slate-500 mt-1'>Crew full or none available (max ${maxCrew})</div>`;
    el.innerHTML=`<div class='space-y-1'>
      <div class='font-bold text-white'>${u.call_sign}</div>
      <div><span class='text-slate-400'>Status:</span> ${statusLabel(u.current_status)}</div>
      <div><span class='text-slate-400'>Type:</span> ${u.unit_type||'-'}</div>
      <div><span class='text-slate-400'>Agency:</span> ${state.agencyMap[u.agency_id]?.name||'-'}</div>
      <div><span class='text-slate-400'>Current Call:</span> ${inc}</div>
      <div><span class='text-slate-400'>Crew:</span> ${crewList}</div>
      ${addCrew}
    </div>`;
  }else{el.innerHTML='<div class="text-slate-500">Select a trip or vehicle.</div>';}
}

window.selectTrip=function(id){state.selectedTrip=id;state.selectedVehicle=null;renderOpenWork();renderVehicleInfo();renderTripSummary();}
window.selectVehicle=function(id){state.selectedVehicle=id;state.selectedTrip=null;renderOpenWork();renderVehicleInfo();renderTripSummary();}
window.addUnitToTrip=async function(incidentId){const uid=document.getElementById('addUnit').value;if(!uid)return;try{await api(`/incidents/${incidentId}/dispatch/${uid}`,{method:'POST'});await load();}catch(e){alert(e.message);}}
window.addCrewToUnit=async function(unitId){const pid=parseInt(document.getElementById('addCrew').value);if(!pid)return;try{await api(`/personnel/${pid}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_unit_id:unitId,duty_status:'on_duty'})});await load();}catch(e){alert(e.message);}}

let statusMenuUnit=null;
async function showUnitStatusMenu(event,unitId){
  event.preventDefault();event.stopPropagation();
  statusMenuUnit=state.units.find(u=>u.id===unitId); if(!statusMenuUnit) return;
  let menu=document.getElementById('unitStatusMenu');
  if(!menu){ menu=document.createElement('div'); menu.id='unitStatusMenu'; menu.className='hidden fixed z-50 bg-slate-800 border border-slate-600 rounded p-1 shadow-lg min-w-[160px]'; document.body.appendChild(menu); }
  try{
    const cfg=await api(`/config?agency_id=${statusMenuUnit.agency_id}&category=statuses`);
    const statuses=(cfg && cfg.length && cfg[0].value) ? cfg[0].value : [{code:'AQ',label:'Available'},{code:'ER',label:'En Route'},{code:'OS',label:'On Scene'},{code:'TR',label:'Transport'},{code:'CAN',label:'Cancelled'},{code:'OOS',label:'OOS'}];
    menu.innerHTML=statuses.map(s=>`<div class='px-2 py-1 text-xs hover:bg-slate-700 cursor-pointer' onclick='setUnitStatus(${unitId}, "${s.code}")'>${s.label||s.code}</div>`).join('') + `<div class='border-t border-slate-600 my-1'></div><div class='px-2 py-1 text-xs text-red-400 hover:bg-slate-700 cursor-pointer' onclick='setUnitStatus(${unitId}, "OOS")'>Out of Service</div>`;
    menu.style.left=Math.min(event.clientX, window.innerWidth-180)+'px';
    menu.style.top=Math.min(event.clientY, window.innerHeight-200)+'px';
    menu.classList.remove('hidden');
    const hide=(e)=>{ if(!menu.contains(e.target)){ menu.classList.add('hidden'); document.removeEventListener('click',hide); } };
    setTimeout(()=>document.addEventListener('click',hide), 10);
  }catch(e){ console.error(e); }
}
window.setUnitStatus=async function(unitId,code){
  try{
    await api(`/units/${unitId}/status`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status_code:code})});
    const menu=document.getElementById('unitStatusMenu'); if(menu) menu.classList.add('hidden');
    await load();
  }catch(e){ alert(e.message); }
}
window.removeCrew=async function(personnelId){if(!confirm('Remove crew from unit?'))return;try{await api(`/personnel/${personnelId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_unit_id:null,duty_status:'off_duty'})});await load();}catch(e){alert(e.message);}}
window.loadRecommendations=async function(incidentId){const el=document.getElementById('recs');if(!el)return;try{const recs=await api(`/incidents/${incidentId}/recommend`);el.innerHTML=recs.length?recs.map(r=>`<div class='flex justify-between items-center py-0.5 border-b border-slate-700'><div><b>${r.call_sign}</b> <span class='text-slate-400'>${r.service_level||''}</span> <span class='text-slate-500'>${r.distance_miles!=null?r.distance_miles.toFixed(1)+' mi':''}</span></div><div class='text-right'><div class='text-slate-400'>${r.reason}</div><button class='bg-blue-700 hover:bg-blue-600 px-1 py-0.5 rounded text-xs' onclick='addRecUnit(${incidentId},${r.unit_id})'>Add</button></div></div>`).join(''):'<span class="text-slate-500">No recommendations</span>';}catch(e){el.innerHTML='<span class="text-red-400">Error loading recommendations</span>';}}
window.addRecUnit=async function(incidentId,unitId){try{await api(`/incidents/${incidentId}/dispatch/${unitId}`,{method:'POST'});await load();}catch(e){alert(e.message);}}
function renderScheduled(){
  const list=state.scheduled.slice().sort((a,b)=>new Date(a.scheduled_at)-new Date(b.scheduled_at));
  document.getElementById('scheduledCount').textContent=list.length;
  const html=list.length?`<table class='tbl'><thead><tr><th>Due</th><th>Patient</th><th>Pickup</th><th>Destination</th><th>Agency</th><th>Status</th></tr></thead><tbody>`+list.map(st=>{
    const due=st.scheduled_at?new Date(st.scheduled_at).getTime():0;
    const now=Date.now();
    const ms=due-now;
    const flash=ms>0 && ms<=3600000?'flash-urgent':'';
    const overdue=ms<=0?'overdue':'';
    const dueText=ms>0?fmtDur(ms/1000)+' out':'Overdue '+fmtDur(-ms/1000);
    const a=state.agencyMap[st.agency_id]||{};
    return `<tr class='${flash} ${overdue}'>
      <td class='whitespace-nowrap'>${fmtTime(st.scheduled_at)}<br><span class='text-xs ${overdue}'>${dueText}</span></td>
      <td>${st.patient_name||'-'}</td>
      <td>${st.pickup_address||'-'}</td>
      <td>${st.destination_name||st.destination_address||'-'}</td>
      <td>${a.name||'-'}</td>
      <td>${st.status||'scheduled'}</td>
    </tr>`;
  }).join('')+'</tbody></table>':'<div class="p-2 text-slate-500">No scheduled transports</div>';
  document.getElementById('scheduledList').innerHTML=html;
}
window.loadMileageSummary=async function(incidentId){
  const el=document.getElementById('mileageSummary'); if(!el) return;
  try {
    const data=await api(`/incidents/${incidentId}/mileage-summary`);
    const total=data.total_trip_miles!=null?`Trip: ${data.total_trip_miles} mi`:'';
    const legs=(data.legs||[]).map(l=>`${l.call_sign||'Unit'} -> ${l.destination||'?'}: ${l.trip_miles!=null?l.trip_miles+' mi':'?'}${l.turnaround_seconds!=null? ', turn '+fmtDur(l.turnaround_seconds):''}`).join('<br>');
    el.innerHTML = `<div class='text-xs text-slate-400'><b>Mileage</b> ${total}</div>${legs?`<div class='text-xs text-slate-500'>${legs}</div>`:''}`;
  } catch(e){ el.innerHTML = `<div class='text-xs text-slate-500'>Mileage: unavailable</div>`; }
}
window.loadDestinationStatusSummary=async function(incidentId){
  const el=document.getElementById('destinationStatusSummary'); if(!el) return;
  try {
    const dest=await api(`/incidents/${incidentId}/destination`);
    const d=dest.destination||{};
    if(!d.id){ el.innerHTML=''; return; }
    const s=await api(`/destinations/${d.id}/status?limit=1`);
    if(s && s.length){
      const st=s[0];
      const col={open:'text-green-400',divert:'text-red-400',on_hold:'text-yellow-400',full:'text-orange-400',closed:'text-slate-400'}[st.status]||'text-slate-400';
      el.innerHTML = `<b>Destination status:</b> <span class='${col} font-bold'>${st.status.toUpperCase()}${st.reason ? ' - '+st.reason : ''}</span>`;
    } else { el.innerHTML = `<b>Destination status:</b> <span class='text-slate-500'>open</span>`; }
  } catch(e){ el.innerHTML = `<b>Destination status:</b> <span class='text-slate-500'>unavailable</span>`; }
}

init();setInterval(load,5000);
</script>
