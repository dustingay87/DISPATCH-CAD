<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Unified Response - Super Admin</title>
<script src='https://cdn.tailwindcss.com'></script>
<style>
  html,body { height:100%; margin:0; background:#0f172a; color:#e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:0.5rem; padding:1.5rem; }
  .btn { padding:0.6rem 1.2rem; border-radius:0.375rem; font-size:0.9rem; cursor:pointer; display:inline-block; text-align:center; border:none; }
  .btn-primary { background:#2563eb; color:#fff; }
  .btn-primary:hover { background:#1d4ed8; }
  .btn-slate { background:#475569; color:#fff; }
  .btn-slate:hover { background:#334155; }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .hidden { display:none; }
</style>
<link rel='stylesheet' href='/static/theme.css'>
<script>if(localStorage.getItem('ur_theme')==='light')document.documentElement.classList.add('light');</script>
</head>
<body class='p-6'>
  <div class='max-w-4xl mx-auto'>
    <div class='flex justify-between items-center mb-6'>
      <h1 class='text-2xl font-bold'>Super Admin</h1>
      <button class='btn btn-slate' onclick='logout()'>Logout</button>
    </div>
    <div id='msg' class='hidden mb-4 px-4 py-2 rounded text-sm'></div>

    <div id='landing' class='grid grid-cols-1 md:grid-cols-2 gap-6'>
      <div class='card text-center'>
        <h2 class='text-xl font-semibold mb-2'>New Customer</h2>
        <p class='text-slate-400 text-sm mb-4'>Create a new customer and their first agency from scratch.</p>
        <a href='/agency-setup' class='btn btn-primary'>Create Customer + Agency</a>
      </div>
      <div class='card text-center'>
        <h2 class='text-xl font-semibold mb-2'>Existing Customer</h2>
        <p class='text-slate-400 text-sm mb-4'>Manage an existing customer or build out their agency.</p>
        <button id='existingBtn' class='btn btn-slate' onclick='showExisting()' disabled>View Customers</button>
      </div>
    </div>

    <div id='existing' class='hidden mt-6'>
      <div class='flex justify-between items-center mb-3'>
        <h2 class='text-lg font-semibold'>Existing Customers</h2>
        <button class='btn btn-slate' onclick='showLanding()'>Back</button>
      </div>
      <div id='customerList' class='space-y-2'></div>
    </div>
  </div>

<script>
const msg = document.getElementById('msg');
function showMsg(text, ok=true){
  msg.textContent = text;
  msg.className = 'mb-4 px-4 py-2 rounded text-sm ' + (ok ? 'bg-green-900 text-green-200' : 'bg-red-900 text-red-200');
  msg.classList.remove('hidden');
}

async function api(path, opts={}){
  opts.credentials = 'include';
  opts.headers = opts.headers || {};
  if(opts.body && typeof opts.body === 'string' && !opts.headers['Content-Type']){
    opts.headers['Content-Type'] = 'application/json';
  }
  const res = await fetch(path, opts);
  if(!res.ok){
    const txt = await res.text();
    throw new Error(txt || 'Request failed');
  }
  return res.json().catch(()=>{});
}

async function logout(){
  await fetch('/logout', {method:'POST', credentials:'include'});
  window.location.href = '/login';
}

function showLanding(){
  document.getElementById('landing').classList.remove('hidden');
  document.getElementById('existing').classList.add('hidden');
}

async function showExisting(){
  document.getElementById('landing').classList.add('hidden');
  document.getElementById('existing').classList.remove('hidden');
  try {
    const customers = await api('/customers');
    const agencies = await api('/agencies');
    const agencyMap = Object.fromEntries(agencies.map(a=>[a.customer_id, a]));
    const list = document.getElementById('customerList');
    if(!customers.length){
      list.innerHTML = '<p class="text-slate-400">No customers yet.</p>';
      return;
    }
    list.innerHTML = customers.map(c=>{
      const a = agencyMap[c.id];
      return `<div class="card flex justify-between items-center">
        <div>
          <div class="font-semibold">${c.name}</div>
          <div class="text-xs text-slate-400">${c.slug} ${a ? '· ' + a.name : ''}</div>
        </div>
        <a href="/agency-setup?customer_id=${c.id}&agency_id=${a ? a.id : ''}" class="btn btn-primary">Open</a>
      </div>`;
    }).join('');
  } catch(e){
    showMsg(e.message, false);
  }
}

(async function init(){
  try {
    const me = await api('/me');
    if(me.role !== 'superadmin'){
      window.location.href = '/';
      return;
    }
    const customers = await api('/customers');
    if(customers && customers.length){
      document.getElementById('existingBtn').disabled = false;
    }
  } catch(e){
    window.location.href = '/login';
  }
})();
</script>
<script src="/static/theme.js"></script>
</body>
</html>
