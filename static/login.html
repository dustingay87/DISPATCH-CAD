<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Unified Response - Login</title>
<link rel='icon' href='/static/favicon.png' type='image/png'>
<script src='https://cdn.tailwindcss.com'></script>
<link rel='stylesheet' href='/static/branding.css'>
<style>
  html,body { height:100%; margin:0; font-family: 'Inter', system-ui, sans-serif; }
</style>

<link rel='stylesheet' href='/static/theme.css'>
<script>if(localStorage.getItem('ur_theme')==='light')document.documentElement.classList.add('light');</script>
</head>
<body class='d2d-bg-navy text-slate-100 flex items-center justify-center h-screen d2d-font-body'>
  <div class='bg-slate-800 border border-slate-600 rounded-xl p-8 w-full max-w-md shadow-2xl text-center'>
    <img src='/static/d2d-logo.png' class='h-16 w-16 mx-auto mb-3' alt='Unified Response'>
    <h1 class='text-3xl d2d-logo-text text-white mb-1'>Unified Response</h1>
    <p class='text-sm d2d-text-cyan mb-6'>Built for the call. Designed for the response.</p>
    <form id='loginForm' class='space-y-4 text-left'>
      <div>
        <label class='block text-sm text-slate-300 mb-1'>Email</label>
        <input id='email' type='email' required class='w-full bg-slate-900 border border-slate-600 rounded p-3 text-white'>
      </div>
      <div>
        <label class='block text-sm text-slate-300 mb-1'>Password</label>
        <input id='password' type='password' required class='w-full bg-slate-900 border border-slate-600 rounded p-3 text-white'>
      </div>
      <div>
        <label class='block text-sm text-slate-300 mb-1'>Customer ID (optional)</label>
        <input id='customer' type='text' placeholder='your-customer' class='w-full bg-slate-900 border border-slate-600 rounded p-3 text-white'>
      </div>
      <button type='submit' class='w-full d2d-btn py-3'>Log In</button>
    </form>
    <div id='error' class='mt-4 text-red-400 text-sm text-center hidden'></div>
  </div>
<script>
const customerInput = document.getElementById('customer');
const urlParams = new URLSearchParams(window.location.search);
const urlCustomer = urlParams.get('customer');
if (urlCustomer) customerInput.value = urlCustomer;

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const customer_slug = customerInput.value.trim() || undefined;
  const payload = customer_slug ? {email, password, customer_slug} : {email, password};
  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      credentials: 'include',
      body: JSON.stringify(payload)
    });
    if (!res.ok) { throw new Error('Invalid credentials'); }
    window.location.href = '/';
  } catch (err) { document.getElementById('error').textContent = err.message; document.getElementById('error').classList.remove('hidden'); }
});
</script>
<script src="/static/theme.js"></script>
</body>
</html>
