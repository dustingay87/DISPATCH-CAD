<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>
<title>D2D MDT</title>
<script src='https://cdn.tailwindcss.com'></script>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' crossorigin=''>
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js' crossorigin=''></script>
<style>
body { -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
.touch-btn { min-height:56px; }
.tab { padding:0.5rem 0.75rem; border-bottom:2px solid transparent; font-size:0.85rem; font-weight:600; color:#94a3b8; }
.tab.active { color:#fff; border-color:#2563eb; }
.tab-content { display:none; }
.tab-content.active { display:block; }
.card { background:#1e293b; border:1px solid #334155; border-radius:0.375rem; padding:0.5rem; margin-bottom:0.5rem; }
.map { width:100%; height:60vh; min-height:280px; background:#0f172a; border-radius:0.375rem; }
@keyframes flash-call { 0%,100% { background:rgba(239,68,68,0.15); border-color:#ef4444; box-shadow:0 0 0 0 rgba(239,68,68,0.4); } 50% { background:rgba(239,68,68,0.45); border-color:#f87171; box-shadow:0 0 12px 2px rgba(239,68,68,0.6); } }
.flash-alert { animation: flash-call 1s infinite; border:2px solid #ef4444; }
</style>
</head>
<body class='bg-slate-950 text-slate-200 min-h-screen flex flex-col'>

<div id='unitPicker' class='fixed inset-0 bg-slate-950 z-50 hidden flex items-center justify-center p-4'>
  <div class='bg-slate-900 border border-slate-700 rounded p-4 w-full max-w-sm'>
    <div class='text-lg font-bold text-white mb-1' id='pickerTitle'>Select Unit</div>
    <div class='text-sm text-slate-400 mb-3' id='pickerSub'>Choose the unit you are assigned to.</div>
    <select id='pickerUnit' class='w-full bg-slate-800 border border-slate-600 rounded p-2 mb-3'></select>
    <button id='pickerGo' class='w-full bg-blue-700 hover:bg-blue-600 text-white font-semibold rounded p-3'>Go to MDT</button>
  </div>
</div>

<header class='bg-slate-900 border-b border-slate-700 p-3 sticky top-0 z-10'>
  <div class='flex justify-between items-start'>
    <div>
      <div class='text-sm font-bold text-white' id='brandTitle'>D2D MDT</div>
      <div class='text-xs text-slate-400' id='unitAgency'>--</div>
    </div>
    <div class='text-right'>
      <div id='unitCallsign' class='text-lg font-bold text-white'>--</div>
      <div id='unitStatus' class='text-sm font-bold text-green-400'>--</div>
    </div>
  </div>
  <div class='flex justify-between items-center mt-2'>
    <div id='roleBadge' class='text-xs font-bold px-2 py-0.5 rounded bg-slate-700'>--</div>
    <div class='text-xs text-slate-500'>Shift <span id='shiftTimer'>--</span></div>
  </div>
</header>

<nav class='bg-slate-900 border-b border-slate-700 px-2 flex gap-2 overflow-x-auto' id='tabNav'>
  <button class='tab active' data-tab='call'>Call</button>
  <button class='tab' data-tab='calls'>Calls</button>
  <button class='tab' data-tab='units'>Units</button>
  <button class='tab' data-tab='map'>Map</button>
  <button class='tab' data-tab='notes'>Notes</button>
</nav>

<main class='flex-1 p-3'>
  <div id='call' class='tab-content active'>
    <div id='callPanel' class='card'><div class='text-slate-500'>No active call</div></div>
    <div id='emsActions' class='hidden mt-3'>
      <div class='text-xs font-semibold text-slate-400 mb-2 uppercase'>Status</div>
      <div id='statusButtons' class='grid grid-cols-3 gap-2'></div>
      <div class='grid grid-cols-2 gap-2 mt-3'>
        <button class='touch-btn bg-blue-700 hover:bg-blue-600 rounded text-sm font-semibold' onclick='locate()'>Update GPS</button>
        <button class='touch-btn bg-slate-700 hover:bg-slate-600 rounded text-sm font-semibold' onclick='sendQuickMessage()'>Quick Message</button>
        <button class='touch-btn bg-slate-700 hover:bg-slate-600 rounded text-sm font-semibold' onclick='toggleInService()'>Toggle In/Out</button>
      </div>
    </div>
  </div>

  <div id='calls' class='tab-content'>
    <div class='text-sm font-semibold text-slate-400 mb-1 uppercase'>Active Calls</div>
    <div id='activeCallsList' class='space-y-2 mb-4'></div>
    <div class='text-sm font-semibold text-slate-400 mb-1 uppercase'>Call History</div>
    <div id='historyCallsList' class='space-y-2'></div>
  </div>

  <div id='units' class='tab-content'>
    <div class='text-sm font-semibold text-slate-400 mb-1 uppercase'>On Duty Units / Crew</div>
    <div id='unitsList' class='space-y-2'></div>
  </div>

  <div id='map' class='tab-content'>
    <div id='map' class='map'></div>
  </div>

  <div id='notes' class='tab-content'>
    <div id='notesPanel' class='text-slate-500'>Select a call to view notes and messages.</div>
  </div>
</main>

<div id='loading' class='fixed inset-0 bg-slate-950/90 flex items-center justify-center text-2xl font-bold z-50 hidden'>Loading...</div>

<script>
const url = new URL(window.location.href);
let unitId = parseInt(url.searchParams.get('unit_id')) || null;
let state = { me:null, personnel:null, unit:null, agencies:[], agencyMap:{}, incidents:[], activeIncidents:[], historyIncidents:[], messages:[], allUnits:[], personnelList:[], config:{statuses:[],dispositions:[],callTypes:[]}, map:null, selectedIncident:null, crossAgencies:[] };
const DEFAULT_CENTER = [39.9612,-82.9988];

const ROLE_BADGE = { ems:{label:'D2D EMS',color:'bg-emerald-700'}, fire:{label:'D2D Fire',color:'bg-red-700'}, law:{label:'D2D Law',color:'bg-blue-700'}, all:{label:'D2D Command',color:'bg-purple-700'} };

function showLoading(msg='Loading...'){ const el=document.getElementById('loading'); if(!el) return; el.textContent=msg; el.classList.remove('hidden'); }
function hideLoading(){ const el=document.getElementById('loading'); if(!el) return; el.classList.add('hidden'); }
function api(path,opts={}){ return fetch(path,{...opts,credentials:'include'}).then(r=>{ if(r.status===401){ window.location.href='/login'; throw new Error('Unauthorized'); } if(!r.ok) throw new Error(`${path} ${r.status}`); return r.json(); }); }
function fmtDur(s){ const h=Math.floor(s/3600); const m=Math.floor((s%3600)/60); const sec=Math.floor(s%60); return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }
function elapsed(iso){ return iso ? (Date.now()-new Date(iso).getTime())/1000 : 0; }
function fmtTime(iso){ if(!iso) return '-'; const d=new Date(iso); return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function statusLabel(code){ const M={AQ:'Available',OS:'On Scene',ER:'En Route',TR:'Transport',CAN:'Cancelled',NPF:'No Patient Found',DEL:'Delivered',AFR:'Available for Response',LUN:'Lunch',OOS:'Out of Service',MAINT:'Maintenance',AK:'Dispatched',dispatched:'Dispatched',open:'Open',closed:'Closed',en_route:'En Route',on_scene:'On Scene',TC:'Traffic Control',CT:'Citation',ARR:'Arrest',BK:'Booking',WATER:'Water on Fire',EXT:'Extinguished',OVER:'Overhaul'}; return M[code]||code; }

function roleFromAgencyType(t){
  if(t==='police') return 'law';
  if(t==='fire') return 'fire';
  if(t==='ems') return 'ems';
  return 'all';
}

async function init(){
  showLoading();
  try {
    const [me, agencies] = await Promise.all([api('/me'), api('/agencies')]);
    state.me = me; state.agencies = agencies; state.agencyMap = {}; agencies.forEach(a=>state.agencyMap[a.id]=a);
    state.crossAgencies = me.cross_discipline_agencies || [];
    try { state.personnel = await api('/personnel/me'); } catch(e){ state.personnel = null; }
    try { state.allUnits = await api('/units'); } catch(e){ state.allUnits = []; }
    if(!unitId){
      const role = roleFromAgencyType(state.agencyMap[me.agency_id]?.agency_type);
      if((role==='law'||role==='fire') && state.personnel?.current_unit_id){
        unitId = state.personnel.current_unit_id;
        url.searchParams.set('unit_id', unitId); history.replaceState(null,'',url);
      } else {
        showUnitPicker(); return;
      }
    }
    await start();
  } catch(e){ document.body.innerHTML = `<div class='p-4 text-red-400'>Error: ${e.message}</div>`; }
}

function showUnitPicker(){
  hideLoading();
  const me = state.me; const role = roleFromAgencyType(state.agencyMap[me.agency_id]?.agency_type);
  document.getElementById('pickerTitle').textContent = role==='ems' ? 'Select Your Unit' : 'Select Unit';
  document.getElementById('pickerSub').textContent = 'Choose the unit you are assigned to for this session.';
  const picker = document.getElementById('pickerUnit');
  const units = state.allUnits.length ? state.allUnits : [];
  picker.innerHTML = '<option value="">-- choose unit --</option>' + units.filter(u=>u.agency_id===me.agency_id).map(u=>`<option value='${u.id}' ${state.personnel?.current_unit_id==u.id?'selected':''}>${u.call_sign} (${u.name})</option>`).join('');
  document.getElementById('unitPicker').classList.remove('hidden');
}

document.getElementById('pickerGo').addEventListener('click', async ()=>{
  const id = parseInt(document.getElementById('pickerUnit').value);
  if(!id){ alert('Select a unit'); return; }
  try {
    if(state.personnel){
      await api(`/personnel/${state.personnel.id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({current_unit_id:id, duty_status:'on_duty'})});
    }
    unitId = id;
    url.searchParams.set('unit_id', unitId); history.replaceState(null,'',url);
    document.getElementById('unitPicker').classList.add('hidden');
    await start();
  } catch(e){ alert(e.message); }
});

async function refresh(){
  if(!unitId || state.refreshing) return;
  state.refreshing = true;
  try {
    const [unit, messages] = await Promise.all([api(`/units/${unitId}`), api(`/units/${unitId}/messages`)]);
    const hadPacket = !!state.packet;
    const wasUnacked = state.packet && state.packet.requires_ack;
    state.unit = unit;
    state.messages = messages;
    if(unit.current_incident_id){
      const incident = await api(`/incidents/${unit.current_incident_id}`);
      state.incident = incident;
      try { state.packet = await api(`/incidents/${unit.current_incident_id}/packet/${unitId}`); } catch(e){ state.packet = null; }
    } else { state.incident = null; state.packet = null; }
    const nowUnacked = state.packet && state.packet.requires_ack;
    if(nowUnacked && (!hadPacket || !wasUnacked)){ try { if('vibrate' in navigator) navigator.vibrate([500,200,500]); } catch(e){} }
    render();
  } catch(e){ console.error('MDT refresh error', e); }
  finally { state.refreshing = false; }
}

async function start(){
  showLoading();
  try {
    const [unit, allUnits, activeIncidents, historyIncidents, messages, personnelList, cfg] = await Promise.all([
      api(`/units/${unitId}`),
      api('/units'),
      api(`/incidents?agency_id=${state.me.agency_id}&status=open`),
      api(`/incidents?agency_id=${state.me.agency_id}&status=closed`),
      api(`/units/${unitId}/messages`),
      api(`/personnel?agency_id=${state.me.agency_id}`),
      api(`/config?agency_id=${state.me.agency_id}`)
    ]);
    state.unit = unit;
    state.allUnits = allUnits;
    state.activeIncidents = activeIncidents;
    state.historyIncidents = historyIncidents;
    state.messages = messages;
    state.personnelList = personnelList;
    state.config.statuses = cfg.find(c=>c.category==='statuses')?.value || [];
    state.config.callTypes = cfg.find(c=>c.category==='call_types')?.value || [];
    const disp = cfg.find(c=>c.category==='dispositions')?.value;
    state.config.dispositions = disp ? (Array.isArray(disp)?disp:[disp]) : [];
    try { state.zones = await api('/post-zones'); } catch(e){ state.zones = []; }
    if(unit.current_incident_id){ state.incident = await api(`/incidents/${unit.current_incident_id}`); try { state.packet = await api(`/incidents/${unit.current_incident_id}/packet/${unitId}`); } catch(e){ state.packet = null; } }
    else { state.incident = null; state.packet = null; }
    if(!state.pollTimer) state.pollTimer = setInterval(refresh, 5000);
    render();
  } catch(e){
    console.error(e);
    if(e.message && e.message.startsWith(`/units/${unitId}`) && e.message.includes('404')){
      unitId = null;
      showUnitPicker();
      return;
    }
    document.body.innerHTML = `<div class='p-4 text-red-400'>Error: ${e.message}</div>`;
  } finally { hideLoading(); }
}

function render(){
  const u = state.unit; const a = state.agencyMap[u.agency_id]||{};
  const role = roleFromAgencyType(a.agency_type);
  const badge = ROLE_BADGE[role] || ROLE_BADGE.all;
  document.getElementById('brandTitle').textContent = `D2D ${role==='all'?'Command':role.toUpperCase()} MDT`;
  document.getElementById('unitCallsign').textContent = u.call_sign;
  document.getElementById('unitAgency').textContent = a.name || a.agency_type || '';
  document.getElementById('unitStatus').textContent = statusLabel(u.current_status);
  document.getElementById('shiftTimer').textContent = u.in_service_at ? fmtDur(elapsed(u.in_service_at)) : '--';
  const rb = document.getElementById('roleBadge');
  rb.textContent = badge.label; rb.className = `text-xs font-bold px-2 py-0.5 rounded ${badge.color}`;

  // EMS actions only
  document.getElementById('emsActions').classList.toggle('hidden', role!=='ems');
  if(role==='ems'){ renderCallPanel(); renderStatusButtons(); }
  else { renderCallPanel(); }
  renderActiveCalls(); renderHistory(); renderUnitsTab(); renderNotes(); renderMap();
}

function renderCallPanel(){
  const el=document.getElementById('callPanel');
  const p=state.packet;
  const flashClass = p && p.requires_ack ? 'flash-alert' : '';
  if(!p){ el.innerHTML = `<div class='text-slate-500'>No active call</div>`; return; }
  const elapsedCall = fmtDur(elapsed(p.acknowledged_at||p.incident_id));
  const dest = p.destination ? `<div class='text-xs text-slate-300 mt-1'>Dest: <span class='font-semibold'>${p.destination.name}</span> ${p.destination.address||''}</div>` : '';
  const assigned = p.assigned_units.map(u=>u.call_sign).join(', ') || '-';
  const loc = [p.standardized_address||p.location_text, p.cross_streets, p.zone_name].filter(Boolean).join(' • ') || '-';
  const ack = p.requires_ack ? `<button class='mt-2 w-full touch-btn bg-green-700 hover:bg-green-600 rounded font-semibold text-sm' onclick='ackPacket()'>Acknowledge Dispatch</button>` : `<div class='mt-2 text-xs text-green-400 font-semibold'>Acknowledged</div>`;
  const resource = p.resource_status && p.resource_status.profiled ? `<div class='text-xs text-slate-400 mt-1'>Resources: ${p.resource_status.filled}/${p.resource_status.total_required} filled</div>` : '';
  const dfHtml = renderDisciplineFieldsMDT(p.extra, (p.agency||{}).agency_type);
  el.innerHTML = `
    <div class='${flashClass} p-2 -m-2 rounded'>
    ${p.requires_ack ? "<div class='text-center font-bold text-red-400 mb-1 animate-pulse'>NEW DISPATCH - ACK REQUIRED</div>" : ''}
    <div class='font-bold text-lg text-white mb-1'>${p.call_number||p.incident_number}</div>
    <div class='text-sm'>${p.call_type} <span class='text-slate-400'>P${p.priority}</span></div>
    <div class='text-xs text-slate-300 mt-1'>${loc}</div>
    <div class='text-xs text-slate-400 mt-1'>Units: ${assigned}</div>
    <div class='text-xs text-slate-300 mt-1 bg-slate-900 p-1 rounded max-h-24 overflow-auto'>${p.narrative||'No narrative'}</div>
    ${dfHtml}
    ${resource}
    ${dest}
    <div class='text-xs text-slate-400 mt-1'>Elapsed: ${elapsedCall}</div>
    ${ack}
    </div>
  `;
}

async function ackPacket(){
  if(!state.packet) return;
  showLoading('Acknowledging...');
  try {
    await api(`/incidents/${state.packet.incident_id}/units/${unitId}/ack`, {method:'POST'});
    state.packet = await api(`/incidents/${state.packet.incident_id}/packet/${unitId}`);
    render();
  } catch(e){ alert(e.message); }
  finally { hideLoading(); }
}

function renderStatusButtons(){
  const el=document.getElementById('statusButtons');
  let statuses = state.config.statuses.length ? [...state.config.statuses] : [{code:'AQ',label:'Available'},{code:'ER',label:'En Route'},{code:'OS',label:'On Scene'},{code:'TR',label:'Transport'},{code:'AD',label:'Arrived at Destination'},{code:'CAN',label:'Cancelled'},{code:'OOS',label:'OOS'}];
  const agency = state.agencyMap[state.me?.agency_id] || {};
  if(agency.agency_type === 'ems' && !statuses.find(s=>s.code==='AD')){
    statuses.push({code:'AD', label:'Arrived at Destination'});
  }
  const colors = {AQ:'bg-green-700 hover:bg-green-600',ER:'bg-blue-700 hover:bg-blue-600',OS:'bg-red-700 hover:bg-red-600',TR:'bg-purple-700 hover:bg-purple-600',AD:'bg-emerald-700 hover:bg-emerald-600',CAN:'bg-slate-700 hover:bg-slate-600',LUN:'bg-slate-700 hover:bg-slate-600',OOS:'bg-slate-700 hover:bg-slate-600',MAINT:'bg-slate-700 hover:bg-slate-600',WATER:'bg-orange-700 hover:bg-orange-600',EXT:'bg-green-800 hover:bg-green-700',OVER:'bg-teal-700 hover:bg-teal-700',TC:'bg-yellow-700 hover:bg-yellow-600',CT:'bg-yellow-700 hover:bg-yellow-600',ARR:'bg-red-800 hover:bg-red-700',BK:'bg-slate-700 hover:bg-slate-600'};
  el.innerHTML = statuses.map(s=>{
    const col = colors[s.code] || 'bg-slate-700 hover:bg-slate-600';
    return `<button class='touch-btn ${col} rounded font-semibold text-sm' onclick='setStatus("${s.code}")'>${s.label||s.code}</button>`;
  }).join('');
}

function renderActiveCalls(){
  const el=document.getElementById('activeCallsList');
  el.innerHTML = state.activeIncidents.length ? state.activeIncidents.map(i=>callRow(i)).join('') : '<div class="text-slate-500">No active calls</div>';
}
function renderHistory(){
  const el=document.getElementById('historyCallsList');
  el.innerHTML = state.historyIncidents.length ? state.historyIncidents.slice(0,20).map(i=>callRow(i)).join('') : '<div class="text-slate-500">No history</div>';
}
function callRow(i){
  const u = (i.assigned_units||[]).map(u=>u.call_sign||u.unit_id).join(', ') || '-';
  return `<div class='card cursor-pointer' onclick='selectIncident(${i.id})'>
    <div class='flex justify-between'><span class='font-bold text-white'>${i.call_number||i.incident_number}</span><span class='text-slate-400'>P${i.priority}</span></div>
    <div class='text-sm'>${i.call_type}</div>
    <div class='text-xs text-slate-300'>${i.location_text||'-'}</div>
    <div class='text-xs text-slate-400 mt-1'>Units: ${u} • ${fmtTime(i.created_at)}</div>
  </div>`;
}

function renderUnitsTab(){
  const el=document.getElementById('unitsList');
  const units = state.allUnits.filter(u=>{
    if(u.agency_id===state.me.agency_id) return true;
    return state.crossAgencies.includes(u.agency_id);
  });
  const onDuty = state.personnelList.filter(p=>p.duty_status==='on_duty' && p.current_unit_id);
  el.innerHTML = units.map(u=>{
    const crew = onDuty.filter(p=>p.current_unit_id===u.id).map(p=>`${p.first_name} ${p.last_name}`).join(', ');
    const a = state.agencyMap[u.agency_id]||{};
    const stateLabel = u.offline ? 'Offline' : u.stale ? 'Stale' : u.current_status;
    const stateColor = u.offline ? 'text-red-400' : u.stale ? 'text-orange-400' : 'text-slate-300';
    return `<div class='card'><div class='flex justify-between'><span class='font-bold text-white'>${u.call_sign}</span><span class='text-xs ${u.agency_id===state.me.agency_id?"text-green-400":"text-blue-300"}'>${a.agency_type||'-'}</span></div><div class='text-xs ${stateColor}'>${stateLabel} • ${u.name}</div>${crew?`<div class='text-xs text-slate-400 mt-1'>Crew: ${crew}</div>`:''}</div>`;
  }).join('') || '<div class="text-slate-500">No units</div>';
}

function renderNotes(){
  const el=document.getElementById('notesPanel');
  if(!state.selectedIncident){ el.innerHTML = '<div class="text-slate-500">Select a call to view notes and messages.</div>'; return; }
  const i = state.selectedIncident;
  const agency = state.agencyMap[i.agency_id]||{};
  const dfHtml = renderDisciplineFieldsMDT(i.extra, agency.agency_type);
  el.innerHTML = `
    <div class='font-bold text-white mb-2'>${i.call_number||i.incident_number} • ${i.call_type}</div>
    <div class='text-sm text-slate-300 mb-2'>${i.narrative || 'No narrative.'}</div>
    ${dfHtml}
    <div class='text-sm font-semibold text-slate-400 mb-1'>Messages</div>
    <div id='incidentNotes' class='space-y-2'></div>
  `;
  loadIncidentNotes(i.id);
}

async function loadIncidentNotes(incidentId){
  try {
    const [timeline, msgs] = await Promise.all([api(`/incidents/${incidentId}/timeline`), api(`/messages`)]);
    const notes = [];
    timeline.forEach(t=>notes.push({at:t.timestamp, text:`${t.event} ${t.user?`by ${t.user}`:''}`, type:'event'}));
    (msgs||[]).filter(m=>m.incident_id===incidentId).forEach(m=>notes.push({at:m.sent_at||m.created_at, text:m.message_text, type:'msg'}));
    notes.sort((a,b)=>new Date(a.at)-new Date(b.at));
    document.getElementById('incidentNotes').innerHTML = notes.length ? notes.map(n=>`<div class='text-xs border-b border-slate-700 pb-1'><span class='text-slate-500'>${fmtTime(n.at)}</span> ${n.text}</div>`).join('') : '<div class="text-slate-500 text-xs">No notes.</div>';
  } catch(e){ document.getElementById('incidentNotes').innerHTML = '<div class="text-slate-500 text-xs">Notes unavailable.</div>'; }
}

function renderDisciplineFieldsMDT(extra, discipline){
  const df = extra && extra.discipline_fields;
  if(!df || !Object.keys(df).length) return '';
  const labels = { crime_type:'Crime Type', weapon:'Weapon', in_progress:'In Progress', suspect_count:'# Suspects', victim_count:'# Victims', suspect_desc:'Suspect Description', safety_notes:'Safety Notes', smoke_color:'Smoke Color', structure_type:'Structure Type', occupancy:'Occupancy', visible_flames:'Visible Flames', hazmat:'Hazmat', exposures:'Exposures', chief_complaint:'Chief Complaint', patient_age:'Patient Age', patient_sex:'Patient Sex', consciousness:'Consciousness', breathing:'Breathing', bleeding:'Bleeding', allergies:'Allergies', medications:'Medications' };
  const rows = Object.entries(df).map(([k,v])=>{
    const label = labels[k] || k.replace(/_/g,' ').replace(/\b\w/g, c=>c.toUpperCase());
    const val = v===true ? 'Yes' : v===false ? 'No' : v==null || v==='' ? '-' : v;
    return `<div class='text-xs text-slate-300'><span class='text-slate-500 uppercase text-[10px]'>${label}</span> ${val}</div>`;
  }).join('');
  return `<div class='bg-slate-900 p-2 rounded mb-2 grid grid-cols-2 gap-1'>${rows}</div>`;
}

async function selectIncident(id){
  state.selectedIncident = state.activeIncidents.find(i=>i.id===id) || state.historyIncidents.find(i=>i.id===id);
  if(!state.selectedIncident){
    try { state.selectedIncident = await api(`/incidents/${id}`); } catch(e){ return; }
  }
  showTab('notes');
  renderNotes();
}

function initMap(){
  if(state.map) return;
  state.map = L.map('map');
  state.zonesLayer = L.layerGroup().addTo(state.map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap'}).addTo(state.map);
}
function serviceAreaColor(type){ if(type==='primary') return '#22c55e'; if(type==='secondary') return '#3b82f6'; if(type==='mutual') return '#eab308'; return '#3b82f6'; }
function renderMap(){
  initMap();
  state.map.eachLayer(l=>{ if(l instanceof L.Marker || l instanceof L.CircleMarker) state.map.removeLayer(l); });
  if(state.zonesLayer){ state.zonesLayer.clearLayers(); }
  else { state.zonesLayer = L.layerGroup().addTo(state.map); }
  let bounds=L.latLngBounds([]);
  (state.zones||[]).forEach(z=>{
    if(!z.geojson) return;
    try{
      const c = z.color || serviceAreaColor(z.zone_type);
      const gj = L.geoJSON(z.geojson, {style:{color:c, fillColor:c, fillOpacity:0.1, weight:2}}).addTo(state.zonesLayer);
      gj.bindPopup(`<b>${z.name}</b><br>${z.zone_type}`);
      if(gj.getBounds && gj.getBounds().isValid()) bounds.extend(gj.getBounds());
    }catch(e){}
  });
  const showIds = [state.me.agency_id, ...state.crossAgencies];
  state.allUnits.forEach(u=>{
    if(!u.lat || !u.lng) return;
    const isOwn = u.agency_id===state.me.agency_id;
    if(!isOwn && !state.crossAgencies.includes(u.agency_id)) return;
    const a = state.agencyMap[u.agency_id]||{};
    let color = a.agency_type==='police'?'blue':a.agency_type==='fire'?'red':a.agency_type==='ems'?'green':'purple';
    if(u.offline) color = '#334155';
    else if(u.stale) color = '#f97316';
    const m = L.circleMarker([u.lat,u.lng],{radius:8,color:color,fillColor:color,fillOpacity:0.8}).addTo(state.map);
    const last=u.last_seen_at?new Date(u.last_seen_at).toLocaleTimeString():'unknown';
    const stateLabel=u.offline?'Offline':u.stale?'Stale':statusLabel(u.current_status);
    m.bindPopup(`<b>${u.call_sign}</b><br>${stateLabel}<br><span class='text-slate-400'>Last seen: ${last}</span><br>${u.name}`);
    bounds.extend([u.lat,u.lng]);
  });
  [...state.activeIncidents, ...state.historyIncidents].forEach(i=>{
    if(!i.lat || !i.lng) return;
    if(i.agency_id !== state.me.agency_id) return;
    const m = L.marker([i.lat,i.lng]).addTo(state.map);
    m.bindPopup(`<b>${i.call_number||i.incident_number}</b><br>${i.call_type}<br>${i.location_text}`);
    bounds.extend([i.lat,i.lng]);
  });
  if(bounds.isValid()){
    state.map.fitBounds(bounds,{padding:[20,20],maxZoom:15});
  } else {
    const u=state.unit, a=u ? state.agencyMap[u.agency_id] : null;
    const center = (u && u.lat!=null && u.lng!=null) ? [u.lat,u.lng] : (a && a.lat!=null && a.lng!=null ? [a.lat,a.lng] : DEFAULT_CENTER);
    state.map.setView(center, 11);
  }
}

window.setStatus = async function(code){
  const u=state.unit; if(!u) return;
  let extra={status_code:code, lat:u.lat, lng:u.lng};
  if(['TR','CAN','ARR','CT'].includes(code)){ const pc=prompt('Count / note:'); if(pc) extra.reason=pc; }
  if(['CAN','TR','ARR','NPF'].includes(code) && state.config.dispositions.length){ const d=prompt('Disposition?\n'+state.config.dispositions.join('\n')); if(d) extra.disposition=d; }
  if(u.current_incident_id && ['OS','ER','TR','ED','TH','DEL','AQ','AD','HEMS','TRP'].includes(code)){
    const promptMsg = code==='OS' ? 'Mileage at scene (odometer)?' : (code==='AD' ? 'Mileage at destination (odometer)?' : 'Mileage (odometer)?');
    const m=prompt(promptMsg); if(m && !isNaN(parseFloat(m))) extra.mileage=parseFloat(m);
  }
  if((code==='TR' || code==='ED') && u.current_incident_id){ let dest=prompt('Destination name:'); if(dest){ extra.destination={name:dest, category:'transport'}; } }
  const path = u.current_incident_id ? `/incidents/${u.current_incident_id}/units/${u.id}/status` : `/units/${u.id}/status`;
  try { await api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(extra)}); await start(); } catch(e){ alert(e.message); }
};

window.locate = function(){
  if(!navigator.geolocation){ alert('Geolocation not supported'); return; }
  navigator.geolocation.getCurrentPosition(async pos=>{
    try { await api(`/units/${unitId}/location`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({lat:pos.coords.latitude, lng:pos.coords.longitude, speed:pos.coords.speed, heading:pos.coords.heading})}); state.unit.lat=pos.coords.latitude; state.unit.lng=pos.coords.longitude; renderMap(); }
    catch(e){}
  }, e=>alert('GPS error: '+e.message), {enableHighAccuracy:true});
};

window.sendQuickMessage = async function(){
  const text = prompt('Message:'); if(!text) return;
  const payload = state.incident ? {incident_id:state.incident.id, channel:'mdt', message_text:text} : {channel:'mdt', message_text:text};
  try { await api('/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); await start(); } catch(e){ alert(e.message); }
};

window.toggleInService = async function(){
  const u=state.unit; if(!u) return;
  const code = u.current_status==='OOS' ? 'AQ' : 'OOS';
  try { await api(`/units/${unitId}/status`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status_code:code})}); await start(); } catch(e){ alert(e.message); }
};

function showTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.toggle('active', c.id===name));
  if(name==='map' && state.map){ setTimeout(()=>state.map.invalidateSize(), 100); }
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>showTab(t.dataset.tab)));

init();
</script>
</body>
</html>
