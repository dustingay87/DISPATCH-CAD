<script>
function showJSError(err){
  const el = document.getElementById('callList') || document.getElementById('main') || document.body;
  if(el) el.insertAdjacentHTML('afterbegin', "<div class='p-2 m-1 text-red-400 bg-red-900/20 border border-red-700 rounded text-xs' id='jsError'>JS error: " + (err.message||err) + "</div>");
}
window.onerror = function(msg, src, line, col, err){ showJSError(err||msg); };
window.addEventListener('unhandledrejection', function(e){ showJSError(e.reason); });
</script>

<script>
const DEFAULT_CENTER = [39.9612,-82.9988];
let state = { agencies:[], units:[], incidents:[], messages:[], personnel:[], agencyMap:{}, configs:{}, postZones:[], selectedIncident:null, selectedUnit:null, logs:[], trails:{}, showTrails:true, showCritical:false, mapLayers:[], destinations:{}, lastCallsHtml:null, lastUnitsHtml:null, showClosed:false };
const QUICK_STAMPS = {
  police: ['Shots Fired','Officer Down','Help Needed','K9 Released','Taser Deployed','OC Deployed','In Custody','Vehicle Pursuit','Foot Pursuit','TVI','Crash','Item Thrown','Secure the Chanel','Send Coroner','Send EMS','Send Fire','Send Rescue','Entry Made','Vehicle Search','Building Search'],

};
const AVAILABLE_STATUSES = ['AQ','AFR','POSTING','STAGED','AT_STATION','AVAILABLE_ON_RADIO','IN_SERVICE','ON_DUTY','AVAILABLE'];
function haversineMiles(lat1, lon1, lat2, lon2){
  const R = 3958.8;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R*c;
}
function getDisciplineFromAgency(agencyId){ return (state.agencyMap[agencyId]||{}).agency_type || 'fire'; }
function getAgencyFeatures(agencyId){
  const cfg = state.configs[agencyId] || {};
  const agency = state.agencyMap ? (state.agencyMap[agencyId] || {}) : {};
  const defaultPlanning = ['fire','police'].includes(agency.agency_type);
  return Object.assign({transport:true, mileage:false, personnel:true, fire_report:true, response_planning:defaultPlanning}, cfg.features || {});
}
function getResponseGoals(agencyId){
  const a = state.agencyMap[agencyId] || {};
  if(a.agency_type !== 'ems') return {};
  const cfg = state.configs[agencyId] || {};
  return Object.assign({dispatch_seconds:60, en_route_seconds:120, on_scene_city_seconds:480, on_scene_county_seconds:1800}, cfg.response_goals || {});
}
const pathDisc = window.location.pathname.replace(/^\/|\/$/g,'');
let DISCIPLINE = ['police','fire','ems'].includes(pathDisc) ? pathDisc : (new URLSearchParams(window.location.search).get('discipline') || 'all');
let map, layers;
const LAYOUT_KEY='d2d_dispatch_layout';
const DEFAULT_TIMEZONE='America/Chicago';
function toDefaultTimezoneIso(d){
  const pad = n => String(n).padStart(2,'0');
  const s = d.toLocaleString('en-US', {timeZone: DEFAULT_TIMEZONE, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
  const m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4}), (\d{2}):(\d{2}):(\d{2})/);
  if(!m) return d.toISOString();
  return `${m[3]}-${pad(m[1])}-${pad(m[2])}T${m[4]}:${m[5]}:${m[6]}`;
}
const DISCIPLINE_BRAND={all:{name:'Unified Response',logo:'/static/d2d-logo.png'}, police:{name:'Unified Response - Law',logo:'/static/logo-law.png'}, fire:{name:'Unified Response - Fire',logo:'/static/logo-fire.png'}, ems:{name:'Unified Response - EMS',logo:'/static/logo-ems.png'}};

function updateBrand(){

  const logo = document.getElementById('brandLogo');

function loadLayout(){
  try{ const raw=localStorage.getItem(LAYOUT_KEY); if(raw){ return JSON.parse(raw); } }catch(e){}
  return {col1:'25%',col2:'45%',col3:'30%',rowTop:'55%',rowBottom:'45%',footer:'9rem',locked:false};
}
function saveLayout(l){
  localStorage.setItem(LAYOUT_KEY, JSON.stringify(l));
  api('/me/preferences', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({preferences:{layout:l}})}).catch(()=>{});
}
function applyLayout(l){
  const main=document.getElementById('main');
  const center=document.getElementById('center');
  const footer=document.getElementById('footer');
  if(main){ main.style.setProperty('--col1', l.col1); main.style.setProperty('--col2', l.col2); main.style.setProperty('--col3', l.col3); }
  if(center){ center.style.setProperty('--rowTop', l.rowTop); center.style.setProperty('--rowBottom', l.rowBottom); }
  if(footer){ footer.style.height = l.footer; }
  document.body.classList.toggle('locked', !!l.locked);
  const cb=document.getElementById('lockLayout'); if(cb) cb.checked=!!l.locked;
}
function setupResizers(){
  const main=document.getElementById('main'), center=document.getElementById('center'), footer=document.getElementById('footer');
  const r1=document.getElementById('resizer1'), r2=document.getElementById('resizer2'), rv=document.getElementById('resizerV'), fr=document.getElementById('footerResizer');

  function pct(v){ return parseFloat(v); }
  function setCol(idx, v){ main.style.setProperty('--col'+idx, v+'%'); }
  function setRow(top, bottom){ center.style.setProperty('--rowTop', top+'%'); center.style.setProperty('--rowBottom', bottom+'%'); }

  function hResize(idx, e){
    e.preventDefault();
    const startX=e.clientX, total=main.clientWidth-8;
    const c1=pct(getComputedStyle(main).getPropertyValue('--col1')), c2=pct(getComputedStyle(main).getPropertyValue('--col2')), c3=pct(getComputedStyle(main).getPropertyValue('--col3'));
    function move(ev){
      const dx=ev.clientX-startX, dPct=dx/total*100;
      if(idx===1){
        const n1=Math.max(10, Math.min(80, c1+dPct)), n2=Math.max(10, Math.min(80, c2-dPct));
        if(n1+n2<95){ setCol(1,n1); setCol(2,n2); }
      } else {
        const n2=Math.max(10, Math.min(80, c2+dPct)), n3=Math.max(10, Math.min(80, c3-dPct));
        if(n2+n3<95){ setCol(2,n2); setCol(3,n3); }
      }
      window.dispatchEvent(new Event('resize'));
    }
    function up(){
      document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);
      const l=loadLayout(); ['col1','col2','col3'].forEach((k,i)=>l[k]=getComputedStyle(main).getPropertyValue('--col'+(i+1)).trim()); saveLayout(l);
    }
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
  }
  if(r1) r1.addEventListener('mousedown', e=>hResize(1,e));
  if(r2) r2.addEventListener('mousedown', e=>hResize(2,e));

  if(rv) rv.addEventListener('mousedown', e=>{
    e.preventDefault();
    const startY=e.clientY, total=center.clientHeight-4;
    const top=pct(getComputedStyle(center).getPropertyValue('--rowTop')), bottom=pct(getComputedStyle(center).getPropertyValue('--rowBottom'));
    function move(ev){
      const dy=ev.clientY-startY, dPct=dy/total*100;
      const nTop=Math.max(5, Math.min(90, top+dPct)), nBottom=Math.max(5, Math.min(90, bottom-dPct));
      if(nTop+nBottom<=100) setRow(nTop,nBottom);
      window.dispatchEvent(new Event('resize'));
    }
    function up(){
      document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);
      const l=loadLayout(); l.rowTop=getComputedStyle(center).getPropertyValue('--rowTop').trim(); l.rowBottom=getComputedStyle(center).getPropertyValue('--rowBottom').trim(); saveLayout(l);
    }
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
  });

  if(fr && footer) fr.addEventListener('mousedown', e=>{
    e.preventDefault();
    const startY=e.clientY, startH=footer.clientHeight;
    function move(ev){
      const dy=ev.clientY-startY, newH=Math.max(60, Math.min(400, startH-dy));
      footer.style.height=newH+'px';
      window.dispatchEvent(new Event('resize'));
    }
    function up(){
      document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);
      const l=loadLayout(); l.footer=footer.style.height; saveLayout(l);
    }
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
  });
}
async function initLayout(){
  let l = loadLayout();
  try { const me = await api('/me'); if(me.preferences && me.preferences.layout){ l = me.preferences.layout; } } catch(e){}
  applyLayout(l);
  setupResizers();
  document.getElementById('lockLayout').addEventListener('change', e=>{
    const locked=e.target.checked;
    document.body.classList.toggle('locked', locked);
    const l=loadLayout(); l.locked=locked; saveLayout(l);
  });
}

function api(path, opts={}){ return fetch(path, {...opts, credentials:'include'}).then(r=>{ if(r.status===401){ window.location.href='/login'; throw new Error('Unauthorized'); } if(!r.ok) throw new Error(`${path} ${r.status}`); return r.json(); }); }
function fmtTime(iso){ if(!iso) return '-'; const d=new Date(iso); return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function toMs(iso){ return iso ? new Date(iso).getTime() : Date.now(); }
function fmtDur(s){ const h=Math.floor(s/3600); const m=Math.floor((s%3600)/60); const sec=Math.floor(s%60); return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }
function elapsed(iso){ return (Date.now()-toMs(iso))/1000; }
function unitClass(st){
  const onScene = ['OS','AP','AD','WATER','EXT','OVER','TC','ARR','CT','BK','HEMS','DECEASED','PA','INVEST','REPORT','SEARCH','WORK_TRAFFIC','FIRE_ATTACK','EXTRICATION','NO_FIRE'];

  if(enRoute.includes(st)) return 'unit-er';
  if(st==='AQ' || st==='AFR') return 'unit-aq';
  return 'unit-oth';
}

function renderCalls(){
  if(isDragging) return;
  if(state.showClosed){ renderClosedCalls(); updateTabStyles(); return; }
  const priority = document.getElementById('cfPriority')?.value || 'all';
  const assigned = document.getElementById('cfAssigned')?.value || 'all';
  const zone = document.getElementById('cfZone')?.value || 'all';
  const search = (document.getElementById('cfSearch')?.value || '').toLowerCase();
  const active = state.incidents.filter(i=>{
    if(i.status==='closed') return false;
    if(!matchesDiscipline((state.agencyMap[i.agency_id]||{}).agency_type)) return false;
    if(priority!=='all' && String(i.priority||2)!==priority) return false;
    if(assigned==='assigned' && !state.units.some(u=>u.current_incident_id===i.id)) return false;
    if(assigned==='unassigned' && state.units.some(u=>u.current_incident_id===i.id)) return false;
    if(zone!=='all' && (i.extra?.zone_name||'')!==zone) return false;
    if(search){
      const text = `${i.call_number||''} ${i.incident_number||''} ${i.call_type||''} ${i.location_text||''} ${i.caller_name||''}`.toLowerCase();
      if(!text.includes(search)) return false;
    }
    return true;
  }).sort((a,b)=> (a.priority||2)-(b.priority||2) || new Date(b.created_at)-new Date(a.created_at));
  document.getElementById('callCount').textContent = active.length;
  const html = active.length ? `<table class='tbl'><thead><tr><th>#</th><th>Type</th><th>Pri</th><th>Pickup</th><th>Zone</th><th>Dest</th><th>Units</th><th>Age</th><th>Last Status</th></tr></thead><tbody>` + active.map(i=>{

    const assigned=state.units.filter(u=>u.current_incident_id===i.id).map(u=>`${u.call_sign}<span class='text-slate-500 text-[10px]'>(${statusLabelByType(type,u.current_status)})</span>`).join(', ')||'-'; 
    const cls = state.selectedIncident===i.id ? 'selected' : '';

    return `<tr class='priority-${Math.min(Math.max(i.priority||2,1),4)} ${cls}' onclick='selectIncident(${i.id})' ondragover='callDragOver(event,${i.id})' ondragleave='callDragLeave(event)' ondrop='callDrop(event,${i.id})'>

    </tr>`;
  }).join('') + '</tbody></table>' : `<div class='p-2 text-slate-500'>No active calls (total ${state.incidents.length}, discipline ${DISCIPLINE})<br><span class='text-slate-400 text-[10px]'>Check status/zone filters</span></div>`;
  const el = document.getElementById('callList');
  if(state.lastCallsHtml !== html){ state.lastCallsHtml = html; el.innerHTML = html; updateTimers(); }
  updateTabStyles();
}

function findFirstEvent(events, codes){ return (events||[]).filter(e=>codes.includes(e.status_code)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))[0]?.created_at || null; }
function milestoneText(iso, target, start){
  const sec = iso ? elapsed(iso) : elapsed(start);
  if(target == null) return `<span class='text-slate-400'>${fmtDur(sec)}</span>`;
  const cls = iso ? (sec>target?'text-red-400 font-bold':'text-green-400') : 'text-yellow-400';
  return `<span class='${cls}'>${fmtDur(sec)}</span> / ${fmtDur(target)}`;
}
function buildIncidentTimeline(timeline){
  const entries = [];
  (timeline.events||[]).forEach(e=>{
    entries.push({t: e.created_at, html: `<span class='font-semibold'>${statusLabel(e.status_code)}</span> ${e.reason?escapeHtml(e.reason):''}`});
  });
  (timeline.logs||[]).forEach(l=>{
    entries.push({t: l.timestamp, html: `<span class='text-blue-300'>${l.log_type==='note'?'Note':'Log'}</span>: ${escapeHtml(l.message||'')}`});
  });
  (timeline.messages||[]).forEach(m=>{
    const to = m.unit_id ? (state.units.find(u=>u.id===m.unit_id)?.call_sign || m.unit_id) : 'ALL';
    entries.push({t: m.sent_at, html: `<span class='text-emerald-300'>Msg to ${to}</span>: ${escapeHtml(m.message_text||'')}`});
  });
  entries.sort((a,b)=>new Date(b.t)-new Date(a.t));
  return entries.slice(0,15).map(e=>`<div class='text-slate-300'>${fmtTime(e.t)} ${e.html}</div>`).join('') || '<div class=\'text-slate-500\'>No events</div>';
}
function isUserInteracting(){ if(isDragging) return true; const a=document.activeElement; if(!a||a===document.body) return false; return ['INPUT','SELECT','TEXTAREA','BUTTON'].includes(a.tagName) || a.closest('#incidentPanel,#unitList,#callList')!==null; }
function savePanelForm(panelId){
  const panel=document.getElementById(panelId); if(!panel) return {};
  const state={};
  panel.querySelectorAll('input, select, textarea').forEach(el=>{
    if(el.type==='checkbox'||el.type==='radio') state[el.id]=el.checked;
    else if(el.tagName==='SELECT') state[el.id]=el.value;
    else state[el.id]=el.value;
  });
  return state;
}
function restorePanelForm(panelId, formState){
  const panel=document.getElementById(panelId); if(!panel) return;
  Object.entries(formState).forEach(([id,val])=>{
    const el=document.getElementById(id); if(!el) return;
    if(el.type==='checkbox'||el.type==='radio') el.checked=!!val;
    else if(el.tagName==='SELECT'){ el.value=val; if(!el.value&&Array.from(el.options).some(o=>o.value===val)) el.value=val; }
    else el.value=val;
  });
}

function fmtDisciplineValue(v){
  if(v===true) return 'Yes';
  if(v===false) return 'No';
  if(v==null || v==='') return '-';

}

async function loadDestination(id){
  const el = document.getElementById('destinationPanel'); if(!el) return;
  try {
    const dest = await api(`/incidents/${id}/destination`);
    state.destinations[id] = dest;
    const d = dest.destination || {};
    const n = dest.notes || {};
    const details = d.details || {};
    const notes = Object.entries(n).map(([k,v])=> v ? `<div class='text-xs text-slate-300'><span class='text-slate-400 capitalize'>${k}:</span> ${v}</div>` : '').filter(Boolean).join('');
    const detailRows = Object.entries(details).map(([k,v])=>{
      if(!v || (Array.isArray(v) && !v.length)) return '';
      const label = k.replace(/_/g,' ');
      const value = Array.isArray(v) ? v.join(', ') : v;
      return `<div class='text-xs text-slate-300'><span class='text-slate-400 capitalize'>${label}:</span> ${value}</div>`;
    }).filter(Boolean).join('');
    const status = await getDestinationStatus(d.id);

      <div class='flex items-center gap-1'><span class='text-sm font-bold text-white'>${d.name||'-'}</span>${statusBadge}</div>
      <div class='text-xs text-slate-300'>${d.address||''} ${d.category ? '('+d.category+')' : ''}</div>
      <div class='mt-1'>${notes || '<span class="text-slate-500">No notes</span>'}</div>

function incidentUnitStatusChanged(incidentId, unitId){
  const status = document.getElementById(`incUStat_${unitId}`).value;
  const u = state.units.find(x=>x.id===unitId);
  const a = state.agencyMap[u?.agency_id]||{};
  const needsDest = isTransportStatus(status);
  const needsMile = needsMileage(status) && a.agency_type === 'ems';
  const dest = document.getElementById(`incUDest_${unitId}`);
  const other = document.getElementById(`incUDestOther_${unitId}`);
  const mile = document.getElementById(`incUMile_${unitId}`);
  if(dest) dest.classList.toggle('hidden', !needsDest);
  if(other) other.classList.toggle('hidden', !(needsDest && dest && dest.value==='other'));
  if(mile) mile.classList.toggle('hidden', !needsMile);
}

function handleIncidentUnitStatusChange(incidentId, unitId){
  const s = document.getElementById(`incUStat_${unitId}`).value;
  const u = state.units.find(x=>x.id===unitId);
  const a = state.agencyMap[u?.agency_id]||{};
  const emsMile = needsMileage(s) && a.agency_type === 'ems';
  incidentUnitStatusChanged(incidentId, unitId);
  if(s && !isTransportStatus(s) && !emsMile){
    setIncidentUnitStatus(incidentId, unitId);
  }
}

async function setIncidentUnitStatus(incidentId, unitId, silent=false){
  const s = document.getElementById(`incUStat_${unitId}`).value; if(!s) return;
  const u = state.units.find(x=>x.id===unitId) || {};
  const a = state.agencyMap[u.agency_id] || {};
  const destEl = document.getElementById(`incUDest_${unitId}`);
  const otherEl = document.getElementById(`incUDestOther_${unitId}`);
  const mileEl = document.getElementById(`incUMile_${unitId}`);
  const needsDest = isTransportStatus(s);
  const needsMile = needsMileage(s) && a.agency_type === 'ems';
  const body = {status_code: s};
  const at = manualStatusTime('incUTime_'+unitId);
  if(at) body.at = at;
  if(needsDest && destEl && destEl.value){
    if(destEl.value === 'other'){
      const name = otherEl ? otherEl.value.trim() : '';
      if(!name){ if(!silent) alert('Enter destination name for Other'); return; }
      body.destination_name = name;
    } else {
      body.destination_id = parseInt(destEl.value);
    }
  }
  if(needsMile){
    if(mileEl && mileEl.value) body.mileage = parseFloat(mileEl.value);
    else { if(!silent) alert('Enter mileage for this status'); return; }
  }
  if(needsDest && !body.destination_id && !body.destination_name){ if(!silent) alert('Select or enter a destination for transport status'); return; }
  try {
    const wasClosed = (state.incidents.find(i=>i.id===incidentId)||{}).status === 'closed';
    await api(`/incidents/${incidentId}/units/${unitId}/status`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    log(`Unit ${u.call_sign} set to ${statusLabelByType(a.agency_type, s)}`);
    await load();
    const isClosed = (state.incidents.find(i=>i.id===incidentId)||{}).status === 'closed';
    if(!wasClosed && isClosed){
      offerPrintReport(incidentId);
    }
  } catch(e){ log('Status error: '+e.message); }
}

function escapeHtml(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function manualStatusTime(inputId){
  const el = document.getElementById(inputId);
  if(!el || !el.value) return undefined;
  const d = new Date(el.value);
  if(isNaN(d)) return undefined;
  return toDefaultTimezoneIso(d);
}

function renderNextClosestAvailable(incident){
  const el = document.getElementById('closest'); if(!el || !incident) return;
  const discipline = getDisciplineFromAgency(incident.agency_id);
  const agency = state.agencyMap[incident.agency_id] || {};
  const targetLat = incident.lat != null ? incident.lat : agency.lat;
  const targetLng = incident.lng != null ? incident.lng : agency.lng;
  const available = state.units.filter(u=>{
    if(!u.lat || !u.lng) return false;
    if(u.current_incident_id) return false;
    const agency = state.agencyMap[u.agency_id];
    if(!agency || agency.agency_type !== discipline) return false;
    return AVAILABLE_STATUSES.includes(u.current_status);
  }).map(u=>{
    const dist = (targetLat!=null && targetLng!=null) ? haversineMiles(u.lat, u.lng, targetLat, targetLng) : null;
    return {...u, distance_miles: dist};
  }).filter(u=>u.distance_miles!=null).sort((a,b)=>a.distance_miles-b.distance_miles).slice(0,5);
  if(!available.length){ el.innerHTML = '<div class="text-slate-500">No available units with location</div>'; return; }
  el.innerHTML = available.map((u,idx)=>`
    <div class="flex items-center justify-between gap-2 text-slate-300">
      <div class="flex items-center gap-1 min-w-0">
        <span class="font-mono w-4 opacity-60">${idx+1}</span>
        <span class="font-semibold truncate">${u.call_sign}</span>
        <span class="text-slate-500">${u.unit_type||'-'}</span>
        <span class="text-slate-400 whitespace-nowrap">${u.distance_miles.toFixed(1)} mi</span>
      </div>
      <button class="bg-blue-700 hover:bg-blue-600 px-1.5 py-0.5 rounded text-[10px] text-white" onclick="dispatchRecommended(${u.id})">Assign</button>
    </div>`).join('');
}

function updateTimers(){
  // Generic duration cells (unit board)
  document.querySelectorAll('td[data-iso]').forEach(el=>{
    if(el.dataset.timer === 'sla') return;
    const iso = el.dataset.iso;
    const acc = el.dataset.acc;
    let sec = null;
    if(acc !== undefined){
      sec = parseFloat(acc||0) + (iso ? elapsed(iso) : 0);
    } else if(iso){
      sec = elapsed(iso);
    }
    el.textContent = sec !== null ? fmtDur(sec) : (el.dataset.fallback || '-');
  });
}

function unitStatusOptions(type, agencyId, selectedCode=''){
  const cfg = (state.configs && state.configs[agencyId]) || {};
  const custom = cfg.statuses;
  const features = getAgencyFeatures(agencyId);
  const showTransport = features.transport !== false;
  let list = [];
  if(custom && custom.length){
    list = custom.map(s=>typeof s === 'string' ? {code:s, label:statusLabel(s)} : s);
  } else {
    list = UNIT_STATUS_OPTIONS[type] || UNIT_STATUS_OPTIONS.ems;
  }
  if(!showTransport){
    list = list.filter(s=>!isTransportStatus(s.code));
  }
  // Ensure EMS units always have the Arrived at Destination option
  if((type==='ems' || !UNIT_STATUS_OPTIONS[type]) && !list.find(s=>s.code==='AD')){
    list.push({code:'AD', label:'Arrived at Destination'});
  }
  return `<option value=''>Set...</option>` + list.map(s=>`<option value='${s.code}' ${s.code===selectedCode?'selected':''}>${s.label}</option>`).join('');
}
function unitStatusChanged(unitId){
  const s = document.getElementById('uStat_'+unitId).value;
  const u = state.units.find(x=>x.id===unitId);
  const a = state.agencyMap[u?.agency_id]||{};
  const needsDest = isTransportStatus(s);
  const needsMile = needsMileage(s) && a.agency_type === 'ems';
  const dest = document.getElementById('uDest_'+unitId);
  const other = document.getElementById('uDestOther_'+unitId);
  const mile = document.getElementById('uMile_'+unitId);
  if(dest) dest.classList.toggle('hidden', !needsDest);
  if(other) other.classList.toggle('hidden', !(needsDest && dest && dest.value==='other'));
  if(mile) mile.classList.toggle('hidden', !needsMile);
}
window.setUnitStatus = async function(unitId){
  const s = document.getElementById('uStat_'+unitId).value; if(!s) return;
  const u=state.units.find(x=>x.id===unitId);
  const a=state.agencyMap[u.agency_id]||{};
  const inc=state.incidents.find(i=>i.id===u.current_incident_id);
  const path=inc ? `/incidents/${inc.id}/units/${unitId}/status` : `/units/${unitId}/status`;
  const needsDest = isTransportStatus(s);
  const needsMile = needsMileage(s) && a.agency_type === 'ems';
  const body = {status_code: s};
  const at = manualStatusTime('uTime_'+unitId);
  if(at) body.at = at;
  if(needsDest){
    const destEl = document.getElementById('uDest_'+unitId);
    const otherEl = document.getElementById('uDestOther_'+unitId);
    if(destEl && destEl.value){
      if(destEl.value === 'other'){
        const name = otherEl ? otherEl.value.trim() : '';
        if(!name){ alert('Enter destination name'); return; }
        body.destination_name = name;
      } else {
        body.destination_id = parseInt(destEl.value);
      }
    }
    if(!body.destination_id && !body.destination_name){
      if(a.agency_type === 'police'){ if(!confirm('No destination selected. Continue without destination?')) return; }
      else { alert('Select a destination for transport'); return; }
    }
  }
  if(needsMile){
    const mileEl = document.getElementById('uMile_'+unitId);
    if(mileEl && mileEl.value) body.mileage = parseFloat(mileEl.value);
    else { alert('Enter mileage for this status'); return; }
  }
  try {
    const wasClosed = inc ? inc.status === 'closed' : false;
    await api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    log(`Unit ${u.call_sign} set to ${statusLabelByType(a.agency_type, s)}`);
    await load();
    const nowClosed = inc ? (state.incidents.find(i=>i.id===inc.id)||{}).status === 'closed' : false;
    if(inc && !wasClosed && nowClosed){
      offerPrintReport(inc.id);
    }
  } catch(e){ log('Status error: '+e.message); }
};

async function selectUnit(id){ state.selectedUnit=id; await loadTrails(id); renderUnits(); renderMap(); }

async function loadTrails(unitId){
  if(!unitId){ state.trails[unitId]=[]; return; }
  try {
    const pts = await api(`/taip/positions?unit_id=${unitId}&limit=50`);
    state.trails[unitId] = pts.reverse().filter(p=>p.lat!=null && p.lng!=null);
  } catch(e){ state.trails[unitId]=[]; }
}

function renderMap(){
  if(!map) initMap();
  if(!state.mapMarkers) state.mapMarkers = {units:{}, incidents:{}, critical:{}, serviceAreas:[]};
  if(!state.mapFitDone) state.mapFitDone = false;
  let bounds=L.latLngBounds([]);
  const selectedIncident=state.selectedIncident;
  const a=state.incidents.find(i=>i.id===selectedIncident);
  // Service areas - draw once and keep
  if(!state.mapMarkers.serviceAreas.length){
    (state.postZones || []).forEach(z=>{
      if(!z.geojson) return;
      try{
        const c = z.color || serviceAreaColor(z.zone_type);
        const gj = L.geoJSON(z.geojson, {style:{color:c, fillColor:c, fillOpacity:0.1, weight:2}}).addTo(layers.serviceAreas);
        gj.bindPopup(`<b>${z.name}</b><br>${z.zone_type}`);
        if(gj.getBounds && gj.getBounds().isValid()) bounds.extend(gj.getBounds());
      }catch(e){}
    });
  }
  function unitColor(u){
    if(u.offline) return '#334155';
    if(u.stale) return '#f97316';
    return u.current_status==='OS' ? '#ef4444' : u.current_status==='AQ' ? '#22c55e' : '#eab308';
  }
  // Update or create unit markers without clearing the whole layer
  if(!state.mapMarkers.units) state.mapMarkers.units={};
  const seenUnitIds=new Set();
  state.units.forEach(u=>{
    if(u.lat==null || u.lng==null) return;
    seenUnitIds.add(u.id);
    const col=unitColor(u);
    const last=u.last_seen_at?new Date(u.last_seen_at).toLocaleTimeString():'unknown';
    const stateLabel=u.offline?'Offline':u.stale?'Stale':statusLabel(u.current_status);
    const content=`<b>${u.call_sign}</b><br>${stateLabel}<br><span class='text-slate-400'>Last seen: ${last}</span><br>${u.speed!=null?u.speed+' mph • ':''}${u.heading!=null?u.heading+'°<br>':''}${state.agencyMap[u.agency_id]?.name||''}`;
    let m=state.mapMarkers.units[u.id];
    if(m){
      m.setLatLng([u.lat,u.lng]);
      m.setStyle({color:col, fillColor:col, fillOpacity:0.9, weight:2});
      m.setPopupContent(content);
    } else {
      m=L.circleMarker([u.lat,u.lng],{radius:6,color:col,fillColor:col,fillOpacity:0.9,weight:2}).addTo(layers.units);
      m.bindPopup(content);
      state.mapMarkers.units[u.id]=m;
    }
    if(state.selectedUnit===u.id){ m.openPopup(); } else { m.closePopup(); }
    bounds.extend([u.lat,u.lng]);
  });
  // Remove unit markers that are no longer present
  Object.keys(state.mapMarkers.units).forEach(kid=>{
    const id=parseInt(kid);
    if(!seenUnitIds.has(id)){
      layers.units.removeLayer(state.mapMarkers.units[id]);
      delete state.mapMarkers.units[id];
    }
  });
  // Update or create incident markers without clearing the whole layer
  if(!state.mapMarkers.incidents) state.mapMarkers.incidents={};
  const seenIncIds=new Set();
  state.incidents.forEach(i=>{
    const ag = state.agencyMap[i.agency_id]||{};
    const lat = i.lat!=null ? i.lat : (i.id===selectedIncident ? ag.lat : null);
    const lng = i.lng!=null ? i.lng : (i.id===selectedIncident ? ag.lng : null);
    if(lat==null || lng==null) return;
    seenIncIds.add(i.id);
    const col = i.status==='closed' ? '#64748b' : i.priority===1 ? '#ef4444' : i.priority===2 ? '#f97316' : '#eab308';
    const isSel = i.id===selectedIncident;
    const content=`<b>${i.call_number||i.incident_number}</b><br>${i.call_type}<br>${i.location_text||''}${(i.lat==null)?'<br><span class="text-slate-400">(agency location)</span>':''}`;
    let m=state.mapMarkers.incidents[i.id];
    if(m){
      m.setLatLng([lat,lng]);
      m.setStyle({color:col, fillColor:col, fillOpacity:isSel?0.9:0.6, radius:isSel?12:8, weight:2});
      m.setPopupContent(content);
    } else {
      m=L.circleMarker([lat,lng],{radius:isSel?12:8,color:col,fillColor:col,fillOpacity:isSel?0.9:0.6,weight:2}).addTo(layers.incidents);
      m.bindPopup(content);
      state.mapMarkers.incidents[i.id]=m;
    }
    if(isSel){ m.openPopup(); } else { m.closePopup(); }
    bounds.extend([lat,lng]);
  });
  // Remove incident markers that are no longer present
  Object.keys(state.mapMarkers.incidents).forEach(kid=>{
    const id=parseInt(kid);
    if(!seenIncIds.has(id)){
      layers.incidents.removeLayer(state.mapMarkers.incidents[id]);
      delete state.mapMarkers.incidents[id];
    }
  });
  // Trails - clear and redraw because the polyline is cheap to recreate
  layers.trails.clearLayers();
  if(state.showTrails && state.selectedUnit && state.trails[state.selectedUnit] && state.trails[state.selectedUnit].length){
    const pts = state.trails[state.selectedUnit].map(p=>[p.lat,p.lng]);
    L.polyline(pts,{color:'#3b82f6', opacity:0.7, weight:2}).addTo(layers.trails);
    pts.forEach(p=>bounds.extend(p));
    const last = pts[pts.length-1];
    L.circleMarker(last,{radius:4, color:'#3b82f6', fillColor:'#3b82f6', fillOpacity:1}).addTo(layers.trails);
  }
  // Critical layers - clear and redraw on each render to honor toggle
  layers.critical.clearLayers();
  if(state.showCritical){
    state.mapLayers.filter(c=>c.lat!=null && c.lng!=null).forEach(c=>{
      const col = c.type==='hydrant' ? '#0ea5e9' : c.type==='hospital' ? '#ef4444' : '#22c55e';
      const m = L.circleMarker([c.lat,c.lng],{radius:4, color:col, fillColor:col, fillOpacity:0.8, weight:1}).addTo(layers.critical);
      m.bindPopup(`<b>${c.name}</b><br>${c.type}`);
      bounds.extend([c.lat,c.lng]);
    });
  }
  // Fit bounds only on the first render (initial load)
  if(!state.mapFitDone){
    if(bounds.isValid()){
      map.fitBounds(bounds,{padding:[20,20],maxZoom:16});
    } else if(a && a.lat!=null && a.lng!=null){
      map.setView([a.lat,a.lng], 14);
    } else {
      // Fall back to primary/secondary service area if defined
      let zoneBounds = L.latLngBounds([]);
      (state.postZones || []).forEach(z=>{
        if(!z.geojson) return;
        try{
          const gl = L.geoJSON(z.geojson);
          if(gl.getBounds && gl.getBounds().isValid()) zoneBounds.extend(gl.getBounds());
        }catch(e){}
      });
      if(zoneBounds.isValid()){
        map.fitBounds(zoneBounds,{padding:[20,20],maxZoom:14});
      } else {
        const am = state.agencies.find(ag=>ag.id===state.units[0]?.agency_id) || state.agencies[0];
        if(am && am.lat!=null && am.lng!=null) map.setView([am.lat,am.lng], 11);
        else map.setView(DEFAULT_CENTER, 11);
      }
    }
    state.mapFitDone = true;
  }
}

async function sendMessage(){
  const sel = document.getElementById('msgUnit');
  const inp = document.getElementById('msgText');
  const text = inp.value.trim(); if(!text) return;
  const body = {message_text:text, channel:'mdt'};
  if(sel.value) body.unit_id = parseInt(sel.value);
  try { await api('/messages', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}); inp.value=''; await load(); } catch(e){ log('Message error: '+e.message); }
}

async function loadConfigs(){
  try {
    const cfg = await api('/config');
    const out = {};
    cfg.forEach(c=>{
      if(!out[c.agency_id]) out[c.agency_id] = {};
      out[c.agency_id][c.category] = c.value;
    });
    return out;
  } catch(e){ return {}; }
}

async function load(){
  try {
    const [agencies, units, incidents, messages, configs, postZones, personnel, _dests] = await Promise.all([api('/agencies'), api('/units'), api('/incidents'), api('/messages'), loadConfigs(), api('/post-zones'), api('/personnel'), loadAllDestinations()]);
    state.agencies = agencies; state.units = units; state.incidents = incidents; state.messages = messages; state.configs = configs; state.postZones = postZones; state.personnel = personnel;
    state.agencyMap = {}; state.agencies.forEach(a=>state.agencyMap[a.id]=a);
    const mapConfig = await api('/config?category=map_layers');
    const ml = mapConfig.find(c=>c.category==='map_layers' && c.key==='all')?.value || [];
    state.mapLayers = Array.isArray(ml) ? ml : [];
    const dsel = document.getElementById('disciplineSelect');
    if(dsel){
      const types = [...new Set(state.agencies.map(a=>a.agency_type).filter(Boolean))];
      const allowed = ['police','fire','ems'];
      const present = types.length ? types.filter(t=>allowed.includes(t)) : allowed;
      dsel.innerHTML = (present.length>1 ? `<option value='all'>All Disciplines</option>` : '') + present.map(t=>`<option value='${t}'>${t.charAt(0).toUpperCase()+t.slice(1)}</option>`).join('');
      if(present.length===1 && DISCIPLINE==='all') DISCIPLINE = present[0];
      dsel.value = DISCIPLINE;
      if(present.length<=1) dsel.classList.add('hidden');
      else dsel.classList.remove('hidden');
      updateBrand();
    } else {
      updateBrand();
    }
    const lbl = document.getElementById('consoleLabel'); if(lbl) lbl.textContent = DISCIPLINE==='all' ? 'Console' : DISCIPLINE.toUpperCase()+' Console';
    const sel = document.getElementById('msgUnit');
    if(sel.options.length<=1){ state.units.forEach(u=>{ sel.innerHTML += `<option value='${u.id}'>${u.call_sign}</option>`; }); }
    renderCallFilters(); renderCalls(); renderUnits(); renderMap(); renderMessages();
    if(state.selectedIncident){ selectIncident(state.selectedIncident); }
    await loadAlerts();
  } catch(e){ log('Load error: '+e.message); const el=document.getElementById('callList'); if(el) el.innerHTML = '<div class="p-2 text-red-400">Load error: '+(e.message||e)+'</div>'; const ul=document.getElementById('unitList'); if(ul) ul.innerHTML = '<div class="p-2 text-red-400">Load error: '+(e.message||e)+'</div>'; }
}

function updateClock(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }

document.getElementById('refreshBtn').addEventListener('click', load);
document.getElementById('msgSend').addEventListener('click', sendMessage);
document.getElementById('msgText').addEventListener('keydown', e=>{ if(e.key==='Enter') sendMessage(); });
document.getElementById('disciplineSelect').addEventListener('change', e=>{ DISCIPLINE = e.target.value; updateBrand(); renderCalls(); renderUnits(); renderMap(); });
document.getElementById('trailToggle').addEventListener('change', e=>{ state.showTrails = e.target.checked; renderMap(); });
document.getElementById('critToggle').addEventListener('change', e=>{ state.showCritical = e.target.checked; renderMap(); });

async function loadAlerts(){
  const btn = document.getElementById('alertsBtn'); const badge = document.getElementById('alertsCount');
  if(!btn || !badge) return;
  try {
    const alerts = await api('/incidents/alerts');
    state.alerts = alerts || [];
    if(state.alerts.length){ badge.textContent = state.alerts.length; btn.classList.remove('hidden'); }
    else { btn.classList.add('hidden'); }
  } catch(e){ btn.classList.add('hidden'); }
}
window.showAlerts = function(){
  if(!state.alerts || !state.alerts.length) return;
  state.alerts.forEach(a=>{
    log(`ALERT ${a.call_number||a.incident_id}: ${a.alerts.join('; ')}`);
  });
}

function startStream(){
  if(!window.EventSource) return;
  const es = new EventSource('/taip/stream', {withCredentials:true});
  es.onmessage = e => {
    const positions = JSON.parse(e.data);
    positions.forEach(p => { const u=state.units.find(x=>x.id===p.id); if(u){ u.lat=p.lat; u.lng=p.lng; u.heading=p.heading; u.speed=p.speed; u.last_seen_at=p.last_seen_at; u.current_status=p.current_status; u.stale=p.stale; u.offline=p.offline; } });
    renderMap(); renderUnits();
  };
  es.onerror = () => { es.close(); setTimeout(startStream, 5000); };
}

(async function(){
  await initLayout();
  initMap();
  await load();
  startStream();
  updateClock(); setInterval(updateClock,1000);
  try {
    const me = await api('/me');
    const adminLink = document.getElementById('adminLink');
    if(adminLink && (me.role==='admin' || me.role==='super_admin')) adminLink.classList.remove('hidden');
  } catch(e){}
  window.addEventListener('resize', ()=>{ if(map) map.invalidateSize(); });
  setInterval(()=>{ if(document.getElementById('liveToggle').checked && !isUserInteracting()) load(); },10000);
  setInterval(updateTimers,1000);
})();

function attachIncidentPanelDrops(){
  const incidentPanel = document.getElementById('incidentPanel');
  if(!incidentPanel) return;
  let dropCount = 0;
  incidentPanel.addEventListener('dragenter', e=>{
    e.preventDefault();
    if(++dropCount === 1) incidentPanel.classList.add('drop-target');
  });
  incidentPanel.addEventListener('dragleave', e=>{
    if(--dropCount <= 0){ dropCount = 0; incidentPanel.classList.remove('drop-target'); }
  });
  incidentPanel.addEventListener('dragover', e=>{
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  });
  incidentPanel.addEventListener('drop', async e=>{
    e.preventDefault();
    dropCount = 0;
    incidentPanel.classList.remove('drop-target');
    const unitId = e.dataTransfer.getData('text/plain');
    const incidentId = state.selectedIncident;
    if(!unitId || !incidentId) return;
    log(`Panel drop: unit ${unitId} on incident ${incidentId}`);
    try {
      await api(`/incidents/${incidentId}/dispatch/${unitId}?reassign=1`, {method:'POST'});
      log(`Dispatched unit to call ${incidentId}`);
      await selectIncident(incidentId);
      await load();
    } catch(err){ log('Panel dispatch error: '+err.message); }
  });
}
</script>
