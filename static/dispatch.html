<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>D2D Console</title>
<script src='https://cdn.tailwindcss.com'></script>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' crossorigin=''>
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js' crossorigin=''></script>
<style>
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; overflow:hidden; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .priority-1 { background:rgba(239,68,68,0.18); border-left:5px solid #ef4444; }
  .priority-2 { background:rgba(249,115,22,0.18); border-left:5px solid #f97316; }
  .priority-3 { background:rgba(234,179,8,0.18); border-left:5px solid #eab308; }
  .priority-4 { background:rgba(34,197,94,0.18); border-left:5px solid #22c55e; }
  .unit-os { background:rgba(239,68,68,0.18); border-left:5px solid #ef4444; }
  .unit-er { background:rgba(234,179,8,0.18); border-left:5px solid #eab308; }
  .unit-aq { background:rgba(34,197,94,0.18); border-left:5px solid #22c55e; }
  .unit-oth { background:rgba(100,116,139,0.18); border-left:5px solid #64748b; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:0.25rem; overflow:hidden; display:flex; flex-direction:column; }
  .card-head { background:#0f172a; padding:0.25rem 0.5rem; font-weight:600; border-bottom:1px solid #334155; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.03em; }
  .card-body { padding:0.25rem; overflow:auto; flex:1; }
  .tbl { width:100%; border-collapse:collapse; font-size:0.7rem; }
  .tbl th { background:#0f172a; padding:0.2rem 0.35rem; text-align:left; text-transform:uppercase; font-size:0.6rem; color:#94a3b8; }
  .tbl td { padding:0.25rem 0.35rem; border-bottom:1px solid #334155; vertical-align:top; }
  .tbl tr { cursor:pointer; }
  .tbl tr:hover { background:rgba(255,255,255,0.05); }
  .timer { font-variant-numeric:tabular-nums; }
  .selected { outline:2px solid #3b82f6; }
  #map { width:100%; height:100%; background:#0f172a; }
  .legend { background:rgba(15,23,42,0.9); color:#e2e8f0; padding:0.5rem; border-radius:0.375rem; border:1px solid #334155; font-size:0.7rem; }
  .legend .dot { display:inline-block; width:0.6rem; height:0.6rem; border-radius:50%; margin-right:0.3rem; }
  .resizer { width:4px; background:#475569; cursor:col-resize; transition:background 0.1s; }
  .resizer:hover { background:#3b82f6; }
  .resizer-h { height:4px; background:#475569; cursor:row-resize; transition:background 0.1s; }
  .resizer-h:hover { background:#3b82f6; }
  .locked .resizer, .locked .resizer-h { display:none; }
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track { background:#0f172a; }
  ::-webkit-scrollbar-thumb { background:#475569; border-radius:3px; }
</style>
</head>
<body class='bg-slate-900 text-slate-200 text-xs h-screen flex flex-col'>
  <header class='h-12 bg-slate-950 border-b border-slate-700 flex items-center px-2 gap-2 shrink-0'>
    <div class='font-bold text-lg tracking-wide text-white'>D2D <span class='text-slate-500 font-normal text-xs'><span id='consoleLabel'>Console</span></span></div>
    <select id='disciplineSelect' class='bg-slate-800 border border-slate-600 rounded px-1 py-1 text-xs'><option value='all'>All Disciplines</option><option value='police'>Police</option><option value='fire'>Fire</option><option value='ems'>EMS</option></select>
    <div class='text-slate-400 font-mono' id='clock'>--:--:--</div>
    <label class='flex items-center space-x-1'><input id='liveToggle' type='checkbox' checked class='accent-blue-500'> <span>Live</span></label>
    <label class='flex items-center space-x-1 text-slate-300'><input id='lockLayout' type='checkbox' class='accent-pink-500'> <span>Lock</span></label>
    <button id='refreshBtn' class='bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded'>Refresh</button>
    <a id='dashLink' href='/' class='bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-white hidden'>Dash</a>
    <a href='/call-entry' class='bg-green-700 hover:bg-green-600 px-2 py-1 rounded text-white'>Call Entry</a>
    <a href='/mdt?unit_id=1' target='_blank' class='bg-purple-700 hover:bg-purple-600 px-2 py-1 rounded text-white'>MDT</a>
    <a href='/avl' target='_blank' class='bg-cyan-700 hover:bg-cyan-600 px-2 py-1 rounded text-white'>AVL</a>
  </header>
  <main id='main' class='flex-1 grid p-1 overflow-hidden' style='grid-template-columns:var(--col1,25%) 4px var(--col2,45%) 4px var(--col3,30%);'>
    <aside class='flex flex-col gap-1 min-h-0'>
      <div class='card flex-1 min-h-0'>
        <div class='card-head flex justify-between'><span>Active Calls</span><span id='callCount' class='text-slate-400'>0</span></div>
        <div id='callList' class='card-body'></div>
      </div>
    </aside>
    <div id='resizer1' class='resizer'></div>
    <section id='center' class='flex flex-col gap-1 min-h-0' style='grid-template-rows:var(--rowTop,55%) 4px var(--rowBottom,45%); display:grid;'>
      <div id='incidentPanel' class='card min-h-0 overflow-auto'>
        <div class='card-head'>Incident Workspace</div>
        <div class='p-2 text-slate-400'>Select a call from the left.</div>
      </div>
      <div id='resizerV' class='resizer-h'></div>
      <div class='card min-h-0'>
        <div class='card-head flex justify-between items-center'>
          <span>Map</span>
          <div class='flex gap-3 text-xs'>
            <label class='flex items-center gap-1 cursor-pointer'><input id='trailToggle' type='checkbox' checked class='accent-blue-500'> Trails</label>
            <label class='flex items-center gap-1 cursor-pointer'><input id='critToggle' type='checkbox' class='accent-red-500'> Critical</label>
          </div>
        </div>
        <div class='card-body p-0'><div id='map'></div></div>
      </div>
    </section>
    <div id='resizer2' class='resizer'></div>
    <aside class='flex flex-col gap-1 min-h-0'>
      <div class='card flex-1 min-h-0'>
        <div class='card-head flex justify-between'><span>Unit Board</span><span id='unitCount' class='text-slate-400'>0</span></div>
        <div id='unitList' class='card-body'></div>
      </div>
    </aside>
  </main>
  <div id='footerResizer' class='resizer-h'></div>
  <footer id='footer' class='shrink-0 p-1 flex gap-1 min-h-0' style='height:var(--footer-h,9rem);'>
    <div class='card w-1/2'>
      <div class='card-head'>Event Log</div>
      <div id='eventLog' class='card-body log font-mono text-slate-300 space-y-0.5'></div>
    </div>
    <div class='card w-1/2 flex flex-col'>
      <div class='card-head'>Messages</div>
      <div id='msgList' class='card-body log text-slate-300 space-y-0.5'></div>
      <div class='flex p-1 gap-1 border-t border-slate-700'>
        <select id='msgUnit' class='bg-slate-800 border border-slate-600 rounded px-1 text-xs'><option value=''>All</option></select>
        <input id='msgText' type='text' class='flex-1 bg-slate-800 border border-slate-600 rounded px-2 text-xs' placeholder='Message...'>
        <button id='msgSend' class='bg-blue-700 hover:bg-blue-600 px-2 rounded'>Send</button>
      </div>
    </div>
  </footer>
<script>
const DEFAULT_CENTER = [39.9612,-82.9988];
let state = { agencies:[], units:[], incidents:[], messages:[], personnel:[], agencyMap:{}, configs:{}, postZones:[], selectedIncident:null, selectedUnit:null, logs:[], trails:{}, showTrails:true, showCritical:false, mapLayers:[], destinations:{}, lastCallsHtml:null, lastUnitsHtml:null };
const QUICK_STAMPS = {
  police: ['Shots Fired','Object Thrown','Taser Deployed','Suspect in Custody','Officer Needs Assistance','Code 4','Suspect Fleeing'],
  fire: ['Entry Made','Smoke Showing','Fire Knocked Down','Primary Search Complete','Secondary Search Complete','Ventilation Complete','Water on Fire','All Clear'],
  ems: ['Patient Violent','Law Enforcement Needed','CPR in Progress','AED Applied','Medic on Scene','Transporting','Arrived at Hospital']
};
function getDisciplineFromAgency(agencyId){ return (state.agencyMap[agencyId]||{}).agency_type || 'fire'; }
function getAgencyFeatures(agencyId){
  const cfg = state.configs[agencyId] || {};
  return Object.assign({transport:true, mileage:false, personnel:true, fire_report:true}, cfg.features || {});
}
function getResponseGoals(agencyId){
  const cfg = state.configs[agencyId] || {};
  return Object.assign({dispatch_seconds:60, en_route_seconds:120, on_scene_city_seconds:480, on_scene_county_seconds:1800}, cfg.response_goals || {});
}
const pathDisc = window.location.pathname.replace(/^\/|\/$/g,'');
let DISCIPLINE = ['police','fire','ems'].includes(pathDisc) ? pathDisc : (new URLSearchParams(window.location.search).get('discipline') || 'all');
let map, layers;
const LAYOUT_KEY='d2d_dispatch_layout';

function loadLayout(){
  try{ const raw=localStorage.getItem(LAYOUT_KEY); if(raw){ const l=JSON.parse(raw); applyLayout(l); return l; } }catch(e){}
  return {col1:'25%',col2:'45%',col3:'30%',rowTop:'55%',rowBottom:'45%',footer:'9rem',locked:false};
}
function saveLayout(l){
  localStorage.setItem(LAYOUT_KEY, JSON.stringify(l));
}
function applyLayout(l){
  const main=document.getElementById('main');
  const center=document.getElementById('center');
  const footer=document.getElementById('footer');
  if(main){ main.style.setProperty('--col1', l.col1); main.style.setProperty('--col2', l.col2); main.style.setProperty('--col3', l.col3); }
  if(center){ center.style.setProperty('--rowTop', l.rowTop); center.style.setProperty('--rowBottom', l.rowBottom); }
  if(footer){ footer.style.height = l.footer; }
  document.body.classList.toggle('locked', !!l.locked);
  const cb=document.getElementById('lockLayout'); if(cb) cb.checked=!!l.locked;
}
function setupResizers(){
  const main=document.getElementById('main'), center=document.getElementById('center'), footer=document.getElementById('footer');
  const r1=document.getElementById('resizer1'), r2=document.getElementById('resizer2'), rv=document.getElementById('resizerV'), fr=document.getElementById('footerResizer');

  function pct(v){ return parseFloat(v); }
  function setCol(idx, v){ main.style.setProperty('--col'+idx, v+'%'); }
  function setRow(top, bottom){ center.style.setProperty('--rowTop', top+'%'); center.style.setProperty('--rowBottom', bottom+'%'); }

  function hResize(idx, e){
    e.preventDefault();
    const startX=e.clientX, total=main.clientWidth-8;
    const c1=pct(getComputedStyle(main).getPropertyValue('--col1')), c2=pct(getComputedStyle(main).getPropertyValue('--col2')), c3=pct(getComputedStyle(main).getPropertyValue('--col3'));
    function move(ev){
      const dx=ev.clientX-startX, dPct=dx/total*100;
      if(idx===1){
        const n1=Math.max(10, Math.min(80, c1+dPct)), n2=Math.max(10, Math.min(80, c2-dPct));
        if(n1+n2<95){ setCol(1,n1); setCol(2,n2); }
      } else {
        const n2=Math.max(10, Math.min(80, c2+dPct)), n3=Math.max(10, Math.min(80, c3-dPct));
        if(n2+n3<95){ setCol(2,n2); setCol(3,n3); }
      }
      window.dispatchEvent(new Event('resize'));
    }
    function up(){
      document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);
      const l=loadLayout(); ['col1','col2','col3'].forEach((k,i)=>l[k]=getComputedStyle(main).getPropertyValue('--col'+(i+1)).trim()); saveLayout(l);
    }
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
  }
  if(r1) r1.addEventListener('mousedown', e=>hResize(1,e));
  if(r2) r2.addEventListener('mousedown', e=>hResize(2,e));

  if(rv) rv.addEventListener('mousedown', e=>{
    e.preventDefault();
    const startY=e.clientY, total=center.clientHeight-4;
    const top=pct(getComputedStyle(center).getPropertyValue('--rowTop')), bottom=pct(getComputedStyle(center).getPropertyValue('--rowBottom'));
    function move(ev){
      const dy=ev.clientY-startY, dPct=dy/total*100;
      const nTop=Math.max(5, Math.min(90, top+dPct)), nBottom=Math.max(5, Math.min(90, bottom-dPct));
      if(nTop+nBottom<=100) setRow(nTop,nBottom);
      window.dispatchEvent(new Event('resize'));
    }
    function up(){
      document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);
      const l=loadLayout(); l.rowTop=getComputedStyle(center).getPropertyValue('--rowTop').trim(); l.rowBottom=getComputedStyle(center).getPropertyValue('--rowBottom').trim(); saveLayout(l);
    }
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
  });

  if(fr && footer) fr.addEventListener('mousedown', e=>{
    e.preventDefault();
    const startY=e.clientY, startH=footer.clientHeight;
    function move(ev){
      const dy=ev.clientY-startY, newH=Math.max(60, Math.min(400, startH-dy));
      footer.style.height=newH+'px';
      window.dispatchEvent(new Event('resize'));
    }
    function up(){
      document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);
      const l=loadLayout(); l.footer=footer.style.height; saveLayout(l);
    }
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
  });
}
function initLayout(){
  const l=loadLayout();
  applyLayout(l);
  setupResizers();
  document.getElementById('lockLayout').addEventListener('change', e=>{
    const locked=e.target.checked;
    document.body.classList.toggle('locked', locked);
    const l=loadLayout(); l.locked=locked; saveLayout(l);
  });
}

function api(path, opts={}){ return fetch(path, {...opts, credentials:'include'}).then(r=>{ if(r.status===401){ window.location.href='/login'; throw new Error('Unauthorized'); } if(!r.ok) throw new Error(`${path} ${r.status}`); return r.json(); }); }
function fmtTime(iso){ if(!iso) return '-'; const d=new Date(iso); return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function toMs(iso){ return iso ? new Date(iso).getTime() : Date.now(); }
function fmtDur(s){ const h=Math.floor(s/3600); const m=Math.floor((s%3600)/60); const sec=Math.floor(s%60); return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }
function elapsed(iso){ return (Date.now()-toMs(iso))/1000; }
function priorityTarget(p){ return {1:180,2:420,3:720,4:1200}[Math.min(Math.max(p||2,1),4)] || 420; }
function slaClass(sec,target){ return sec>target ? 'text-red-400 font-bold' : 'text-slate-400'; }
function unitClass(st){ if(st==='OS') return 'unit-os'; if(st==='ER'||st==='TR'||st==='DEL') return 'unit-er'; if(st==='AQ') return 'unit-aq'; return 'unit-oth'; }
function statusLabel(code){ const M={AQ:'Available',OS:'On Scene',ER:'En Route',TR:'Transport',ED:'En Route to Destination',CAN:'Cancelled',NPF:'No Patient Found',DEL:'Delivered',AFR:'Available for Response',LUN:'Lunch',OOS:'Out of Service',MAINT:'Maintenance',AK:'Dispatched',dispatched:'Dispatched',open:'Open',closed:'Closed',cleared:'Cleared',en_route:'En Route',on_scene:'On Scene',TC:'Traffic Control',CT:'Citation',ARR:'Arrest',BK:'Booking',WATER:'Water on Fire',EXT:'Extinguished',OVER:'Overhaul'}; return M[code]||code; }
function serviceAreaColor(type){ if(type==='primary') return '#22c55e'; if(type==='secondary') return '#3b82f6'; if(type==='mutual') return '#eab308'; return '#64748b'; }
function matchesDiscipline(t){ return DISCIPLINE==='all' || t===DISCIPLINE; }
function log(msg){ state.logs.unshift(`${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})} ${msg}`); if(state.logs.length>100) state.logs.pop(); renderLog(); }

function initMap(){
  map = L.map('map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{ attribution:'&copy; OpenStreetMap' }).addTo(map);
  layers = { units:L.layerGroup().addTo(map), incidents:L.layerGroup().addTo(map), trails:L.layerGroup().addTo(map), critical:L.layerGroup().addTo(map), serviceAreas:L.layerGroup().addTo(map) };
  const legend = L.control({position:'bottomright'});
  legend.onAdd = function(){
    const d = L.DomUtil.create('div','legend');
    d.innerHTML = `
      <div class='font-bold mb-1'>Units</div>
      <div class='mb-0.5'><span class='dot' style='background:#ef4444'></span>On Scene</div>
      <div class='mb-0.5'><span class='dot' style='background:#22c55e'></span>Available</div>
      <div class='mb-0.5'><span class='dot' style='background:#eab308'></span>En Route / Transport</div>
      <div class='mb-1'><span class='dot' style='background:#64748b'></span>Other</div>
      <div class='font-bold mb-1 border-t border-slate-600 pt-1 mt-1'>Incidents</div>
      <div class='mb-0.5'><span class='dot' style='background:#ef4444'></span>P1 Emergency</div>
      <div class='mb-0.5'><span class='dot' style='background:#f97316'></span>P2 Urgent</div>
      <div class='mb-0.5'><span class='dot' style='background:#eab308'></span>P3</div>
      <div class='mb-0.5'><span class='dot' style='background:#22c55e'></span>P4 Low</div>
      <div class='mb-0.5'><span class='dot' style='background:#64748b'></span>Closed</div>
      <div class='font-bold mb-1 border-t border-slate-600 pt-1 mt-1'>Coverage</div>
      <div class='mb-0.5'><span class='dot' style='background:#22c55e'></span>Primary</div>
      <div class='mb-0.5'><span class='dot' style='background:#3b82f6'></span>Secondary</div>
      <div class='mb-0.5'><span class='dot' style='background:#eab308'></span>Mutual Aid</div>`;
    return d;
  };
  legend.addTo(map);
}

function renderLog(){ const el=document.getElementById('eventLog'); el.innerHTML = state.logs.map(l=>`<div class='border-l-2 border-slate-600 pl-1'>${l}</div>`).join(''); el.scrollTop=0; }

function renderCalls(){
  const active = state.incidents.filter(i=>i.status!=='closed' && matchesDiscipline((state.agencyMap[i.agency_id]||{}).agency_type)).sort((a,b)=> (a.priority||2)-(b.priority||2) || new Date(b.created_at)-new Date(a.created_at));
  document.getElementById('callCount').textContent = active.length;
  const html = active.length ? `<table class='tbl'><thead><tr><th>#</th><th>Type</th><th>Pri</th><th>Status</th><th>Loc</th><th>Units</th><th>SLA</th></tr></thead><tbody>` + active.map(i=>{
    const a=state.agencyMap[i.agency_id]||{};
    const target=priorityTarget(i.priority);
    const assigned=state.units.filter(u=>u.current_incident_id===i.id).map(u=>u.call_sign).join(', ')||'-'; 
    const cls = state.selectedIncident===i.id ? 'selected' : '';
    return `<tr class='priority-${Math.min(Math.max(i.priority||2,1),4)} ${cls}' onclick='selectIncident(${i.id})'>
      <td class='font-bold'>${i.call_number||i.incident_number}</td>
      <td>${i.call_type}</td>
      <td class='text-center'>P${i.priority}</td>
      <td>${statusLabel(i.status)}</td>
      <td>${i.location_text||'-'}</td>
      <td>${assigned}</td>
      <td class='timer' data-timer='sla' data-iso='${i.created_at}' data-target='${target}'>--:--:--</td>
    </tr>`;
  }).join('') + '</tbody></table>' : '<div class=\'p-2 text-slate-500\'>No active calls</div>';
  const el = document.getElementById('callList');
  if(state.lastCallsHtml !== html){ state.lastCallsHtml = html; el.innerHTML = html; updateTimers(); }
}

function findFirstEvent(events, codes){ return (events||[]).filter(e=>codes.includes(e.status_code)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))[0]?.created_at || null; }
function milestoneText(iso, target, start){ const sec = iso ? elapsed(iso) : elapsed(start); const cls = iso ? (sec>target?'text-red-400 font-bold':'text-green-400') : 'text-yellow-400'; return `<span class='${cls}'>${fmtDur(sec)}</span> / ${fmtDur(target)}`; }
function isUserInteracting(){ const a=document.activeElement; if(!a||a===document.body) return false; return ['INPUT','SELECT','TEXTAREA','BUTTON'].includes(a.tagName) || a.closest('#incidentPanel,#unitList,#callList')!==null; }
function savePanelForm(panelId){
  const panel=document.getElementById(panelId); if(!panel) return {};
  const state={};
  panel.querySelectorAll('input, select, textarea').forEach(el=>{
    if(el.type==='checkbox'||el.type==='radio') state[el.id]=el.checked;
    else if(el.tagName==='SELECT') state[el.id]=el.value;
    else state[el.id]=el.value;
  });
  return state;
}
function restorePanelForm(panelId, formState){
  const panel=document.getElementById(panelId); if(!panel) return;
  Object.entries(formState).forEach(([id,val])=>{
    const el=document.getElementById(id); if(!el) return;
    if(el.type==='checkbox'||el.type==='radio') el.checked=!!val;
    else if(el.tagName==='SELECT'){ el.value=val; if(!el.value&&Array.from(el.options).some(o=>o.value===val)) el.value=val; }
    else el.value=val;
  });
}

async function selectIncident(id){
  const prevSelected = state.selectedIncident;
  state.selectedIncident = id;
  const i = state.incidents.find(x=>x.id===id);
  renderCalls();
  if(!i){ document.getElementById('incidentPanel').innerHTML = '<div class=\'p-2 text-slate-400\'>Incident not found</div>'; return; }
  let timeline = {};
  try { timeline = await api(`/incidents/${id}/timeline`); } catch(e){ log('Timeline error: '+e.message); }
  const a = state.agencyMap[i.agency_id]||{};
  const features = getAgencyFeatures(i.agency_id);
  const goals = getResponseGoals(i.agency_id);
  const discipline = getDisciplineFromAgency(i.agency_id);
  const assigned = state.units.filter(u=>u.current_incident_id===i.id);
  const availOpts = state.units.filter(u=>['AQ','Available'].includes(u.current_status)).map(u=>`<option value='${u.id}'>${u.call_sign}</option>`).join('');
  await loadDestinations(i.agency_id);
  const destOpts = getDestinationOptions(i.agency_id);
  const start = i.call_entry_started_at || i.created_at;
  const dispatchedAt = findFirstEvent(timeline.events, ['AK','dispatched']);
  const enRouteAt = findFirstEvent(timeline.events, ['ER','en_route']);
  const onSceneAt = findFirstEvent(timeline.events, ['OS','on_scene']);
  const transportAt = findFirstEvent(timeline.events, ['TR','ED']);
  const narrative = (i.narrative||'').replace(/\n/g,'<br>');
  const quickStampLabels = QUICK_STAMPS[discipline] || QUICK_STAMPS.fire;
  const quickStamps = quickStampLabels.map(l=>`<button type='button' class='px-2 py-0.5 bg-slate-700 hover:bg-slate-600 rounded text-xs' onclick='insertQuickStamp(${JSON.stringify(l).replace(/'/g,"&#39;")})'>${l}</button>`).join('');

async function loadRecommendations(id){
  const el = document.getElementById('recs'); if(!el) return;
  try {
    const recs = await api(`/incidents/${id}/recommend`);
    el.innerHTML = recs.length ? recs.map((r,i)=>{
      const eta = r.eta_minutes!=null ? `${r.eta_minutes} min` : '-';
      const dist = r.distance_miles!=null ? `${r.distance_miles.toFixed(1)} mi` : '-';
      const cls = r.eligible ? 'text-slate-300' : 'text-slate-500';
      const btn = r.eligible ? `<button class='bg-blue-700 hover:bg-blue-600 px-1.5 py-0.5 rounded text-[10px] text-white' onclick='dispatchRecommended(${r.unit_id})'>Assign</button>` : `<span class='text-slate-600 text-[10px]'>ineligible</span>`;
      return `<div class='flex items-center justify-between gap-2 ${cls}' title='${r.reason}'>
        <div class='flex items-center gap-1 min-w-0'>
          <span class='font-mono w-4 opacity-60'>${i+1}</span>
          <span class='font-semibold truncate'>${r.call_sign}</span>
          <span class='text-slate-500'>${r.unit_type||'-'}</span>
          <span class='text-slate-500 whitespace-nowrap'>${eta} · ${dist}</span>
        </div>
        ${btn}
      </div>`;
    }).join('') : '<div class=\'text-slate-500\'>No available recommended units</div>';
  } catch(e){ el.innerHTML = '<div class=\'text-slate-500\'>Recommendations unavailable</div>'; }
}

async function loadDestination(id){
  const el = document.getElementById('destinationPanel'); if(!el) return;
  try {
    const dest = await api(`/incidents/${id}/destination`);
    state.destinations[id] = dest;
    const d = dest.destination || {};
    const n = dest.notes || {};
    const details = d.details || {};
    const notes = Object.entries(n).map(([k,v])=> v ? `<div class='text-xs text-slate-300'><span class='text-slate-400 capitalize'>${k}:</span> ${v}</div>` : '').filter(Boolean).join('');
    const detailRows = Object.entries(details).map(([k,v])=>{
      if(!v || (Array.isArray(v) && !v.length)) return '';
      const label = k.replace(/_/g,' ');
      const value = Array.isArray(v) ? v.join(', ') : v;
      return `<div class='text-xs text-slate-300'><span class='text-slate-400 capitalize'>${label}:</span> ${value}</div>`;
    }).filter(Boolean).join('');
    const status = await getDestinationStatus(d.id);
    const statusBadge = status ? `<span class='ml-2 px-1.5 py-0.5 rounded text-xs ${statusColor(status.status)}'>${status.status.toUpperCase()}${status.reason ? ': '+status.reason : ''}</span>` : '';
    el.innerHTML = `<div class='text-xs font-semibold text-slate-400 mb-1'>Destination</div>
      <div class='flex items-center gap-1'><span class='text-sm font-bold text-white'>${d.name||'-'}</span>${statusBadge}</div>
      <div class='text-xs text-slate-300'>${d.address||''} ${d.category ? '('+d.category+')' : ''}</div>
      <div class='mt-1'>${notes || '<span class="text-slate-500">No notes</span>'}</div>
      <div class='mt-1 pt-1 border-t border-slate-700'>${detailRows || '<span class="text-slate-500">No facility details</span>'}</div>
      <button class='mt-2 px-2 py-1 bg-blue-700 hover:bg-blue-600 rounded text-xs' onclick='relayDestination(${id})'>Relay to crew</button>`;
  } catch(e){ el.innerHTML = `<div class='text-xs font-semibold text-slate-400 mb-1'>Destination</div><div class='text-xs text-slate-500'>No destination set</div>`; }
}

async function getDestinationStatus(destId){
  if(!destId) return null;
  try { const s = await api(`/destinations/${destId}/status?limit=1`); return s && s.length ? s[0] : null; } catch(e){ return null; }
}

function statusColor(status){
  const col = {open:'bg-green-700', divert:'bg-red-700', on_hold:'bg-yellow-700', full:'bg-orange-700', closed:'bg-slate-700'}[status] || 'bg-slate-700';
  return col;
}

async function relayDestination(id){
  const dest = state.destinations[id]; if(!dest) return;
  const d = dest.destination || {}; const n = dest.notes || {};
  const text = 'DEST ' + (d.name||'') + ' ' + (d.address||'') + ' ' + Object.entries(n).map(([k,v])=>`${k}:${v}`).join(' ');
  try { await api('/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({incident_id:id, channel:'mdt', message_text:text})}); log('Destination relayed to crew'); } catch(e){ log('Relay error: '+e.message); }
}

async function exportEpcr(){
  if(!state.selectedIncident) return;
  const dest = state.destinations[state.selectedIncident];
  const destId = dest && dest.destination_id ? dest.destination_id : null;
  try {
    const res = await api(`/incidents/${state.selectedIncident}/epcr`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({incident_id:state.selectedIncident, destination_id:destId})});
    log(`ePCR export created: ${res.id}`);
    alert(`ePCR export generated (ID ${res.id}).`);
  } catch(e){ log('ePCR export error: '+e.message); }
}

async function loadMileage(id){
  const el = document.getElementById('mileagePanel'); if(!el) return;
  try {
    const readings = await api(`/incidents/${id}/mileage`);
    const unitMap = {}; state.units.forEach(u=>unitMap[u.id]=u.call_sign);

}

async function loadTransportLegs(id){
  const el = document.getElementById('transportLegsPanel'); if(!el) return;

async function loadDestinations(agencyId){
  if(!agencyId || (state.destinationsList && state.destinationsList[agencyId])) return;
  try {
    const list = await api(`/destinations?agency_id=${agencyId}`);
    if(!state.destinationsList) state.destinationsList = {};
    state.destinationsList[agencyId] = list;
  } catch(e){}
}
function getDestinationOptions(agencyId){
  const list = (state.destinationsList && state.destinationsList[agencyId]) || [];
  return `<option value=''>Select destination...</option>` + list.map(d=>`<option value='${d.id}'>${d.name}${d.category ? ' ('+d.category+')' : ''}</option>`).join('');
}

function incidentUnitStatusChanged(incidentId, unitId){
  const status = document.getElementById(`incUStat_${unitId}`).value;
  const needsDest = status === 'TR' || status === 'ED' || status === 'DEL';
  const dest = document.getElementById(`incUDest_${unitId}`);
  const mile = document.getElementById(`incUMile_${unitId}`);
  if(dest) dest.classList.toggle('hidden', !needsDest);
  if(mile) mile.classList.toggle('hidden', !needsDest);
}

function handleIncidentUnitStatusChange(incidentId, unitId){
  incidentUnitStatusChanged(incidentId, unitId);
  setIncidentUnitStatus(incidentId, unitId, true);
}

async function setIncidentUnitStatus(incidentId, unitId, silent=false){
  const s = document.getElementById(`incUStat_${unitId}`).value; if(!s) return;
  const destEl = document.getElementById(`incUDest_${unitId}`);
  const mileEl = document.getElementById(`incUMile_${unitId}`);
  const needsDest = s === 'TR' || s === 'ED' || s === 'DEL';
  const body = {status_code: s};
  if(needsDest && destEl && destEl.value) body.destination_id = parseInt(destEl.value);
  if(needsDest && mileEl && mileEl.value) body.mileage = parseFloat(mileEl.value);
  if(needsDest && !body.destination_id){ if(!silent) alert('Select a destination for transport status'); return; }
  try {
    await api(`/incidents/${incidentId}/units/${unitId}/status`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    log(`Unit ${(state.units.find(u=>u.id===unitId)||{}).call_sign} set to ${statusLabel(s)}`);
    await load();
  } catch(e){ log('Status error: '+e.message); }
}

function insertQuickStamp(label){
  const ta = document.getElementById('incNote'); if(!ta) return;
  const now = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  const line = `[${now}] ${label}`;
  ta.value += (ta.value ? '\n' : '') + line;
}

async function addIncidentNote(incidentId){
  const ta = document.getElementById('incNote'); if(!ta || !ta.value.trim()) return;
  try {
    await api(`/incidents/${incidentId}/notes`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({note: ta.value.trim()})});
    log('Note added');
    ta.value = '';
    await load();
    selectIncident(incidentId);
  } catch(e){ log('Note error: '+e.message); }
}

async function loadIncidentPersonnel(incidentId){
  const el = document.getElementById('personnelList'); if(!el) return;
  try {
    const list = await api(`/incidents/${incidentId}/personnel`);
    if(!list.length){ el.innerHTML = '<div class="text-slate-500">No responding personnel</div>'; return; }
    const rows = list.map(p=>{
      const name = p.personnel ? `${p.personnel.first_name} ${p.personnel.last_name}` : 'Responder';
      return `<div class='text-xs text-slate-300 flex gap-2 items-center'><b>${name}</b> ${p.responding_vehicle||''} <span class='text-slate-400'>${statusLabel(p.status)}</span>
        <select id='ppStat_${p.id}' class='bg-slate-800 border border-slate-600 rounded px-1 py-0.5 text-xs'><option value='en_route'>En Route</option><option value='arrived'>Arrived</option><option value='cleared'>Cleared</option></select>
        <button class='bg-blue-700 hover:bg-blue-600 px-1 py-0.5 rounded text-xs' onclick='updatePersonnelStatus(${incidentId},${p.id})'>Set</button>
      </div>`;
    }).join('');
    el.innerHTML = rows;
  } catch(e){ el.innerHTML = '<div class="text-slate-500">No responding personnel</div>'; }

async function addRespondingPersonnel(incidentId){
  const pid = document.getElementById('addPersonnelSel').value;
  const vehicle = document.getElementById('addPersonnelVehicle').value || 'Personal vehicle';
  if(!pid){ log('Select a responder'); return; }
  try {
    await api(`/incidents/${incidentId}/personnel`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({personnel_id:parseInt(pid), responding_vehicle:vehicle})});
    log('Responder added'); await load(); loadIncidentPersonnel(incidentId);
  } catch(e){ log('Personnel add error: '+e.message); }
}

async function updatePersonnelStatus(incidentId, ipId){
  const s = document.getElementById(`ppStat_${ipId}`).value;
  try {
    await api(`/incidents/${incidentId}/personnel/${ipId}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status:s})});
    log('Responder status updated'); await load(); loadIncidentPersonnel(incidentId);
  } catch(e){ log('Personnel status error: '+e.message); }
}

async function generateFireReport(incidentId){
  try {
    const r = await api(`/incidents/${incidentId}/fire-report`);
    const blob = new Blob([JSON.stringify(r, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download = `fire-report-${incidentId}.json`; a.click(); URL.revokeObjectURL(url);
    log('Fire report downloaded');
  } catch(e){ log('Fire report error: '+e.message); }
}

async function dispatchSelected(){
  const uid = document.getElementById('dispUnit').value;
  if(!uid || !state.selectedIncident) return;
  try { await api(`/incidents/${state.selectedIncident}/dispatch/${uid}`, {method:'POST'}); log(`Dispatched unit ${uid} to ${state.selectedIncident}`); await load(); } catch(e){ log('Dispatch error: '+e.message); }
}
window.dispatchRecommended = async function(unitId){
  if(!unitId || !state.selectedIncident) return;

async function closeSelected(){

  try { await api(`/incidents/${state.selectedIncident}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status:'closed'})}); log(`Closed ${state.selectedIncident}`); state.selectedIncident=null; await load(); } catch(e){ log('Close error: '+e.message); }
}

function renderUnits(){
  const filtered = state.units.filter(u=>matchesDiscipline((state.agencyMap[u.agency_id]||{}).agency_type));
  document.getElementById('unitCount').textContent = filtered.length;
  const rows = filtered.map(u=>{
    const a=state.agencyMap[u.agency_id]||{};
    const inc = u.current_incident_id ? (state.incidents.find(i=>i.id===u.current_incident_id)?.call_number||u.current_incident_id) : '-';
    const onCall = ['OS','ER','TR','AK','dispatched','LUN','OOS','MAINT','DEL','NPF'].includes(u.current_status);
    const availIso = u.current_status==='AQ' ? (u.last_assigned_at || u.in_service_at) : '';
    const sceneIso = u.current_status==='OS' ? u.last_assigned_at : '';
    const callAcc = u.accumulated_call_seconds || 0;
    const callIso = onCall && u.last_assigned_at ? u.last_assigned_at : '';
    const shiftIso = u.in_service_at || '';
    const staleClass = u.offline ? 'bg-slate-900 text-slate-500' : u.stale ? 'bg-orange-950 text-orange-400' : '';
    const staleText = u.offline ? ' (Offline)' : u.stale ? ' (Stale)' : '';
    return `<tr class='${unitClass(u.current_status)} ${state.selectedUnit===u.id?'selected':''}' onclick='selectUnit(${u.id})'>
      <td class='font-bold'>${u.call_sign}</td>
      <td>${a.agency_type ? a.agency_type.toUpperCase() : '-'}</td>
      <td class='${staleClass}'>${statusLabel(u.current_status)}${staleText}</td>
      <td>${inc}</td>
      <td class='timer' data-fallback='-' data-iso='${availIso||''}'>-</td>
      <td class='timer' data-fallback='-' data-iso='${sceneIso||''}'>-</td>
      <td class='timer' data-fallback='-' data-acc='${callAcc}' data-iso='${callIso||''}'>-</td>
      <td class='timer' data-fallback='-' data-iso='${shiftIso||''}'>-</td>
      <td onclick='event.stopPropagation()'><select id='uStat_${u.id}' class='bg-slate-800 border border-slate-600 rounded px-1 py-0.5 text-xs' onclick='event.stopPropagation()' onchange='event.stopPropagation()'>${unitStatusOptions(a.agency_type, a.id, u.current_status)}</select><button class='ml-1 bg-blue-700 hover:bg-blue-600 px-1 py-0.5 rounded text-xs' onclick='event.stopPropagation();setUnitStatus(${u.id})'>Set</button></td>
    </tr>`;
  }).join('');
  const html = rows ? `<table class='tbl'><thead><tr><th>Unit</th><th>Type</th><th>Status</th><th>Call</th><th>Avail</th><th>Scene</th><th>Call T</th><th>Shift</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table>` : '<div class=\'p-2 text-slate-500\'>No units</div>';
  const el = document.getElementById('unitList');
  if(state.lastUnitsHtml !== html){ state.lastUnitsHtml = html; el.innerHTML = html; updateTimers(); }
}

function updateTimers(){
  // SLA / elapsed timers on active calls
  document.querySelectorAll('[data-timer="sla"]').forEach(el=>{
    const iso = el.dataset.iso; if(!iso) return;
    const target = parseInt(el.dataset.target,10)||420;
    const sec = elapsed(iso);
    el.innerHTML = `${fmtDur(sec)}<br><span class='text-slate-500'>/${fmtDur(target)}</span>`;
    el.className = `timer ${slaClass(sec,target)}`;
  });
  // Generic duration cells (unit board)
  document.querySelectorAll('td[data-iso]').forEach(el=>{
    if(el.dataset.timer === 'sla') return;
    const iso = el.dataset.iso;
    const acc = el.dataset.acc;
    let sec = null;
    if(acc !== undefined){
      sec = parseFloat(acc||0) + (iso ? elapsed(iso) : 0);
    } else if(iso){
      sec = elapsed(iso);
    }
    el.textContent = sec !== null ? fmtDur(sec) : (el.dataset.fallback || '-');
  });
}

function unitStatusOptions(type, agencyId, selectedCode=''){
  // Build options from customer config if available, otherwise defaults.
  const cfg = (state.configs && state.configs[agencyId]) || {};
  const custom = cfg.statuses;
  const features = getAgencyFeatures(agencyId);
  const showTransport = features.transport !== false;
  let codes;
  if(custom && custom.length){
    codes = custom.map(s=>s.code);
  } else {
    const police = ['AQ','AK','ER','OS','TR','CAN','LUN','AFR'];
    const fire = showTransport
      ? ['AQ','AK','ER','OS','WATER','EXT','OVER','TR','CAN','LUN','OOS','AFR','MAINT']
      : ['AQ','AK','ER','OS','WATER','EXT','OVER','CAN','LUN','OOS','AFR','MAINT'];
    const ems = showTransport
      ? ['AQ','AK','ER','OS','TR','DEL','CAN','NPF','AFR']
      : ['AQ','AK','ER','OS','CAN','NPF','AFR'];
    codes = {police,fire,ems}[type]||['AQ','AK','ER','OS','CAN'];
  }
  if(!showTransport){
    codes = codes.filter(c=>!['TR','ED','DEL'].includes(c));
  }
  return `<option value=''>Set...</option>` + codes.map(c=>`<option value='${c}' ${c===selectedCode?'selected':''}>${statusLabel(c)}</option>`).join('');
}
window.setUnitStatus = async function(unitId){ const s = document.getElementById('uStat_'+unitId).value; if(!s) return; const u=state.units.find(x=>x.id===unitId); const inc=state.incidents.find(i=>i.id===u.current_incident_id); const path=inc ? `/incidents/${inc.id}/units/${unitId}/status` : `/units/${unitId}/status`; try { await api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status_code:s})}); log(`Unit ${u.call_sign} set to ${statusLabel(s)}`); await load(); } catch(e){ log('Status error: '+e.message); } };

async function selectUnit(id){ state.selectedUnit=id; await loadTrails(id); renderUnits(); renderMap(); }

async function loadTrails(unitId){
  if(!unitId){ state.trails[unitId]=[]; return; }
  try {
    const pts = await api(`/taip/positions?unit_id=${unitId}&limit=50`);
    state.trails[unitId] = pts.reverse().filter(p=>p.lat!=null && p.lng!=null);
  } catch(e){ state.trails[unitId]=[]; }
}

function renderMap(){
  if(!map) initMap();
  layers.units.clearLayers(); layers.incidents.clearLayers(); layers.trails.clearLayers(); layers.critical.clearLayers(); layers.serviceAreas.clearLayers();
  let bounds=L.latLngBounds([]);
  const a=state.incidents.find(i=>i.id===state.selectedIncident);
  // Service areas
  (state.postZones || []).forEach(z=>{
    if(!z.geojson) return;
    try{
      const c = z.color || serviceAreaColor(z.zone_type);
      const gj = L.geoJSON(z.geojson, {style:{color:c, fillColor:c, fillOpacity:0.1, weight:2}}).addTo(layers.serviceAreas);
      gj.bindPopup(`<b>${z.name}</b><br>${z.zone_type}`);
      if(gj.getBounds && gj.getBounds().isValid()) bounds.extend(gj.getBounds());
    }catch(e){}
  });
  function unitColor(u){
    if(u.offline) return '#334155';
    if(u.stale) return '#f97316';
    return u.current_status==='OS' ? '#ef4444' : u.current_status==='AQ' ? '#22c55e' : '#eab308';
  }
  state.units.forEach(u=>{
    if(u.lat==null || u.lng==null) return;
    const col = unitColor(u);
    const m = L.circleMarker([u.lat,u.lng],{radius:6,color:col,fillColor:col,fillOpacity:0.9,weight:2}).addTo(layers.units);
    const last=u.last_seen_at?new Date(u.last_seen_at).toLocaleTimeString():'unknown';
    const stateLabel=u.offline?'Offline':u.stale?'Stale':statusLabel(u.current_status);
    m.bindPopup(`<b>${u.call_sign}</b><br>${stateLabel}<br><span class='text-slate-400'>Last seen: ${last}</span><br>${u.speed!=null?u.speed+' mph • ':''}${u.heading!=null?u.heading+'°<br>':''}${state.agencyMap[u.agency_id]?.name||''}`);
    if(state.selectedUnit===u.id) m.openPopup();
    bounds.extend([u.lat,u.lng]);
  });
  state.incidents.forEach(i=>{
    const ag = state.agencyMap[i.agency_id]||{};
    const lat = i.lat!=null ? i.lat : (i.id===state.selectedIncident ? ag.lat : null);
    const lng = i.lng!=null ? i.lng : (i.id===state.selectedIncident ? ag.lng : null);
    if(lat==null || lng==null) return;
    const col = i.status==='closed' ? '#64748b' : i.priority===1 ? '#ef4444' : i.priority===2 ? '#f97316' : '#eab308';
    const m = L.circleMarker([lat,lng],{radius:8,color:col,fillColor:col,fillOpacity:0.6,weight:2}).addTo(layers.incidents);
    m.bindPopup(`<b>${i.call_number||i.incident_number}</b><br>${i.call_type}<br>${i.location_text||''}${(i.lat==null)?'<br><span class="text-slate-400">(agency location)</span>':''}`);
    bounds.extend([lat,lng]);
  });
  if(state.showTrails && state.selectedUnit && state.trails[state.selectedUnit] && state.trails[state.selectedUnit].length){
    const pts = state.trails[state.selectedUnit].map(p=>[p.lat,p.lng]);
    L.polyline(pts,{color:'#3b82f6', opacity:0.7, weight:2}).addTo(layers.trails);
    pts.forEach(p=>bounds.extend(p));
    const last = pts[pts.length-1];
    L.circleMarker(last,{radius:4, color:'#3b82f6', fillColor:'#3b82f6', fillOpacity:1}).addTo(layers.trails);
  }
  if(state.showCritical){
    state.mapLayers.filter(c=>c.lat!=null && c.lng!=null).forEach(c=>{
      const col = c.type==='hydrant' ? '#0ea5e9' : c.type==='hospital' ? '#ef4444' : '#22c55e';
      const m = L.circleMarker([c.lat,c.lng],{radius:4, color:col, fillColor:col, fillOpacity:0.8, weight:1}).addTo(layers.critical);
      m.bindPopup(`<b>${c.name}</b><br>${c.type}`);
      bounds.extend([c.lat,c.lng]);
    });
  }
  if(bounds.isValid()){
    map.fitBounds(bounds,{padding:[20,20],maxZoom:16});
  } else if(a && a.lat!=null && a.lng!=null){
    map.setView([a.lat,a.lng], 14);
  } else {
    // Fall back to primary/secondary service area if defined
    let zoneBounds = L.latLngBounds([]);
    (state.postZones || []).forEach(z=>{
      if(!z.geojson) return;
      try{
        const gl = L.geoJSON(z.geojson);
        if(gl.getBounds && gl.getBounds().isValid()) zoneBounds.extend(gl.getBounds());
      }catch(e){}
    });
    if(zoneBounds.isValid()){
      map.fitBounds(zoneBounds,{padding:[20,20],maxZoom:14});
    } else {
      const am = state.agencies.find(ag=>ag.id===state.units[0]?.agency_id) || state.agencies[0];
      if(am && am.lat!=null && am.lng!=null) map.setView([am.lat,am.lng], 11);
      else map.setView(DEFAULT_CENTER, 11);
    }
  }
  if(a){
    const ag = state.agencyMap[a.agency_id]||{};
    const lat = a.lat!=null ? a.lat : ag.lat;
    const lng = a.lng!=null ? a.lng : ag.lng;
    if(lat!=null && lng!=null){
      map.setView([lat,lng], 16, {animate:false});
      layers.incidents.getLayers().forEach(m=>{ if(m.getPopup().getContent().includes(a.call_number||a.incident_number)){ m.openPopup(); m.setStyle({radius:12, fillOpacity:0.9}); } });
    }
  }
}

function renderMessages(){
  const el = document.getElementById('msgList');
  el.innerHTML = state.messages.length ? state.messages.map(m=>{
    const t = m.sent_at ? new Date(m.sent_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '';
    const to = m.unit_id ? (state.units.find(u=>u.id===m.unit_id)?.call_sign || m.unit_id) : 'ALL';
    return `<div class='border-l-2 border-blue-500 pl-1'><span class='text-slate-500'>${t}</span> <b>${to}:</b> ${m.message_text||''}</div>`;
  }).join('') : '<div class=\'text-slate-500\'>No messages</div>';
  el.scrollTop=0;
}

async function sendMessage(){
  const sel = document.getElementById('msgUnit');
  const inp = document.getElementById('msgText');
  const text = inp.value.trim(); if(!text) return;
  const body = {message_text:text, channel:'mdt'};
  if(sel.value) body.unit_id = parseInt(sel.value);
  try { await api('/messages', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}); inp.value=''; await load(); } catch(e){ log('Message error: '+e.message); }
}

async function loadConfigs(){
  try {
    const cfg = await api('/config');
    const out = {};
    cfg.forEach(c=>{
      if(!out[c.agency_id]) out[c.agency_id] = {};
      out[c.agency_id][c.category] = c.value;
    });
    return out;
  } catch(e){ return {}; }
}

async function load(){
  try {
    const [agencies, units, incidents, messages, configs, postZones, personnel] = await Promise.all([api('/agencies'), api('/units'), api('/incidents'), api('/messages'), loadConfigs(), api('/post-zones'), api('/personnel')]);
    state.agencies = agencies; state.units = units; state.incidents = incidents; state.messages = messages; state.configs = configs; state.postZones = postZones; state.personnel = personnel;
    state.agencyMap = {}; state.agencies.forEach(a=>state.agencyMap[a.id]=a);
    const mapConfig = await api('/config?category=map_layers');
    const ml = mapConfig.find(c=>c.category==='map_layers' && c.key==='all')?.value || [];
    state.mapLayers = Array.isArray(ml) ? ml : [];
    const dsel = document.getElementById('disciplineSelect');
    if(dsel){
      const types = [...new Set(state.agencies.map(a=>a.agency_type).filter(Boolean))];
      const allowed = ['police','fire','ems'];
      const present = types.length ? types.filter(t=>allowed.includes(t)) : allowed;
      dsel.innerHTML = (present.length>1 ? `<option value='all'>All Disciplines</option>` : '') + present.map(t=>`<option value='${t}'>${t.charAt(0).toUpperCase()+t.slice(1)}</option>`).join('');
      if(present.length===1 && DISCIPLINE==='all') DISCIPLINE = present[0];
      dsel.value = DISCIPLINE;
      if(present.length<=1) dsel.classList.add('hidden');
      else dsel.classList.remove('hidden');
    }
    const lbl = document.getElementById('consoleLabel'); if(lbl) lbl.textContent = DISCIPLINE==='all' ? 'Console' : DISCIPLINE.toUpperCase()+' Console';
    const sel = document.getElementById('msgUnit');
    if(sel.options.length<=1){ state.units.forEach(u=>{ sel.innerHTML += `<option value='${u.id}'>${u.call_sign}</option>`; }); }
    renderCalls(); renderUnits(); renderMap(); renderMessages();
    if(state.selectedIncident){ selectIncident(state.selectedIncident); }
  } catch(e){ log('Load error: '+e.message); }
}

function updateClock(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }

document.getElementById('refreshBtn').addEventListener('click', load);
document.getElementById('msgSend').addEventListener('click', sendMessage);
document.getElementById('msgText').addEventListener('keydown', e=>{ if(e.key==='Enter') sendMessage(); });
document.getElementById('disciplineSelect').addEventListener('change', e=>{ DISCIPLINE = e.target.value; renderCalls(); renderUnits(); renderMap(); });
document.getElementById('trailToggle').addEventListener('change', e=>{ state.showTrails = e.target.checked; renderMap(); });
document.getElementById('critToggle').addEventListener('change', e=>{ state.showCritical = e.target.checked; renderMap(); });

function startStream(){
  if(!window.EventSource) return;
  const es = new EventSource('/taip/stream', {withCredentials:true});
  es.onmessage = e => {
    const positions = JSON.parse(e.data);
    positions.forEach(p => { const u=state.units.find(x=>x.id===p.id); if(u){ u.lat=p.lat; u.lng=p.lng; u.heading=p.heading; u.speed=p.speed; u.last_seen_at=p.last_seen_at; u.current_status=p.current_status; u.stale=p.stale; u.offline=p.offline; } });
    renderMap(); renderUnits();
  };
  es.onerror = () => { es.close(); setTimeout(startStream, 5000); };
}

initLayout();
initMap();
load();
startStream();
updateClock(); setInterval(updateClock,1000);

(async function(){
  try {
    const me = await api('/me');
    if(me.role !== 'dispatcher'){
      const dash = document.getElementById('dashLink');
      if(dash) dash.classList.remove('hidden');
    }
  } catch(e){}
})();
window.addEventListener('resize', ()=>{ if(map) map.invalidateSize(); });
setInterval(()=>{ if(document.getElementById('liveToggle').checked && !isUserInteracting()) load(); },10000);
setInterval(updateTimers,1000);
</script>
