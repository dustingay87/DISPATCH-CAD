<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>VolCAD Console</title>
<script src='https://cdn.tailwindcss.com'></script>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' crossorigin=''>
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js' crossorigin=''></script>
<style>
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; overflow:hidden; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .priority-1 { background:rgba(239,68,68,0.18); border-left:5px solid #ef4444; }
  .priority-2 { background:rgba(249,115,22,0.18); border-left:5px solid #f97316; }
  .priority-3 { background:rgba(234,179,8,0.18); border-left:5px solid #eab308; }
  .priority-4 { background:rgba(34,197,94,0.18); border-left:5px solid #22c55e; }
  .unit-os { background:rgba(239,68,68,0.18); border-left:5px solid #ef4444; }
  .unit-er { background:rgba(234,179,8,0.18); border-left:5px solid #eab308; }
  .unit-aq { background:rgba(34,197,94,0.18); border-left:5px solid #22c55e; }
  .unit-oth { background:rgba(100,116,139,0.18); border-left:5px solid #64748b; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:0.25rem; overflow:hidden; display:flex; flex-direction:column; }
  .card-head { background:#0f172a; padding:0.25rem 0.5rem; font-weight:600; border-bottom:1px solid #334155; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.03em; }
  .card-body { padding:0.25rem; overflow:auto; flex:1; }
  .tbl { width:100%; border-collapse:collapse; font-size:0.7rem; }
  .tbl th { background:#0f172a; padding:0.2rem 0.35rem; text-align:left; text-transform:uppercase; font-size:0.6rem; color:#94a3b8; }
  .tbl td { padding:0.25rem 0.35rem; border-bottom:1px solid #334155; vertical-align:top; }
  .tbl tr { cursor:pointer; }
  .tbl tr:hover { background:rgba(255,255,255,0.05); }
  .timer { font-variant-numeric:tabular-nums; }
  .selected { outline:2px solid #3b82f6; }
  #map { width:100%; height:100%; background:#0f172a; }
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track { background:#0f172a; }
  ::-webkit-scrollbar-thumb { background:#475569; border-radius:3px; }
</style>
</head>
<body class='bg-slate-900 text-slate-200 text-xs h-screen flex flex-col'>
  <header class='h-12 bg-slate-950 border-b border-slate-700 flex items-center px-2 gap-2 shrink-0'>
    <div class='font-bold text-lg tracking-wide text-white'>VolCAD <span class='text-slate-500 font-normal text-xs'><span id='consoleLabel'>Console</span></span></div>
    <select id='disciplineSelect' class='bg-slate-800 border border-slate-600 rounded px-1 py-1 text-xs'><option value='all'>All Disciplines</option><option value='police'>Police</option><option value='fire'>Fire</option><option value='ems'>EMS</option></select>
    <input id='cmdInput' type='text' class='flex-1 bg-slate-800 border border-slate-600 rounded px-2 py-1 text-xs' placeholder='Command (d <call> <unit>, c <call>, s <unit> <status>)'>
    <button id='cmdBtn' class='bg-blue-700 hover:bg-blue-600 text-white px-2 py-1 rounded'>Run</button>
    <div class='text-slate-400 font-mono' id='clock'>--:--:--</div>
    <label class='flex items-center space-x-1'><input id='liveToggle' type='checkbox' checked class='accent-blue-500'> <span>Live</span></label>
    <button id='refreshBtn' class='bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded'>Refresh</button>
    <a href='/' class='bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-white'>Dash</a>
    <a href='/call-entry' class='bg-green-700 hover:bg-green-600 px-2 py-1 rounded text-white'>Call Entry</a>
    <a href='/mdt?unit_id=1' target='_blank' class='bg-purple-700 hover:bg-purple-600 px-2 py-1 rounded text-white'>MDT</a>
    <a href='/avl' target='_blank' class='bg-cyan-700 hover:bg-cyan-600 px-2 py-1 rounded text-white'>AVL</a>
  </header>
  <main class='flex-1 grid grid-cols-12 gap-1 p-1 overflow-hidden'>
    <aside class='col-span-3 flex flex-col gap-1 min-h-0'>
      <div class='card flex-1 min-h-0'>
        <div class='card-head flex justify-between'><span>Active Calls</span><span id='callCount' class='text-slate-400'>0</span></div>
        <div id='callList' class='card-body'></div>
      </div>
    </aside>
    <section class='col-span-5 flex flex-col gap-1 min-h-0'>
      <div id='incidentPanel' class='card flex-1 min-h-0 overflow-auto'>
        <div class='card-head'>Incident Workspace</div>
        <div class='p-2 text-slate-400'>Select a call from the left.</div>
      </div>
      <div class='card h-1/2 min-h-0'>
        <div class='card-head'>Map</div>
        <div class='card-body p-0'><div id='map'></div></div>
      </div>
    </section>
    <aside class='col-span-4 flex flex-col gap-1 min-h-0'>
      <div class='card flex-1 min-h-0'>
        <div class='card-head flex justify-between'><span>Unit Board</span><span id='unitCount' class='text-slate-400'>0</span></div>
        <div id='unitList' class='card-body'></div>
      </div>
    </aside>
  </main>
  <footer class='h-36 shrink-0 p-1 flex gap-1 min-h-0'>
    <div class='card w-1/2'>
      <div class='card-head'>Event Log</div>
      <div id='eventLog' class='card-body log font-mono text-slate-300 space-y-0.5'></div>
    </div>
    <div class='card w-1/2 flex flex-col'>
      <div class='card-head'>Messages</div>
      <div id='msgList' class='card-body log text-slate-300 space-y-0.5'></div>
      <div class='flex p-1 gap-1 border-t border-slate-700'>
        <select id='msgUnit' class='bg-slate-800 border border-slate-600 rounded px-1 text-xs'><option value=''>All</option></select>
        <input id='msgText' type='text' class='flex-1 bg-slate-800 border border-slate-600 rounded px-2 text-xs' placeholder='Message...'>
        <button id='msgSend' class='bg-blue-700 hover:bg-blue-600 px-2 rounded'>Send</button>
      </div>
    </div>
  </footer>
<script>
const CONFIG = { center:[39.9612,-82.9988], zoom:11 };
let state = { agencies:[], units:[], incidents:[], messages:[], personnel:[], agencyMap:{}, selectedIncident:null, selectedUnit:null, logs:[] };
const pathDisc = window.location.pathname.replace(/^\/|\/$/g,'');
let DISCIPLINE = ['police','fire','ems'].includes(pathDisc) ? pathDisc : (new URLSearchParams(window.location.search).get('discipline') || 'all');
let map, layers;

function api(path, opts={}){ return fetch(path, {...opts, credentials:'include'}).then(r=>{ if(r.status===401){ window.location.href='/login'; throw new Error('Unauthorized'); } if(!r.ok) throw new Error(`${path} ${r.status}`); return r.json(); }); }
function fmtTime(iso){ if(!iso) return '-'; const d=new Date(iso); return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function toMs(iso){ return iso ? new Date(iso).getTime() : Date.now(); }
function fmtDur(s){ const h=Math.floor(s/3600); const m=Math.floor((s%3600)/60); const sec=Math.floor(s%60); return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }
function elapsed(iso){ return (Date.now()-toMs(iso))/1000; }
function priorityTarget(p){ return {1:180,2:420,3:720,4:1200}[Math.min(Math.max(p||2,1),4)] || 420; }
function slaClass(sec,target){ return sec>target ? 'text-red-400 font-bold' : 'text-slate-400'; }
function unitClass(st){ if(st==='OS') return 'unit-os'; if(st==='ER'||st==='TR'||st==='DEL') return 'unit-er'; if(st==='AQ') return 'unit-aq'; return 'unit-oth'; }
function matchesDiscipline(t){ return DISCIPLINE==='all' || t===DISCIPLINE; }
function log(msg){ state.logs.unshift(`${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})} ${msg}`); if(state.logs.length>100) state.logs.pop(); renderLog(); }

function initMap(){
  map = L.map('map').setView(CONFIG.center, CONFIG.zoom);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{ attribution:'&copy; OpenStreetMap' }).addTo(map);
  layers = { units:L.layerGroup().addTo(map), incidents:L.layerGroup().addTo(map) };
}

function renderLog(){ const el=document.getElementById('eventLog'); el.innerHTML = state.logs.map(l=>`<div class='border-l-2 border-slate-600 pl-1'>${l}</div>`).join(''); el.scrollTop=0; }

function renderCalls(){
  const active = state.incidents.filter(i=>i.status!=='closed' && matchesDiscipline((state.agencyMap[i.agency_id]||{}).agency_type)).sort((a,b)=> (a.priority||2)-(b.priority||2) || new Date(b.created_at)-new Date(a.created_at));
  document.getElementById('callCount').textContent = active.length;
  const html = active.length ? `<table class='tbl'><thead><tr><th>#</th><th>Type</th><th>Pri</th><th>Status</th><th>Loc</th><th>Units</th><th>SLA</th></tr></thead><tbody>` + active.map(i=>{
    const a=state.agencyMap[i.agency_id]||{};
    const sec=elapsed(i.created_at);
    const target=priorityTarget(i.priority);
    const assigned=state.units.filter(u=>u.current_incident_id===i.id).map(u=>u.call_sign).join(', ')||'-'; 
    const cls = state.selectedIncident===i.id ? 'selected' : '';
    return `<tr class='priority-${Math.min(Math.max(i.priority||2,1),4)} ${cls}' onclick='selectIncident(${i.id})'>
      <td class='font-bold'>${i.call_number||i.incident_number}</td>
      <td>${i.call_type}</td>
      <td class='text-center'>P${i.priority}</td>
      <td>${i.status}</td>
      <td>${i.location_text||'-'}</td>
      <td>${assigned}</td>
      <td class='timer ${slaClass(sec,target)}'>${fmtDur(sec)}<br><span class='text-slate-500'>/${fmtDur(target)}</span></td>
    </tr>`;
  }).join('') + '</tbody></table>' : '<div class=\'p-2 text-slate-500\'>No active calls</div>';
  document.getElementById('callList').innerHTML = html;
}

async function selectIncident(id){
  state.selectedIncident = id;
  const i = state.incidents.find(x=>x.id===id);
  renderCalls();
  if(!i){ document.getElementById('incidentPanel').innerHTML = '<div class=\'p-2 text-slate-400\'>Incident not found</div>'; return; }
  let timeline = {};
  try { timeline = await api(`/incidents/${id}/timeline`); } catch(e){ log('Timeline error: '+e.message); }
  const a = state.agencyMap[i.agency_id]||{};
  const assigned = state.units.filter(u=>u.current_incident_id===i.id);
  const availOpts = state.units.filter(u=>['AQ','Available'].includes(u.current_status)).map(u=>`<option value='${u.id}'>${u.call_sign}</option>`).join('');
  const sec=elapsed(i.created_at); const target=priorityTarget(i.priority);
  document.getElementById('incidentPanel').innerHTML = `
    <div class='card-head'>${i.call_number||i.incident_number} <span class='text-slate-400'>${i.call_type}</span></div>
    <div class='p-2 space-y-2'>
      <div class='flex flex-wrap gap-4 text-xs text-slate-400'>
        <span>Agency: <b class='text-white'>${a.name||'-'}</b></span>
        <span>Priority: <b class='text-white'>P${i.priority}</b></span>
        <span>Status: <b class='text-white'>${i.status}</b></span>
        <span class='${slaClass(sec,target)}'>Elapsed: ${fmtDur(sec)} / Target: ${fmtDur(target)}</span>
      </div>
      <div class='text-xs text-slate-400'>Location: <b class='text-white'>${i.location_text||'-'}</b></div>
      <div class='text-xs text-slate-400'>Caller: <b class='text-white'>${i.caller_name||'-'} ${i.callback||''}</b></div>
      <div class='text-xs'>${i.narrative||'No narrative'}</div>
      <div class='flex gap-2'>
        <select id='dispUnit' class='bg-slate-800 border border-slate-600 rounded px-1 py-0.5 text-xs'><option value=''>Unit</option>${availOpts}</select>
        <button class='bg-blue-700 hover:bg-blue-600 px-2 py-0.5 rounded text-xs' onclick='dispatchSelected()'>Dispatch</button>
        <button class='bg-red-800 hover:bg-red-700 px-2 py-0.5 rounded text-xs' onclick='closeSelected()'>Close</button>
      </div>
      <div class='text-xs text-slate-300'>
        <b>Assigned:</b> ${assigned.map(u=>`${u.call_sign} (${u.current_status})`).join(', ') || 'none'}
      </div>
      <div class='border-t border-slate-700 pt-2'>
        <div class='text-xs font-semibold text-slate-400 mb-1'>Timeline</div>
        <div class='space-y-1 text-xs'>${(timeline.events||[]).slice(0,6).map(e=>`<div class='text-slate-300'>${fmtTime(e.created_at)} ${e.status_code} ${e.reason||''}</div>`).join('') || '<div class=\'text-slate-500\'>No events</div>'}</div>
      </div>
      <div class='border-t border-slate-700 pt-2'>
        <div class='text-xs font-semibold text-slate-400 mb-1'>Recommended Units</div>
        <div id='recs' class='space-y-1 text-xs text-slate-300'>Loading...</div>
      </div>
    </div>`;
  await loadRecommendations(i.id);
  renderMap();
}

async function loadRecommendations(id){
  const el = document.getElementById('recs'); if(!el) return;
  try {
    const recs = await api(`/incidents/${id}/recommend`);
    el.innerHTML = recs.length ? recs.map(r=>`<div class='text-slate-300'>${r.call_sign} (${r.unit_type}) <span class='text-slate-500'>${r.distance_miles!=null ? r.distance_miles.toFixed(1)+' mi' : 'no loc'}</span> <span class='text-blue-400'>${r.reason}</span></div>`).join('') : '<div class=\'text-slate-500\'>No available recommended units</div>';
  } catch(e){ el.innerHTML = '<div class=\'text-slate-500\'>Recommendations unavailable</div>'; }
}

async function dispatchSelected(){
  const uid = document.getElementById('dispUnit').value;
  if(!uid || !state.selectedIncident) return;
  try { await api(`/incidents/${state.selectedIncident}/dispatch/${uid}`, {method:'POST'}); log(`Dispatched unit ${uid} to ${state.selectedIncident}`); await load(); } catch(e){ log('Dispatch error: '+e.message); }
}
async function closeSelected(){
  if(!state.selectedIncident) return;
  try { await api(`/incidents/${state.selectedIncident}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status:'closed'})}); log(`Closed ${state.selectedIncident}`); state.selectedIncident=null; await load(); } catch(e){ log('Close error: '+e.message); }
}

function renderUnits(){
  const filtered = state.units.filter(u=>matchesDiscipline((state.agencyMap[u.agency_id]||{}).agency_type));
  document.getElementById('unitCount').textContent = filtered.length;
  const rows = filtered.map(u=>{
    const a=state.agencyMap[u.agency_id]||{};
    const inc = u.current_incident_id ? (state.incidents.find(i=>i.id===u.current_incident_id)?.call_number||u.current_incident_id) : '-';
    const t = uTimers(u);
    return `<tr class='${unitClass(u.current_status)} ${state.selectedUnit===u.id?'selected':''}' onclick='selectUnit(${u.id})'>
      <td class='font-bold'>${u.call_sign}</td>
      <td>${a.agency_type ? a.agency_type.toUpperCase() : '-'}</td>
      <td>${u.current_status}</td>
      <td>${inc}</td>
      <td class='timer'>${t.avail}</td>
      <td class='timer'>${t.scene}</td>
      <td class='timer'>${t.call}</td>
      <td class='timer'>${t.shift}</td>
    </tr>`;
  }).join('');
  document.getElementById('unitList').innerHTML = rows ? `<table class='tbl'><thead><tr><th>Unit</th><th>Type</th><th>Status</th><th>Call</th><th>Avail</th><th>Scene</th><th>Call T</th><th>Shift</th></tr></thead><tbody>${rows}</tbody></table>` : '<div class=\'p-2 text-slate-500\'>No units</div>';
}

function uTimers(u){
  const onCall = ['OS','ER','TR','AK','dispatched','LUN','OOS','MAINT','DEL','NPF'].includes(u.current_status);
  const last = elapsed(u.last_assigned_at);
  const avail = u.current_status==='AQ' ? fmtDur(last) : '-';
  const scene = u.current_status==='OS' ? fmtDur(last) : '-';
  let acc = u.accumulated_call_seconds || 0; if(onCall && u.last_assigned_at) acc += last;
  const shift = u.in_service_at ? fmtDur(elapsed(u.in_service_at)) : '-';
  return { avail, scene, call: fmtDur(acc), shift };
}

function selectUnit(id){ state.selectedUnit=id; renderUnits(); }

function renderMap(){
  if(!map) initMap();
  layers.units.clearLayers(); layers.incidents.clearLayers();
  const a=state.incidents.find(i=>i.id===state.selectedIncident);
  state.units.forEach(u=>{
    if(u.lat==null || u.lng==null) return;
    const col = u.current_status==='OS' ? '#ef4444' : u.current_status==='AQ' ? '#22c55e' : '#eab308';
    const m = L.circleMarker([u.lat,u.lng],{radius:6,color:col,fillColor:col,fillOpacity:0.9,weight:2}).addTo(layers.units);
    m.bindPopup(`<b>${u.call_sign}</b><br>${u.current_status}<br>${state.agencyMap[u.agency_id]?.name||''}`);
    if(state.selectedUnit===u.id) m.openPopup();
  });
  state.incidents.forEach(i=>{
    if(i.lat==null || i.lng==null) return;
    const col = i.status==='closed' ? '#64748b' : i.priority===1 ? '#ef4444' : i.priority===2 ? '#f97316' : '#eab308';
    const m = L.circleMarker([i.lat,i.lng],{radius:8,color:col,fillColor:col,fillOpacity:0.6,weight:2}).addTo(layers.incidents);
    m.bindPopup(`<b>${i.call_number||i.incident_number}</b><br>${i.call_type}<br>${i.location_text||''}`);
  });
  if(a && a.lat!=null && a.lng!=null){ map.setView([a.lat,a.lng], 14); layers.incidents.getLayers().forEach(m=>{ if(m.getPopup().getContent().includes(a.call_number||a.incident_number)) m.openPopup(); }); }
}

function renderMessages(){
  const el = document.getElementById('msgList');
  el.innerHTML = state.messages.length ? state.messages.map(m=>{
    const t = m.sent_at ? new Date(m.sent_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '';
    const to = m.unit_id ? (state.units.find(u=>u.id===m.unit_id)?.call_sign || m.unit_id) : 'ALL';
    return `<div class='border-l-2 border-blue-500 pl-1'><span class='text-slate-500'>${t}</span> <b>${to}:</b> ${m.message_text||''}</div>`;
  }).join('') : '<div class=\'text-slate-500\'>No messages</div>';
  el.scrollTop=0;
}

async function sendMessage(){
  const sel = document.getElementById('msgUnit');
  const inp = document.getElementById('msgText');
  const text = inp.value.trim(); if(!text) return;
  const body = {message_text:text, channel:'mdt'};
  if(sel.value) body.unit_id = parseInt(sel.value);
  try { await api('/messages', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}); inp.value=''; await load(); } catch(e){ log('Message error: '+e.message); }
}

async function runCommand(){
  const cmd = document.getElementById('cmdInput').value.trim(); if(!cmd) return;
  log('> '+cmd);
  const parts = cmd.split(/\s+/);
  try {
    if(parts[0]==='d' && parts.length>=3){
      const inc = state.incidents.find(i=>(i.call_number||i.incident_number)===parts[1]);
      const unit = state.units.find(u=>u.call_sign.toLowerCase()===parts[2].toLowerCase());
      if(!inc || !unit){ log('Call or unit not found'); return; }
      await api(`/incidents/${inc.id}/dispatch/${unit.id}`, {method:'POST'}); log('Dispatched '+unit.call_sign+' to '+inc.call_number); await load();
    } else if(parts[0]==='c' && parts.length>=2){
      const inc = state.incidents.find(i=>(i.call_number||i.incident_number)===parts[1]);
      if(!inc){ log('Call not found'); return; }
      await api(`/incidents/${inc.id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status:'closed'})}); log('Closed '+inc.call_number); await load();
    } else if(parts[0]==='s' && parts.length>=3){
      const unit = state.units.find(u=>u.call_sign.toLowerCase()===parts[1].toLowerCase());
      if(!unit){ log('Unit not found'); return; }
      log('Status command not yet wired to backend');
    } else { log('Unknown command'); }
  } catch(e){ log('Command error: '+e.message); }
  document.getElementById('cmdInput').value='';
}

async function load(){
  try {
    const [agencies, units, incidents, messages] = await Promise.all([api('/agencies'), api('/units'), api('/incidents'), api('/messages')]);
    state.agencies = agencies; state.units = units; state.incidents = incidents; state.messages = messages;
    state.agencyMap = {}; state.agencies.forEach(a=>state.agencyMap[a.id]=a);
    const dsel = document.getElementById('disciplineSelect'); if(dsel) dsel.value = DISCIPLINE;
    const lbl = document.getElementById('consoleLabel'); if(lbl) lbl.textContent = DISCIPLINE==='all' ? 'Console' : DISCIPLINE.toUpperCase()+' Console';
    const sel = document.getElementById('msgUnit');
    if(sel.options.length<=1){ state.units.forEach(u=>{ sel.innerHTML += `<option value='${u.id}'>${u.call_sign}</option>`; }); }
    renderCalls(); renderUnits(); renderMap(); renderMessages();
    if(state.selectedIncident){ selectIncident(state.selectedIncident); }
  } catch(e){ log('Load error: '+e.message); }
}

function updateClock(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }

document.getElementById('refreshBtn').addEventListener('click', load);
document.getElementById('cmdBtn').addEventListener('click', runCommand);
document.getElementById('cmdInput').addEventListener('keydown', e=>{ if(e.key==='Enter') runCommand(); });
document.getElementById('msgSend').addEventListener('click', sendMessage);
document.getElementById('msgText').addEventListener('keydown', e=>{ if(e.key==='Enter') sendMessage(); });
document.getElementById('disciplineSelect').addEventListener('change', e=>{ DISCIPLINE = e.target.value; renderCalls(); renderUnits(); renderMap(); });

initMap();
load();
updateClock(); setInterval(updateClock,1000);
setInterval(()=>{ if(document.getElementById('liveToggle').checked) load(); },5000);
setInterval(()=>{ renderUnits(); renderCalls(); },1000);
</script>
</body>
</html>
